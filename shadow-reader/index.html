gments":[]},{"id":23,"cueNo":24,"displayNo":24,"sourceUid":"merged-msag03l0-2112","uid":"merged-msag03l0-2112","originalCueNo":24,"vi":"Chú ấy là cái người đáng nghi mà bà chủ đã gặp hả?\nChắc thế.\nRốt cuộc cũng thành thế này.","ko":"그럼 할머니가 봤다는 수상한 남자도 그 아저씬가?\n아마도?\n(정예은) 결국 그렇게 됐네","en":"Maybe he's the \"strange man\" that the landlady mentioned?\nProbably.\nSo things turned out that way.","text":"Chú ấy là cái người đáng nghi mà bà chủ đã gặp hả?\nChắc thế.\nRốt cuộc cũng thành thế này.\\n그럼 할머니가 봤다는 수상한 남자도 그 아저씬가?\n아마도?\n(정예은) 결국 그렇게 됐네\\nMaybe he's the \"strange man\" that the landlady mentioned?\nProbably.\nSo things turned out that way.","koRange":{"start":462.024217,"end":469.022131},"viRange":{"start":419.85399,"end":425.072683},"start":419.85399,"end":469.022131,"koSentenceMarks":[465.683,466.977],"koShadowSegments":[{"index":0,"start":462.024217,"end":465.683,"text":"그럼 할머니가 봤다는 수상한 남자도 그 아저씬가?","speed":1,"cueUid":"merged-msag03l0-2112"},{"index":1,"start":465.683,"end":466.977,"text":"아마도?","speed":1,"cueUid":"merged-msag03l0-2112"},{"index":2,"start":466.977,"end":468.916,"text":"(정예은) 결국 그렇게 됐네","speed":1,"cueUid":"merged-msag03l0-2112"}],"hasShadow":true,"segments":[{"index":0,"start":462.024217,"end":465.683,"text":"그럼 할머니가 봤다는 수상한 남자도 그 아저씬가?","speed":1,"cueUid":"merged-msag03l0-2112"},{"index":1,"start":465.683,"end":466.977,"text":"아마도?","speed":1,"cueUid":"merged-msag03l0-2112"},{"index":2,"start":466.977,"end":468.916,"text":"(정예은) 결국 그렇게 됐네","speed":1,"cueUid":"merged-msag03l0-2112"}]},{"id":24,"cueNo":25,"displayNo":25,"sourceUid":"merged-msag0wge-2113","uid":"merged-msag0wge-2113","originalCueNo":25,"vi":"Chị bảo không phải mà.\nKhông phải như thế.\nVậy sao lại bám theo chị như thế?\nTóm lại là không biết thế nào hết, nên đừng tùy tiện mở cửa.","ko":"그런 사이 아니라더니\n그런 사이 아니야\n근데 왜 쫓아 다녀?\n아무튼 혹시 모르니까 함부로 문 열어주고 그러지 말라구","en":"You said it wasn't like that.\nWe are not like that.\nThen, why does he keep following you around?\nYou never know, so don't just open the door for anyone.","text":"Chị bảo không phải mà.\nKhông phải như thế.\nVậy sao lại bám theo chị như thế?\nTóm lại là không biết thế nào hết, nên đừng tùy tiện mở cửa.\\n그런 사이 아니라더니\n그런 사이 아니야\n근데 왜 쫓아 다녀?\n아무튼 혹시 모르니까 함부로 문 열어주고 그러지 말라구\\nYou said it wasn't like that.\nWe are not like that.\nThen, why does he keep following you around?\nYou never know, so don't just open the door for anyone.","koRange":{"start":469.022131,"end":481.880181},"viRange":{"start":425.072683,"end":438.842116},"start":425.072683,"end":481.880181,"koSentenceMarks":[471.095,472.287,475.501],"koShadowSegments":[{"index":0,"start":469.022131,"end":471.095,"text":"그런 사이 아니라더니","speed":1,"cueUid":"merged-msag0wge-2113"},{"index":1,"start":471.095,"end":472.287,"text":"그런 사이 아니야","speed":1,"cueUid":"merged-msag0wge-2113"},{"index":2,"start":472.287,"end":475.501,"text":"근데 왜 쫓아 다녀?","speed":1,"cueUid":"merged-msag0wge-2113"},{"index":3,"start":477,"end":481.82,"text":"아무튼 혹시 모르니까 함부로 문 열어주고 그러지 말라구","speed":1,"cueUid":"merged-msag0wge-2113"}],"hasShadow":true,"segments":[{"index":0,"start":469.022131,"end":471.095,"text":"그런 사이 아니라더니","speed":1,"cueUid":"merged-msag0wge-2113"},{"index":1,"start":471.095,"end":472.287,"text":"그런 사이 아니야","speed":1,"cueUid":"merged-msag0wge-2113"},{"index":2,"start":472.287,"end":475.501,"text":"근데 왜 쫓아 다녀?","speed":1,"cueUid":"merged-msag0wge-2113"},{"index":3,"start":477,"end":481.82,"text":"아무튼 혹시 모르니까 함부로 문 열어주고 그러지 말라구","speed":1,"cueUid":"merged-msag0wge-2113"}]},{"id":25,"cueNo":26,"displayNo":26,"sourceUid":"merged-msag2muo-2114","uid":"merged-msag2muo-2114","originalCueNo":26,"vi":"Đúng là chị Kang giỏi thu hút đàn ông! Bí quyết của chị là gì vậy?\nDễ dãi là được chứ sao.\nĐàn ông thích con gái dễ dãi mà.\nChính xác!","ko":"아휴, 아무튼 강언니 남자 복은 아주 타고났어, 도대체 비결이 뭐야?\n쉬워 보이면 돼\n- (유은재) [기침] - (정예은) 남자들은 쉬운 여자 좋아하잖아\n정답!\n흐흐","en":"You sure have a great fortune for men! What's your secret?\nJust be an easy woman.\nMen love that.\nCorrect answer!","text":"Đúng là chị Kang giỏi thu hút đàn ông! Bí quyết của chị là gì vậy?\nDễ dãi là được chứ sao.\nĐàn ông thích con gái dễ dãi mà.\nChính xác!\\n아휴, 아무튼 강언니 남자 복은 아주 타고났어, 도대체 비결이 뭐야?\n쉬워 보이면 돼\n- (유은재) [기침] - (정예은) 남자들은 쉬운 여자 좋아하잖아\n정답!\n흐흐\\nYou sure have a great fortune for men! What's your secret?\nJust be an easy woman.\nMen love that.\nCorrect answer!","koRange":{"start":481.880181,"end":503.320181},"viRange":{"start":438.842116,"end":457.958131},"start":438.842116,"end":503.320181,"koSentenceMarks":[487.65,488.861,492.821],"koShadowSegments":[{"index":0,"start":481.880181,"end":487.65,"text":"아휴, 아무튼 강언니 남자 복은 아주 타고났어, 도대체 비결이 뭐야?","speed":1,"cueUid":"merged-msag2muo-2114"},{"index":1,"start":487.637,"end":488.861,"text":"쉬워 보이면 돼","speed":1,"cueUid":"merged-msag2muo-2114"},{"index":2,"start":488.861,"end":492.821,"text":"- (유은재) [기침] - (정예은) 남자들은 쉬운 여자 좋아하잖아","speed":1,"cueUid":"merged-msag2muo-2114"},{"index":3,"start":499,"end":500.117,"text":"정답!","speed":1,"cueUid":"merged-msag2muo-2114"}],"hasShadow":true,"segments":[{"index":0,"start":481.880181,"end":487.65,"text":"아휴, 아무튼 강언니 남자 복은 아주 타고났어, 도대체 비결이 뭐야?","speed":1,"cueUid":"merged-msag2muo-2114"},{"index":1,"start":487.637,"end":488.861,"text":"쉬워 보이면 돼","speed":1,"cueUid":"merged-msag2muo-2114"},{"index":2,"start":488.861,"end":492.821,"text":"- (유은재) [기침] - (정예은) 남자들은 쉬운 여자 좋아하잖아","speed":1,"cueUid":"merged-msag2muo-2114"},{"index":3,"start":499,"end":500.117,"text":"정답!","speed":1,"cueUid":"merged-msag2muo-2114"}]},{"id":26,"cueNo":27,"displayNo":27,"sourceUid":"merged-msah1qlv-2115","uid":"merged-msah1qlv-2115","originalCueNo":27,"vi":"Cười vừa phải.\nĐong đưa mắt vừa phải.\nCúc áo cũng mở vừa phải.\nĐúng rồi, chính nó. Thời gian qua em đã quá kín đáo rồi.","ko":"적당히 웃어주고\n눈도 적당히 풀어주고\n단추도 적당히 풀고\n그래, 그거였어 내가 그동안 너무 철옹성이었어","en":"Smile, but not too much.\nGive a little glance, but not too much.\nAnd loosen a few buttons, but not too many.\nYes, that's right. I was doing it all wrong.","text":"Cười vừa phải.\nĐong đưa mắt vừa phải.\nCúc áo cũng mở vừa phải.\nĐúng rồi, chính nó. Thời gian qua em đã quá kín đáo rồi.\\n적당히 웃어주고\n눈도 적당히 풀어주고\n단추도 적당히 풀고\n그래, 그거였어 내가 그동안 너무 철옹성이었어\\nSmile, but not too much.\nGive a little glance, but not too much.\nAnd loosen a few buttons, but not too many.\nYes, that's right. I was doing it all wrong.","koRange":{"start":503.320181,"end":516.405},"viRange":{"start":457.958131,"end":472.989018},"start":457.958131,"end":516.405,"koSentenceMarks":[506.498,508.766,511.187],"koShadowSegments":[{"index":0,"start":503.320181,"end":506.498,"text":"적당히 웃어주고","speed":1,"cueUid":"merged-msah1qlv-2115"},{"index":1,"start":506.498,"end":508.766,"text":"눈도 적당히 풀어주고","speed":1,"cueUid":"merged-msah1qlv-2115"},{"index":2,"start":508.766,"end":511.187,"text":"단추도 적당히 풀고","speed":1,"cueUid":"merged-msah1qlv-2115"},{"index":3,"start":511.187,"end":516.405,"text":"그래, 그거였어 내가 그동안 너무 철옹성이었어","speed":1,"cueUid":"merged-msah1qlv-2115"}],"hasShadow":true,"segments":[{"index":0,"start":503.320181,"end":506.498,"text":"적당히 웃어주고","speed":1,"cueUid":"merged-msah1qlv-2115"},{"index":1,"start":506.498,"end":508.766,"text":"눈도 적당히 풀어주고","speed":1,"cueUid":"merged-msah1qlv-2115"},{"index":2,"start":508.766,"end":511.187,"text":"단추도 적당히 풀고","speed":1,"cueUid":"merged-msah1qlv-2115"},{"index":3,"start":511.187,"end":516.405,"text":"그래, 그거였어 내가 그동안 너무 철옹성이었어","speed":1,"cueUid":"merged-msah1qlv-2115"}]},{"id":27,"cueNo":28,"displayNo":28,"sourceUid":"merged-msah3xk3-2116","uid":"merged-msah3xk3-2116","originalCueNo":28,"vi":"Thấy sao? Đẹp không?\nChị thấy thích thú khi nghe đàn ông tỏ tình vậy sao?\nNgon quá. Nếu ăn hết rồi thì đứng dậy thôi nào.\nSao bảo hôm nay tâm trạng không tốt? Đứng dậy đi.\n- Đứng dậy đi nào! - Này!\nEm sao vậy? Gì?","ko":"어때, 헤퍼 보여 [웃음]\n좋아 남자가 좋다고 하면 아무나 다, 좋냐고?\n(송지원) 흐음 ['쩝쩝' 먹는 소리][맛있다는 듯] 흐음\n맛있다, 음, 다 먹었으면 그만 일어납시다\n정여사, 컨디션 안 좋다며? 그만 일어나자\n들어가 자자, 푹 자자 (강이나) 야!\n너 왜 그래? 뭐가?","en":"How do I look pretty?\nWould you like any man who says he likes you?\nThis is so good. If you're done, let's get up.\nYou said you're not feeling good today, right? Get up.\n-Let's go and sleep! -Hey!\nWhat is wrong with you? What?","text":"Thấy sao? Đẹp không?\nChị thấy thích thú khi nghe đàn ông tỏ tình vậy sao?\nNgon quá. Nếu ăn hết rồi thì đứng dậy thôi nào.\nSao bảo hôm nay tâm trạng không tốt? Đứng dậy đi.\n- Đứng dậy đi nào! - Này!\nEm sao vậy? Gì?\\n어때, 헤퍼 보여 [웃음]\n좋아 남자가 좋다고 하면 아무나 다, 좋냐고?\n(송지원) 흐음 ['쩝쩝' 먹는 소리][맛있다는 듯] 흐음\n맛있다, 음, 다 먹었으면 그만 일어납시다\n정여사, 컨디션 안 좋다며? 그만 일어나자\n들어가 자자, 푹 자자 (강이나) 야!\n너 왜 그래? 뭐가?\\nHow do I look pretty?\nWould you like any man who says he likes you?\nThis is so good. If you're done, let's get up.\nYou said you're not feeling good today, right? Get up.\n-Let's go and sleep! -Hey!\nWhat is wrong with you? What?","koRange":{"start":516.405352,"end":543.845533},"viRange":{"start":472.989018,"end":501.12954},"start":472.989018,"end":543.845533,"koSentenceMarks":[519.174,524.081,530.571,534.37,537.868,540.729],"koShadowSegments":[{"index":0,"start":516.405352,"end":519.174,"text":"어때, 헤퍼 보여 [웃음]","speed":1,"cueUid":"merged-msah3xk3-2116"},{"index":1,"start":519.174,"end":524.081,"text":"좋아 남자가 좋다고 하면 아무나 다, 좋냐고?","speed":1,"cueUid":"merged-msah3xk3-2116"},{"index":2,"start":524.081,"end":530.571,"text":"(송지원) 흐음 ['쩝쩝' 먹는 소리][맛있다는 듯] 흐음","speed":1,"cueUid":"merged-msah3xk3-2116"},{"index":3,"start":530.571,"end":534.37,"text":"맛있다, 음, 다 먹었으면 그만 일어납시다","speed":1,"cueUid":"merged-msah3xk3-2116"},{"index":4,"start":534.37,"end":537.868,"text":"정여사, 컨디션 안 좋다며? 그만 일어나자","speed":1,"cueUid":"merged-msah3xk3-2116"},{"index":5,"start":537.868,"end":540.729,"text":"들어가 자자, 푹 자자 (강이나) 야!","speed":1,"cueUid":"merged-msah3xk3-2116"},{"index":6,"start":540.729,"end":543.648,"text":"너 왜 그래? 뭐가?","speed":1,"cueUid":"merged-msah3xk3-2116"}],"hasShadow":true,"segments":[{"index":0,"start":516.405352,"end":519.174,"text":"어때, 헤퍼 보여 [웃음]","speed":1,"cueUid":"merged-msah3xk3-2116"},{"index":1,"star uốc giảm đau? Khỏi đi! \n[Mèo khóc] \nThế còn băng cá nhân? Không cần. Em xin lỗi.\n[Cằn nhằn]\nAnh mà hù em lần nữa chắc không toàn thây mất.\nTại anh xuất hiện bất ngờ đó.\nThì anh muốn tạo bất ngờ nên mới vậy. Chả lẽ phải thông báo trước?\nNgồi đi.\\n약 사올게요\n[화난 목소리로] \n무슨 약? - 진통제? 됐어\n[고양이 울음] \n밴드라도... - 밴드는 무슨, 씨...\n미안해요\n[툴툴거리며]\n서프라이즈 두 번 했다가는 변사체로 발견되겠어요\n갑자기 나타나니까...\n서프라이즈가 서프라이즈지 그럼? 나 나가요, 그러고 나가냐?\n앉아!\\nI'll go buy some medicine for you. \n[in an angry voice] \nWhat medicine?\nA pain reliever? I don't need it! \n[Cat crying] \nWhat about a band-aid? Not necessary. I am sorry.\n[Grunting]\nI'm going to be totally decimated if I try to surprise you again.\nIt's because you popped out of nowhere.\nA surprise doesn't need an advance warning.\nSit down.","koRange":{"start":1111,"end":1146.4015},"viRange":{"start":1064,"end":1079.525436},"start":1064,"end":1146.4015,"koSentenceMarks":[1113.627,1118.667,1123.923,1128.647,1133.578,1136,1140.015],"koShadowSegments":[{"index":0,"start":1111,"end":1113.627,"text":"약 사올게요","speed":1,"cueUid":"merged-msaj21ck-2148"},{"index":1,"start":1113.627,"end":1118.667,"text":"무슨 약? - 진통제? 됐어","speed":1,"cueUid":"merged-msaj21ck-2148"},{"index":2,"start":1118.667,"end":1123.923,"text":"밴드라도... - 밴드는 무슨, 씨...","speed":1,"cueUid":"merged-msaj21ck-2148"},{"index":3,"start":1126,"end":1128.647,"text":"미안해요","speed":1,"cueUid":"merged-msaj21ck-2148"},{"index":4,"start":1128.647,"end":1133.578,"text":"서프라이즈 두 번 했다가는 변사체로 발견되겠어요","speed":1,"cueUid":"merged-msaj21ck-2148"},{"index":5,"start":1133.578,"end":1136,"text":"갑자기 나타나니까...","speed":1,"cueUid":"merged-msaj21ck-2148"},{"index":6,"start":1136,"end":1140.015,"text":"서프라이즈가 서프라이즈지 그럼? 나 나가요, 그러고 나가냐?","speed":1,"cueUid":"merged-msaj21ck-2148"},{"index":7,"start":1145,"end":1146.146,"text":"앉아!","speed":1,"cueUid":"merged-msaj21ck-2148"}],"hasShadow":true,"segments":[{"index":0,"start":1111,"end":1113.627,"text":"약 사올게요","speed":1,"cueUid":"merged-msaj21ck-2148"},{"index":1,"st es are?\nIt'll be bad if it bruises!\nWhat? He's doing a hell of a good job! He deserves it!\nWhere did you learn this bad behavior?","text":"Chỗ em đánh là đau nhất luôn đó.\nĐỏ hết lên rồi.\nCó thể bị xuất huyết não.\nXuất huyết não đáng sợ lắm đấy.\nBị bầm thì sao đây?\nSao? Mấy lúc thế này phải huýt sáo cổ động mới phải lẽ!\nEm học cái thói ông chú đấy ở đâu đấy?\\n여기가 제일 아파 너한테 맞은 데\n빨개요\n내출혈 있을지도 몰라\n내출혈이 얼마나 무서운데\n멍들면 안 되는데\n(송지원) 왜? 이럴 땐 휘파람도 불어주고 그러는 게 예의 아닌감?\n어디서 그런 아저씨 같은 것만 보고 배웠어?\\nThis part hurts the most. The spot where you hit me.\nIt's all red.\nI might even get a brain hemorrhage.\nDo you know how scary brain hemorrhages are?\nIt'll be bad if it bruises!\nWhat? He's doing a hell of a good job! He deserves it!\nWhere did you learn this bad behavior?","koRange":{"start":1205.322902,"end":1291.442811},"viRange":{"start":1130.979411,"end":1158.975965},"start":1130.979411,"end":1291.442811,"koSentenceMarks":[1222.002,1224.25,1225.571,1227.615,1230.117,1289.054],"koShadowSegments":[{"index":0,"start":1219,"end":1222.002,"text":"여기가 제일 아파 너한테 맞은 데","speed":1,"cueUid":"merged-msb6qfv6-6"},{"index":1,"start":1223,"end":1224.25,"text":"빨개요","speed":1,"cueUid":"merged-msb6qfv6-6"},{"index":2,"start":1224.25,"end":1225.571,"text":"내출혈 있을지도 몰라","speed":1,"cueUid":"merged-msb6qfv6-6"},{"index":3,"start":1225.571,"end":1227.615,"text":"내출혈이 얼마나 무서운데","speed":1,"cueUid":"merged-msb6qfv6-6"},{"index":4,"start":1227.615,"end":1230.117,"text":"멍들면 안 되는데","speed":1,"cueUid":"merged-msb6qfv6-6"},{"index":5,"start":1285,"end":1289.054,"text":"(송지원) 왜? 이럴 땐 휘파람도 불어주고 그러는 게 예의 아닌감?","speed":1,"cueUid":"merged-msb6qfv6-6"},{"index":6,"start":1289.054,"end":1291.284,"text":"어디서 그런 아저씨 같은 것만 보고 배웠어?","speed":1,"cueUid":"merged-msb6qfv6-6"}],"hasShadow":true,"segments":[{"index":0,"start":1219,"end":1222.002,"text":"여기가 제일 아파 너한테 맞은 데","speed":1,"cueUid":"merged-msb6qfv6-6"},{"index":1,"start":1223,"end":1224.25,"text":"빨개요","speed":1,"cueUid":"merged-msb6qfv6-6"},{"index": ? What happened that day?\nTell me, damn it!\nI have nothing to say. Let go!","koRange":{"start":1439.402264,"end":1460.142951},"viRange":{"start":1307.351165,"end":1324.717007},"start":1307.351165,"end":1460.142951,"koSentenceMarks":[1450.824,1451.985,1453.682,1455.212,1457,1458],"koShadowSegments":[{"index":0,"start":1447,"end":1450.824,"text":"(강이나) [짧은 비명] - 얘기 좀 해, 잠깐이면 돼 무슨 얘기?","speed":1,"cueUid":"merged-msb778yt-17"},{"index":1,"start":1450.824,"end":1451.985,"text":"나 할 얘기 없어요","speed":1,"cueUid":"merged-msb778yt-17"},{"index":2,"start":1451.985,"end":1453.682,"text":"이거 놔 - (황대중) 아저씨 누구야?","speed":1,"cueUid":"merged-msb778yt-17"},{"index":3,"start":1453.682,"end":1455.212,"text":"날 피하는 이유가 뭐야?","speed":1,"cueUid":"merged-msb778yt-17"},{"index":4,"start":1455.212,"end":1457,"text":"도대체 그날 무슨 일이 있었던 거야?","speed":1,"cueUid":"merged-msb778yt-17"},{"index":5,"start":1457,"end":1458,"text":"제발 말해줘!","speed":1,"cueUid":"merged-msb778yt-17"},{"index":6,"start":1458.173,"end":1459.842,"text":"나 할 얘기 없어, 이거 놔","speed":1,"cueUid":"merged-msb778yt-17"}],"hasShadow":true,"segments":[{"index":0,"start":1447,"end":1450.824,"text":"(강이나) [짧은 비명] - 얘기 좀 해, 잠깐이면 돼 무슨 얘기?","speed":1,"cueUid":"merged-msb778yt-17"},{"index":1,"start":1450.824,"end":1451.985,"text":"나 할 얘기 없어요","speed":1,"cueUid":"merged-msb778yt-17"},{"index":2,"start":1451.985,"end":1453.682,"text":"이거 놔 - (황대중) 아저씨 누구야?","speed":1,"cueUid":"merged-msb778yt-17"},{"index":3,"start":1453.682,"end":1455.212,"text":"날 피하는 이유가 뭐야?","speed":1,"cueUid":"merged-msb778yt-17"},{"index":4,"start":1455.212,"end":1457,"text":"도대체 그날 무슨 일이 있었던 거야?","speed":1,"cueUid":"merged-msb778yt-17"},{"index":5,"start":1457,"end":1458,"text":"제발 말해줘!","speed":1,"cueUid":"merged-msb778yt-17"},{"index":6,"start":1458.173,"end":1459.842,"text":"나 할 얘기 없어, 이거 놔","speed":1,"cueUid":"merged-msb778yt-17"}]},{"id":74,"cueNo":75,"displayNo":75,"sourceUid":"merged-msb79r5b-19","uid":"merged-msb79r5b-19","originalCueNo":75,"vi":"- Chú là ai cơ c  in. I planned everything and found some good restaurants.\nFirst, go toward the Boamdong Citizen's Center.\nIf you go behind that building, there's a dirt path.\nApparently, it's popular with locals. Would you like that?\nWhy are you in such a good mood?","koRange":{"start":1577.605189,"end":1594.227774},"viRange":{"start":1445.809281,"end":1461.728826},"start":1445.809281,"end":1594.227774,"koSentenceMarks":[1582.81,1585.39,1588.1,1590.79],"koShadowSegments":[{"index":0,"start":1577.605189,"end":1582.81,"text":"타. 내가 스케줄 다 짜왔어 맛집도 알아놨구","speed":1,"cueUid":"merged-msb7rf4u-29"},{"index":1,"start":1582.81,"end":1585.39,"text":"일단 부암동 주민센터 쪽으로 가","speed":1,"cueUid":"merged-msb7rf4u-29"},{"index":2,"start":1585.39,"end":1588.1,"text":"주민센터 뒤쪽으로 가면 흙길이 있는데","speed":1,"cueUid":"merged-msb7rf4u-29"},{"index":3,"start":1588.1,"end":1590.79,"text":"거기가 동네 사람들만 아는 산책로래, 좋겠지?","speed":1,"cueUid":"merged-msb7rf4u-29"},{"index":4,"start":1590.79,"end":1593.832,"text":"[피식 웃으며] 왜 이렇게 기분 좋아?","speed":1,"cueUid":"merged-msb7rf4u-29"}],"hasShadow":true,"segments":[{"index":0,"start":1577.605189,"end":1582.81,"text":"타. 내가 스케줄 다 짜왔어 맛집도 알아놨구","speed":1,"cueUid":"merged-msb7rf4u-29"},{"index":1,"start":1582.81,"end":1585.39,"text":"일단 부암동 주민센터 쪽으로 가","speed":1,"cueUid":"merged-msb7rf4u-29"},{"index":2,"start":1585.39,"end":1588.1,"text":"주민센터 뒤쪽으로 가면 흙길이 있는데","speed":1,"cueUid":"merged-msb7rf4u-29"},{"index":3,"start":1588.1,"end":1590.79,"text":"거기가 동네 사람들만 아는 산책로래, 좋겠지?","speed":1,"cueUid":"merged-msb7rf4u-29"},{"index":4,"start":1590.79,"end":1593.832,"text":"[피식 웃으며] 왜 이렇게 기분 좋아?","speed":1,"cueUid":"merged-msb7rf4u-29"}]},{"id":80,"cueNo":81,"displayNo":81,"sourceUid":"merged-msb7ti7o-31","uid":"merged-msb7ti7o-31","originalCueNo":81,"vi":"Chỉ cần ở cạnh anh là em hạnh phúc mà. Anh không vậy sao?\nEm làm gì vậy?\nĐi thôi. Anh, há miệng đi. Chờ một lát nào.","ko":"난 오빠만 있으면 행복한데 오빤 안 그래?\n(고두영) 뭐해?\n가자\n오빠, 아\n야, 하하\n음, 잠깐만\n(고두영) 아","en":"I'm happy as long as I am with you. Don't you feel the same way?\nWhat are you doing?\nLet's go. Honey, open your mouth. Wait.","text":"Chỉ cần ở cạnh anh là em hạnh phúc mà. Anh không vậy sao?\nEm làm gì vậy?\nĐi thôi. Anh, há miệng đi. Chờ một lát nào.\\n난 오빠만 있으면 행복한데 오빤 안 그래?\n(고두영) 뭐해?\n가자\n오빠, 아\n야, 하하\n음, 잠깐만\n(고두영) 아\\nI'm happy as long as I am with you. Don't you feel the same way?\nWhat are you doing?\nLet's go. Honey, open your mouth. Wait.","koRange":{"start":1594.227774,"end":1642.850359},"viRange":null,"start":1594.227774,"end":1642.850359,"koSentenceMarks":[1598.166,1614.885,1617.813,1634.979,1636.799,1639.89],"koShadowSegments":[{"index":0,"start":1594.228,"end":1598.166,"text":"난 오빠만 있으면 행복한데 오빤 안 그래?","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":1,"start":1613,"end":1614.885,"text":"(고두영) 뭐해?","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":2,"start":1616,"end":1617.813,"text":"가자","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":3,"start":1633,"end":1634.979,"text":"오빠, 아","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":4,"start":1634.979,"end":1636.799,"text":"야, 하하","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":5,"start":1638,"end":1639.89,"text":"음, 잠깐만","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":6,"start":1641,"end":1642.821,"text":"(고두영) 아","speed":1,"cueUid":"merged-msb7ti7o-31"}],"hasShadow":true,"segments":[{"index":0,"start":1594.228,"end":1598.166,"text":"난 오빠만 있으면 행복한데 오빤 안 그래?","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":1,"start":1613,"end":1614.885,"text":"(고두영) 뭐해?","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":2,"start":1616,"end":1617.813,"text":"가자","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":3,"start":1633,"end":1634.979,"text":"오빠, 아","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":4,"start":1634.979,"end":1636.799,"text":"야, 하하","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":5,"start":1638,"end":1639.89,"text":"음, 잠깐만","speed":1,"cueUid":"merged-msb7ti7o-31"},{"index":6,"start":1641,"end":1642.821,"text":"(고두영) 아","speed":1 ik.\nWhat does he want? -He just wants us to go have a drink.\nMan, that guy is a total alcoholic. He drinks about eight times a week.\nBut he can't handle a lot of alcohol.\n[Sound of slurping wine]","text":"Em ra rồi sao? Ai vậy? Dong Shik.\n- Tại sao? - Thì cậu ấy rủ uống rượu.\nThằng đó nghiện rượu, một tuần uống đến tám lần.\nĐã thế còn không giỏi uống chứ.\n[Tiếng húp rượu]\\n어, 왔어? 누구야?\n어허, 동식이\n왜? - 그냥, 술 먹자고\n(고두영) 아, 그 자식은 알콜홀릭이야 일주일에 여덟 번은 마실걸\n(고두영) 잘 마시지도 못하는 게 \n[와인 '후루룩' 마시는 소리]\\nHere you are. Who is that? It's Dong-Shik.\nWhat does he want? -He just wants us to go have a drink.\nMan, that guy is a total alcoholic. He drinks about eight times a week.\nBut he can't handle a lot of alcohol.\n[Sound of slurping wine]","koRange":{"start":1642.850359,"end":1688.261214},"viRange":{"start":1461.728826,"end":1557.284761},"start":1461.728826,"end":1688.261214,"koSentenceMarks":[1673.98,1676.586,1680.644,1686.272],"koShadowSegments":[{"index":0,"start":1668,"end":1673.98,"text":"어, 왔어? 누구야?","speed":1,"cueUid":"merged-msb82vf2-33"},{"index":1,"start":1673.98,"end":1676.586,"text":"어허, 동식이","speed":1,"cueUid":"merged-msb82vf2-33"},{"index":2,"start":1676.586,"end":1680.644,"text":"왜? 그냥, 술 먹자고","speed":1,"cueUid":"merged-msb82vf2-33"},{"index":3,"start":1680.644,"end":1686.272,"text":"(고두영) 아, 그 자식은 알콜홀릭이야 일주일에 여덟 번은 마실걸","speed":1,"cueUid":"merged-msb82vf2-33"},{"index":4,"start":1686.272,"end":1688,"text":"(고두영) 잘 마시지도 못하는 게","speed":1,"cueUid":"merged-msb82vf2-33"}],"hasShadow":true,"segments":[{"index":0,"start":1668,"end":1673.98,"text":"어, 왔어? 누구야?","speed":1,"cueUid":"merged-msb82vf2-33"},{"index":1,"start":1673.98,"end":1676.586,"text":"어허, 동식이","speed":1,"cueUid":"merged-msb82vf2-33"},{"index":2,"start":1676.586,"end":1680.644,"text":"왜? 그냥, 술 먹자고","speed":1,"cueUid":"merged-msb82vf2-33"},{"index":3,"start":1680.644,"end":1686.272,"text":"(고두영) 아, 그 자식은 알콜홀릭이야 일주일에 여덟 번은 마실걸","speed":1,"cueUid":"merged-msb82vf2-33"},{"index":4,"start":1686.272,"end":1  đưa về. Em sẽ đi xe buýt.\nCó chuyến xe buýt về thẳng nhà. Thế thoải mái hơn.\\n많이 안 좋아? 어\n가, 바래다 줄게\n(정예은) 버스 탈게\n한 번에 가는 버스도 있으니까\n그게 편해\\nAre you feeling really bad? Yes.\nLet's go. I'll take you home. I'll take the bus.\nThere's a bus that takes me straight home. That'd be better for me.","koRange":{"start":1723.982212,"end":1740.690374},"viRange":{"start":1589.86526,"end":1608.482987},"start":1589.86526,"end":1740.690374,"koSentenceMarks":[1729,1730.989,1732.475,1736.363],"koShadowSegments":[{"index":0,"start":1723.982212,"end":1729,"text":"많이 안 좋아? 어","speed":1,"cueUid":"merged-msb8qrh1-36"},{"index":1,"start":1729,"end":1730.989,"text":"가, 바래다 줄게","speed":1,"cueUid":"merged-msb8qrh1-36"},{"index":2,"start":1730.989,"end":1732.475,"text":"(정예은) 버스 탈게","speed":1,"cueUid":"merged-msb8qrh1-36"},{"index":3,"start":1734,"end":1736.363,"text":"한 번에 가는 버스도 있으니까","speed":1,"cueUid":"merged-msb8qrh1-36"},{"index":4,"start":1739,"end":1740,"text":"그게 편해","speed":1,"cueUid":"merged-msb8qrh1-36"}],"hasShadow":true,"segments":[{"index":0,"start":1723.982212,"end":1729,"text":"많이 안 좋아? 어","speed":1,"cueUid":"merged-msb8qrh1-36"},{"index":1,"start":1729,"end":1730.989,"text":"가, 바래다 줄게","speed":1,"cueUid":"merged-msb8qrh1-36"},{"index":2,"start":1730.989,"end":1732.475,"text":"(정예은) 버스 탈게","speed":1,"cueUid":"merged-msb8qrh1-36"},{"index":3,"start":1734,"end":1736.363,"text":"한 번에 가는 버스도 있으니까","speed":1,"cueUid":"merged-msb8qrh1-36"},{"index":4,"start":1739,"end":1740,"text":"그게 편해","speed":1,"cueUid":"merged-msb8qrh1-36"}]},{"id":87,"cueNo":88,"displayNo":88,"sourceUid":"ko-ms9zfai4-978","uid":"ko-ms9zfai4-978","originalCueNo":88,"vi":"[Âm thanh xe buýt] [Âm nhạc hồi hộp bắt đầu]","ko":"[버스 소리] [긴장되는 분위기의 음악 시작]","en":"[Bus sound] [Nervous music starts]","text":"[Âm thanh xe buýt] [Âm nhạc hồi hộp bắt đầu]\\n[버스 소리] [긴장되는 분위기의 음악 시작]\\n[Bus sound] [Nervous music starts]","koRange":null,"viRange":null,"start":1746.33,"end":1749.23,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":88,"cueNo":89,"displayNo":89,"sourceUid":"merged-msb8t634-37","uid":"merged-msb8t634-37","originalCueNo":89,"vi":"CHỊ KANG YI NA","ko":"","en":"Yi-Na Kang","text":"CHỊ KANG YI NA\\nYi-Na Kang","koRange":{"start":1740.690374,"end":1786.070886},"viRange":{"start":1608.482987,"end":1636.994208},"start":1608.482987,"end":1786.070886,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":89,"cueNo":90,"displayNo":90,"sourceUid":"merged-msb8tq8g-39","uid":"merged-msb8tq8g-39","originalCueNo":90,"vi":"Thuê bao quý khách vừa gọi hiện đang bận.\nANH YÊU\nQuý khách vui lòng để lại lời nhắn sau tiếng bíp.","ko":"[기계음] 고객이 통화 중이어서 '삐' 소리 후 소리샘 퀵보이스로 연결되오며...\n[기계음] 고객님이 통화 중이어서 음성사서함으로 연결됩니다\n[기계음] 연결된 후에는 통화료가 부과됩니다","en":"The number that you are trying to reach is busy.\nHoney\nYou will be redirected to the voice mail system.","text":"Thuê bao quý khách vừa gọi hiện đang bận.\nANH YÊU\nQuý khách vui lòng để lại lời nhắn sau tiếng bíp.\\n[기계음] 고객이 통화 중이어서 '삐' 소리 후 소리샘 퀵보이스로 연결되오며...\n[기계음] 고객님이 통화 중이어서 음성사서함으로 연결됩니다\n[기계음] 연결된 후에는 통화료가 부과됩니다\\nThe number that you are trying to reach is busy.\nHoney\nYou will be redirected to the voice mail system.","koRange":null,"viRange":null,"start":1776.53,"end":1779.23,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":90,"cueNo":91,"displayNo":91,"sourceUid":"ko-ms9zfai4-982","uid":"ko-ms9zfai4-982","originalCueNo":91,"vi":"[Âm nhạc êm dịu bắt đầu]","ko":"[차분한 분위기 음악 시작]","en":"[Calm music starts]","text":"[Âm nhạc êm dịu bắt đầu]\\n[차분한 분위기 음악 시작]\\n[Calm music starts]","koRange":null,"viRange":null,"start":1787.16,"end":1790.26,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":91,"cueNo":92,"displayNo":92,"sourceUid":"cand-msfk4a6u-2","uid":"cand-msfk4a6u-2","originalCueNo":92,"vi":"Tại sao hôm đó chú khóc? Vì tôi nhớ về quá khứ.\nCon gái tôi…Cô đã giết con gái tôi sao?\nNói đi! - Chú là ai? Vì là bố nên tôi cần biết.\nCô làm ơn nói đi! Ngày ấy có chuyện gì vậy? Cô làm ơn nói đi!","ko":"(강이나) [생각] 아저씨, 그날 왜 울었어요?\n(오종규) 옛날 생각이 나서\n(오종규) 딸아이하고 놀던-내 딸, 니가 죽였어?\n(강이나) 아저씨가 뭔데!\n(오종규) 아버지니까! 아버지로서 알아야겠어! 제발 말해줘!\n그날 무슨 일이 있었던 거야! 제발 말해줘! 제발 말해줘!","en":"Why did you cry that day? Because it reminded me of my past.\nMy daughter... Tell me. Did you kill her? -Tell me! -Who do you think you are? Because I am her father! I need to know. Please, tell me!\nWhat happened that day? Please, tell me!","text":"Tại sao hôm đó chú khóc? Vì tôi nhớ về quá khứ.\nCon gái tôi…Cô đã giết con gái tôi sao?\nNói đi! - Chú là ai? Vì là bố nên tôi cần biết.\nCô làm ơn nói đi! Ngày ấy có chuyện gì vậy? Cô làm ơn nói đi!\\n(강이나) [생각] 아저씨, 그날 왜 울었어요?\n(오종규) 옛날 생각이 나서\n(오종규) 딸아이하고 놀던-내 딸, 니가 죽였어?\n(강이나) 아저씨가 뭔데!\n(오종규) 아버지니까! 아버지로서 알아야겠어! 제발 말해줘!\n그날 무슨 일이 있었던 거야! 제발 말해줘! 제발 말해줘!\\nWhy did you cry that day? Because it reminded me of my past.\nMy daughter... Tell me. Did you kill her? -Tell me! -Who do you think you are? Because I am her father! I need to know. Please, tell me!\nWhat happened that day? Please, tell me!","koRange":{"start":1786.070886,"end":1824.150705},"viRange":{"start":1636.994208,"end":1681.696},"start":1636.994208,"end":1824.150705,"koSentenceMarks":[1797.93,1805.079,1806.925,1807.822,1809.311,1810.591],"koShadowSegments":[{"index":0,"start":1795,"end":1797.93,"text":"(강이나) [생각] 아저씨, 그날 왜 울었어요?","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":1,"start":1797.93,"end":1805.079,"text":"(오종규) 옛날 생각이 나서 (오종규) 딸아이하고 놀던-내 딸, 니가 죽였어?","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":2,"start":1805.079,"end":1806.925,"text":"(강이나) 아저씨가 뭔데!","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":3,"start":1806.925,"end":1807.822,"text":"(오종규) 아버지니까!","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":4,"start":1807.822,"end":1809.311,"text":"아버지로서 알아야겠어!","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":5,"start":1809.311,"end":1810.591,"text":"제발 말해줘!","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":6,"start":1810.591,"end":1813.72,"text":"그날 무슨 일이 있었던 거야! 제발 말해줘! 제발 말해줘!","speed":1,"cueUid":"cand-msfk4a6u-2"}],"hasShadow":true,"segments":[{"index":0,"start":1795,"end":1797.93,"text":"(강이나) [생각] 아저씨, 그날 왜 울었어요?","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":1,"start":1797.93,"end":1805.079,"text":"(오종규) 옛날 생각이 나서 (오종규) 딸아이하고 놀던-내 딸, 니가 죽였어?","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":2,"start":1805.079,"end":1806.925,"text":"(강이나) 아저씨가 뭔데!","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":3,"start":1806.925,"end":1807.822,"text":"(오종규) 아버지니까!","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":4,"start":1807.822,"end":1809.311,"text":"아버지로서 알아야겠어!","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":5,"start":1809.311,"end":1810.591,"text":"제발 말해줘!","speed":1,"cueUid":"cand-msfk4a6u-2"},{"index":6,"start":1810.591,"end":1813.72,"text":"그날 무슨 일이 있었던 거야! 제발 말해줘! 제발 말해줘!","speed":1,"cueUid":"cand-msfk4a6u-2"}]},{"id":92,"cueNo":93,"displayNo":93,"sourceUid":"merged-msb983bv-41","uid":"merged-msb983bv-41","originalCueNo":93,"vi":"[âm thanh quay số điện thoại]\n[Âm kết nối điện thoại và âm quay số] Hmm","ko":"[전화 거는 소리]\n[전화 연결음 및 신호음] 으흠","en":"[phone dialing sound]\n[Phone connection tone and dial tone] Hmm","text":"[âm thanh quay số điện thoại]\n[Âm kết nối điện thoại và âm quay số] Hmm\\n[전화 거는 소리]\n[전화 연결음 및 신호음] 으흠\\n[phone dialing sound]\n[Phone connection tone and dial tone] Hmm","koRange":null,"viRange":null,"start":1830.66,"end":1833.66,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":93,"cueNo":94,"displayNo":94,"sourceUid":"merged-msb9a0r6-43","uid":"merged-msb9a0r6-43","originalCueNo":94,"vi":"Này, tôi đây.\nCậu nói chú ấy sống ở nhà trọ hả?\nCòn người nhà nào không? - Tôi không biết.\nTôi có là nhà ngoại cảm đâu mà biết. Cần tôi tìm hiểu cho không?\nAlô?","ko":"어, 야, 난데\n지난번 그 아저씨 고시원 산다고 그랬지\n딴 가족은 없어?\n(서동주) 모르지\n(서동주) 내가 뭐 흥신소냐? \n[쿵쾅 소리] [거친 발소리] \n알아봐 줘?\n[숨가쁜 소리] \n(서동주) 여보세요?\n(서동주) 여보세요?","en":"Hey, it's me.\nYou told me that guy lives at a student hostel, right?\n-Any family members? -I don't know.\nI am not a mind reader. Do you want me to find out?\nHello?","text":"Này, tôi đây.\nCậu nói chú ấy sống ở nhà trọ hả?\nCòn người nhà nào không? - Tôi không biết.\nTôi có là nhà ngoại cảm đâu mà biết. Cần tôi tìm hiểu cho không?\nAlô?\\n어, 야, 난데\n지난번 그 아저씨 고시원 산다고 그랬지\n딴 가족은 없어?\n(서동주) 모르지\n(서동주) 내가 뭐 흥신소냐? \n[쿵쾅 소리] [거친 발소리] \n알아봐 줘?\n[숨가쁜 소리] \n(서동주) 여보세요?\n(서동주) 여보세요?\\nHey, it's me.\nYou told me that guy lives at a student hostel, right?\n-Any family members? -I don't know.\nI am not a mind reader. Do you want me to find out?\nHello?","koRange":{"start":1824.150705,"end":1853.318999},"viRange":{"start":1681.695523,"end":1720.77553},"start":1681.695523,"end":1853.318999,"koSentenceMarks":[1840.017,1842.806,1844.5,1845.5,1846.986,1848.274,1850.612],"koShadowSegments":[{"index":0,"start":1836,"end":1840.017,"text":"어, 야, 난데","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":1,"start":1840.017,"end":1842.806,"text":"지난번 그 아저씨 고시원 산다고 그랬지","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":2,"start":1842.806,"end":1844.5,"text":"딴 가족은 없어?","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":3,"start":1844.5,"end":1845.5,"text":"(서동주) 모르지","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":4,"start":1845.5,"end":1846.986,"text":"(서동주) 내가 뭐 흥신소냐?","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":5,"start":1846.986,"end":1848.274,"text":"알아봐 줘?","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":6,"start":1848.274,"end":1850.612,"text":"(서동주) 여보세요?","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":7,"start":1850.612,"end":1852.583,"text":"(서동주) 여보세요?","speed":1,"cueUid":"merged-msb9a0r6-43"}],"hasShadow":true,"segments":[{"index":0,"start":1836,"end":1840.017,"text":"어, 야, 난데","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":1,"start":1840.017,"end":1842.806,"text":"지난번 그 아저씨 고시원 산다고 그랬지","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":2,"start":1842.806,"end":1844.5,"text":"딴 가족은 없어?","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":3,"start":1844.5,"end":1845.5,"text":"(서동주) 모르지","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":4,"start":1845.5,"end":1846.986,"text":"(서동주) 내가 뭐 흥신소냐?","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":5,"start":1846.986,"end":1848.274,"text":"알아봐 줘?","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":6,"start":1848.274,"end":1850.612,"text":"(서동주) 여보세요?","speed":1,"cueUid":"merged-msb9a0r6-43"},{"index":7,"start":1850.612,"end":1852.583,"text":"(서동주) 여보세요?","speed":1,"cueUid":"merged-msb9a0r6-43"}]},{"id":94,"cueNo":95,"displayNo":95,"sourceUid":"merged-msb9duyg-44","uid":"merged-msb9duyg-44","originalCueNo":95,"vi":"Lát tôi gọi lại nhé. Này! - Em sao thế? - Cái gì?\nDạo gần đây em sao vậy? - Tôi làm sao?\nThằng bạn trai của em nói gì rồi?\nDù chị chả biết thằng chó đó nói gì…\nChị là cái thá gì mà gọi người ta như thế? Chị không liên quan gì hết.\nChính thằng đó hứng lên đấy. Làm rõ trước khi làm loạn đi.\nLà chị ve vãn trước. Nó nói vậy sao? Là chị ve vãn trước?","ko":"야, 나중에 내가 다시 전화할게. [발소리] 야!\n(강이나) 너 왜 그래? - 뭐가?\n너 요새 왜 그러는 건데? - 내가 뭐?\n너! 니 남친한테 무슨 얘기 들었어?\n그 새끼가 뭐라고 했는지 모르겠는데\n이 새끼 저 새끼 하지 마 니가 뭔데?\n(강이나) 난 아무 상관없거든, 그 새끼 혼자 흥분해서 그런 거야, 똑바로 알고나 지랄해\n(정예은) 니가 먼저 꼬리쳤잖아 - 그 새끼가 그러디? 내가 먼저 꼬리쳤다고","en":"I'll call you back. Hey! -Why are you acting like this? -What?\nWhy have you been acting so weird? -What did I do?\nWhat did your boyfriend tell you?\nI don't know what that bastard said, but...\nStop calling him a bastard! How dare you! I have nothing to do with him.\nThat bastard just overreacted. Get the facts straight before bitching.\nYou flirted with him first. Did he tell you that I flirted with him first?","text":"Lát tôi gọi lại nhé. Này! - Em sao thế? - Cái gì?\nDạo gần đây em sao vậy? - Tôi làm sao?\nThằng bạn trai của em nói gì rồi?\nDù chị chả biết thằng chó đó nói gì…\nChị là cái thá gì mà gọi người ta như thế? Chị không liên quan gì hết.\nChính thằng đó hứng lên đấy. Làm rõ trước khi làm loạn đi.\nLà chị ve vãn trước. Nó nói vậy sao? Là chị ve vãn trước?\\n야, 나중에 내가 다시 전화할게. [발소리] 야!\n(강이나) 너 왜 그래? - 뭐가?\n너 요새 왜 그러는 건데? - 내가 뭐?\n너! 니 남친한테 무슨 얘기 들었어?\n그 새끼가 뭐라고 했는지 모르겠는데\n이 새끼 저 새끼 하지 마 니가 뭔데?\n(강이나) 난 아무 상관없거든, 그 새끼 혼자 흥분해서 그런 거야, 똑바로 알고나 지랄해\n(정예은) 니가 먼저 꼬리쳤잖아 - 그 새끼가 그러디? 내가 먼저 꼬리쳤다고\\nI'll call you back. Hey! -Why are you acting like this? -What?\nWhy have you been acting so weird? -What did I do?\nWhat did your boyfriend tell you?\nI don't know what that bastard said, but...\nStop calling him a bastard! How dare you! I have nothing to do with him.\nThat bastard just overreacted. Get the facts straight before bitching.\nYou flirted with him first. Did he tell you that I flirted with him first?","koRange":{"start":1853.318999,"end":1883.56196},"viRange":{"start":1720.77553,"end":1750.849051},"start":1720.77553,"end":1883.56196,"koSentenceMarks":[1858.417,1862.785,1864.605,1865.362,1866.649,1867.528,1868.606,1870.645,1875.3,1882.2],"koShadowSegments":[{"index":0,"start":1856,"end":1858.417,"text":"야, 나중에 내가 다시 전화할게.","speed":1,"cueUid":"merged-msb9duyg-44"},{"index":1,"start":1861,"end":1862.785,"text":"[발소리] 야!","speed":1,"cueUid":"merged-msb9duyg-44"},{"index":2,"start":1862.785,"end":1864.605,"text":"(강이나) 너 왜 그래?","speed":1,"cueUid":"merged-msb9duyg-44"},{"index":3,"start":1864.605,"end":1865.362,"text":"뭐가?","speed":1,"cueUid":"merged-msb9duyg-44"},{"index":4,"start":1865.362,"end":1866.649,"text":"너 요새 왜 그러는 건데?","speed":1,"cueUid":"merged-msb9duyg-44"},{"index":5,"start":1866.649,"end":1867.528,"text":"내가 뭐?","speed":1,"cueUid":"merged-msb9duyg-44"},{"index":6,"start":1867.528,"end":1868.606,"text":"너!","speed":1,"cueUid":"merged-msb9duyg-44"},{"index":7,"start":1868.606,"end":1870.645,"text":"니 남친한테 무슨 얘기 들었어?","speed":1,"cueUid":"merged-msb9duyg-44"},{"index":8,"start":1870.645,"end":1875.3,"text":"그 새끼가 뭐라고 했는지 모르겠는데 이 새끼 저 새끼 하지 마 니가 뭔데?","speed":1,"cueUid":"merged-msb9duyg-44"},{"index":9,"start":1875.3,"end":1882.2,"text":"(강이나) 난 아무 상관없거든, 그 새끼 혼자 흥 ng bước chân]\\n[발걸음 소리] \n선배! 어디 가요?-목욕탕\n같이 가요, 나 때 밀어야 돼 때를 안 밀어서 각질이 막 하얗게...\n잠깐 기다려요 금방 나올게요 \n[쿵쿵 발소리]\\n[Sound of footsteps]\n-Where are you going? -The public sauna.\nI'll come with you! I need to exfoliate. I haven't done it in a while.\nWait for me. I'll be right back.\n[Sound of pounding footsteps]","koRange":{"start":1981.103038,"end":1992.844582},"viRange":{"start":1850.105227,"end":1860.522296},"start":1850.105227,"end":1992.844582,"koSentenceMarks":[1986.198,1990.337],"koShadowSegments":[{"index":0,"start":1981.103038,"end":1986.198,"text":"선배! 어디 가요?-목욕탕","speed":1,"cueUid":"merged-msbex5oz-54"},{"index":1,"start":1986.198,"end":1990.337,"text":"같이 가요, 나 때 밀어야 돼 때를 안 밀어서 각질이 막 하얗게...","speed":1,"cueUid":"merged-msbex5oz-54"},{"index":2,"start":1990.337,"end":1992.644,"text":"잠깐 기다려요 금방 나올게요","speed":1,"cueUid":"merged-msbex5oz-54"}],"hasShadow":true,"segments":[{"index":0,"start":1981.103038,"end":1986.198,"text":"선배! 어디 가요?-목욕탕","speed":1,"cueUid":"merged-msbex5oz-54"},{"index":1,"start":1986.198,"end":1990.337,"text":"같이 가요, 나 때 밀어야 돼 때를 안 밀어서 각질이 막 하얗게...","speed":1,"cueUid":"merged-msbex5oz-54"},{"index":2,"start":1990.337,"end":1992.644,"text":"잠깐 기다려요 금방 나올게요","speed":1,"cueUid":"merged-msbex5oz-54"}]},{"id":104,"cueNo":105,"displayNo":105,"sourceUid":"merged-msbf11tb-55","uid":"merged-msbf11tb-55","originalCueNo":105,"vi":"Sao hai người lại giận cá chém thớt thế?\nVậy mà còn cùng ăn sáng với nhau.\nSao chị Ye Eun lại yêu người như thế nhỉ?\nChị ấy xinh xắn, hay cười, lại còn rất dễ thương nữa.\nĐáng lẽ chị ấy nên gặp người tốt hơn.","ko":"[문 소리] 애를 아주 그냥... 눈칫밥을 멕이냐, 그렇게, 에휴...\n(송지원) 둘이 꼭 밥을 같이 먹어 [발소리]\n예은 선배는 그런 연애를 하나 몰라요\n얼굴 예쁘고, 잘 웃고, 애교 많고\n더 좋은 남자 만나면 좋을 텐데","en":"Why are you torturing her like this?\nI don't know why you are eating together.\nWhy does Ye-Eun have to date a guy like that?\nI mean, she's pretty, has a great smile, and is really cute.\nIt would be nice if she would date a better guy.","text":"Sao hai người lại giận cá chém thớt thế?\nVậy mà còn cùng ăn sáng với nhau.\nSao chị Ye Eun lại yêu người như thế nhỉ?\nChị ấy xinh xắn, hay cười, lại còn rất dễ thương nữa.\nĐáng lẽ chị ấy nên gặp người tốt hơn.\\n[문 소리] 애를 아주 그냥... 눈칫밥을 멕이냐, 그렇게, 에휴...\n(송지원) 둘이 꼭 밥을 같이 먹어 [발소리]\n예은 선배는 그런 연애를 하나 몰라요\n얼굴 예쁘고, 잘 웃고, 애교 많고\n더 좋은 남자 만나면 좋을 텐데\\nWhy are you torturing her like this?\nI don't know why you are eating together.\nWhy does Ye-Eun have to date a guy like that?\nI mean, she's pretty, has a great smile, and is really cute.\nIt would be nice if she would date a better guy.","koRange":{"start":1992.844582,"end":2019.319288},"viRange":{"start":1860.522296,"end":1886.403838},"start":1860.522296,"end":2019.319288,"koSentenceMarks":[2000.994,2002.473,2009.651,2014.951],"koShadowSegments":[{"index":0,"start":1992.845,"end":2000.994,"text":"[문 소리] 애를 아주 그냥... 눈칫밥을 멕이냐, 그렇게, 에휴...","speed":1,"cueUid":"merged-msbf11tb-55"},{"index":1,"start":2000.994,"end":2002.473,"text":"(송지원) 둘이 꼭 밥을 같이 먹어 [발소리]","speed":1,"cueUid":"merged-msbf11tb-55"},{"index":2,"start":2002.473,"end":2009.651,"text":"예은 선배는 그런 연애를 하나 몰라요","speed":1,"cueUid":"merged-msbf11tb-55"},{"index":3,"start":2009.651,"end":2014.951,"text":"얼굴 예쁘고, 잘 웃고, 애교 많고","speed":1,"cueUid":"merged-msbf11tb-55"},{"index":4,"start":2014.951,"end":2018.61,"text":"더 좋은 남자 만나면 좋을 텐데","speed":1,"cueUid":"merged-msbf11tb-55"}],"hasShadow":true,"segments":[{"index":0,"start":1992.845,"end":2000.994,"text":"[문 소리] 애를 아주 그냥... 눈칫밥을 멕이냐, 그렇게, 에휴...","speed":1,"cueUid":"merged-msbf11tb-55"},{"index":1,"start":2000.994,"end":2002.473,"text":"(송지원) 둘이 꼭 밥을 같이 먹어 [발소리]","speed":1,"cueUid":"merged-msbf11tb-55"},{"index":2,"start":2002.473,"end":2009.651,"text":"예은 선배는 그런 연애를 하나 몰라요","speed":1,"cueUid":"merged-msbf11tb-55"},{"index":3,"start":2009.651,"end":2014.951,"text":"얼굴 예쁘고, 잘 웃고, 애교 많고","speed":1,"cueUid":"merged-msbf11tb-55"},{"index":4,"start":2014.951,"end":2018.61,"text":"더 좋은 남자 만나면 좋을 텐데","speed":1,"cueUid":"merged-msbf11tb-55"}]},{"id":105,"cueNo":106,"displayNo":106,"sourceUid":"merged-msbf3v91-56","uid":"merged-msbf3v91-56","originalCueNo":106,"vi":"Em không biết chuyện của chị gái Ye Eun đúng không?\n- Chị ấy có chị ạ? - Ừ.\nNghe nói giờ đang du học Đức.\nLà thiên tài, từ bé đã không phải dạng vừa rồi.\nNghe bảo năm nay được bằng tiến sĩ thì là người trẻ tuổi nhất nước ta.","ko":"너 예은이 언니 얘기 모르지?\n예은 선배 언니 있어요? - 어\n어, 지금 독일에 유학 가 있는데\n엄청난 수재래 머리는 또 뭐, 장난 아니었대\n올해 박사 따면 우리나라 최연소라던데?","en":"You don't know the story about Ye-Eun's older sister, right?\n-She has an older sister? -Yeah.\nShe's studying abroad in Germany right now.\nApparently, she's like a super-genius since she was little.\nAnd she'll be getting her doctorate this year.","text":"Em không biết chuyện của chị gái Ye Eun đúng không?\n- Chị ấy có chị ạ? - Ừ.\nNghe nói giờ đang du học Đức.\nLà thiên tài, từ bé đã không phải dạng vừa rồi.\nNghe bảo năm nay được bằng tiến sĩ thì là người trẻ tuổi nhất nước ta.\\n너 예은이 언니 얘기 모르지?\n예은 선배 언니 있어요? - 어\n어, 지금 독일에 유학 가 있는데\n엄청난 수재래 머리는 또 뭐, 장난 아니었대\n올해 박사 따면 우리나라 최연소라던데?\\nYou don't know the story about Ye-Eun's older sister, right?\n-She has an older sister? -Yeah.\nShe's studying abroad in Germany right now.\nApparently, she's like a super-genius since she was little.\nAnd she'll be getting her doctorate this year.","koRange":{"start":2019.319288,"end":2035.641027},"viRange":{"start":1886.403838,"end":1902.57881},"start":1886.403838,"end":2035.641027,"koSentenceMarks":[2022.25,2025.078,2027.11,2031.469],"koShadowSegments":[{"index":0,"start":2019.319288,"end":2022.25,"text":"너 예은이 언니 얘기 모르지?","speed":1,"cueUid":"merged-msbf3v91-56"},{"index":1,"start":2022.25,"end":2025.078,"text":"예은 선배 언니 있어요? - 어","speed":1,"cueUid":"merged-msbf3v91-56"},{"index":2,"start":2025.078,"end":2027.11,"text":"어, 지금 독일에 유학 가 있는데","speed":1,"cueUid":"merged-msbf3v91-56"},{"index":3,"start":2027.11,"end":2031.469,"text":"엄청난 수재래 머리는 또 뭐, 장난 아니었대","speed":1,"cueUid":"merged-msbf3v91-56"},{"index":4,"start":2031.469,"end":2035.641,"text":"올해 박사 따면 우리나라 최연소라던데?","speed":1,"cueUid":"merged-msbf3v91-56"}],"hasShadow":true,"segments":[{"index":0,"start":2019.319288,"end":2022.25,"text":"너 예은이 언니 얘기 모르지?","speed":1,"cueUid":"merged-msbf3v91-56"},{"index":1,"start":2022.25,"end":2025.078,"text":"예은 선배 언니 있어요? - 어","speed":1,"cueUid":"merged-msbf3v91-56"},{"index":2,"start":2025.078,"end":2027.11,"text":"어, 지금 독일에 유학 가 있는데","speed":1,"cueUid":"merged-msbf3v91-56"},{"index":3,"start":2027.11,"end":2031.469,"text":"엄청난 수재래 머리는 또 뭐, 장난 아니었대","speed":1,"cueUid":"merged-msbf3v91-56"},{"index":4,"start":2031.469,"end":2035.641,"text":"올해 박사 따면 우리나라 최연소라던데?","speed":1,"cueUid":"merged-msbf3v91-56"}]},{"id":106,"cueNo":107,"displayNo":107,"sourceUid":"merged-msbf652k-57","uid":"merged-msbf652k-57","originalCueNo":107,"vi":"Chị ấy bao nhiêu tuổi? - Bằng tuổi với Ye Eun.\nHọ là chị em sinh đôi. - Thật ấy ạ?\nChị Ye Eun là sinh đôi. - Ừ.\nSinh đôi khác trứng, xinh đẹp và cao hơn Ye Eun nhiều.\nVừa xinh vừa học giỏi nữa.","ko":"몇 살인데요? - 예은이랑 동갑\n쌍둥이야 - 네? 진짜요?\n예은 선배 쌍둥이였어요? - 응\n이란성인데 얼굴도 그쪽이 훨씬 이쁘대, 키도 크고\n얼굴도 예뻐, 공부도 잘해","en":"-How old is she? -The same age as Ye-Eun.\nThey are twins. -Wait, really?\nYe-Eun has a twin? -Yeah.\nThey're fraternal twins, but she's a lot prettier and taller.\nShe's pretty and super smart.","text":"Chị ấy bao nhiêu tuổi? - Bằng tuổi với Ye Eun.\nHọ là chị em sinh đôi. - Thật ấy ạ?\nChị Ye Eun là sinh đôi. - Ừ.\nSinh đôi khác trứng, xinh đẹp và cao hơn Ye Eun nhiều.\nVừa xinh vừa học giỏi nữa.\\n몇 살인데요? - 예은이랑 동갑\n쌍둥이야 - 네? 진짜요?\n예은 선배 쌍둥이였어요? - 응\n이란성인데 얼굴도 그쪽이 훨씬 이쁘대, 키도 크고\n얼굴도 예뻐, 공부도 잘해\\n-How old is she? -The same age as Ye-Eun.\nThey are twins. -Wait, really?\nYe-Eun has a twin? -Yeah.\nThey're fraternal twins, but she's a lot prettier and taller.\nShe's pretty and super smart.","koRange":{"start":2035.641027,"end":2050.702109},"viRange":{"start":1902.57881,"end":1918.116135},"start":1902.57881,"end":2050.702109,"koSentenceMarks":[2039.5,2041.468,2044.2,2047.925],"koShadowSegments":[{"index":0,"start":2035.641027,"end":2039.5,"text":"몇 살인데요? - 예은이랑 동갑","speed":1,"cueUid":"merged-msbf652k-57"},{"index":1,"start":2039.5,"end":2041.468,"text":"쌍둥이야 - 네? 진짜요?","speed":1,"cueUid":"merged-msbf652k-57"},{"index":2,"start":2041.468,"end":2044.2,"text":"예은 선배 쌍둥이였어요? - 응","speed":1,"cueUid":"merged-msbf652k-57"},{"index":3,"start":2044.2,"end":2047.925,"text":"이란성인데 얼굴도 그쪽이 훨씬 이쁘대, 키도 크고","speed":1,"cueUid":"merged-msbf652k-57"},{"index":4,"start":2047.925,"end":2050.636,"text":"얼굴도 예뻐, 공부도 잘해","speed":1,"cueUid":"merged-msbf652k-57"}],"hasShadow":true,"segments":[{"index":0,"start":2035.641027,"end":2039.5,"text":"몇 살인데요? - 예은이랑 동갑","speed":1,"cueUid":"merged-msbf652k-57"},{"index":1,"start":2039.5,"end":2041.468,"text":"쌍둥이야 - 네? 진짜요?","speed":1,"cueUid":"merged-msbf652k-57"},{"index":2,"start":2041.468,"end":2044.2,"text":"예은 선배 쌍둥이였어요? - 응","speed":1,"cueUid":"merged-msbf652k-57"},{"index":3,"start":2044.2,"end":2047.925,"text":"이란성인데 얼굴도 그쪽이 훨씬 이쁘대, 키도 크고","speed":1,"cueUid":"merged-msbf652k-57"},{"index":4,"start":2047.925,"end":2050.636,"text":"얼굴도 예뻐, 공부도 잘해","speed":1,"cueUid":"merged-msbf652k-57"}]},{"id":107,"cueNo":108,"displayNo":108,"sourceUid":"merged-msbf8108-58","uid":"merged-msbf8108-58","originalCueNo":108,"vi":"Có người chị như vậy, Ye Eun được chiều chuộng chắc?\nMọi quan tâm đều dành cho người chị rồi.\nYe Eun có chết cũng không thể vượt qua sự hoàn hảo ấy.\nTrong tình huống như thế thì lòng tự tôn cao sao được?","ko":"쌍둥이가 그래버리니까 어려서부터 좀 치였겠냐?\n모든 관심이 그쪽으로 쏠린 거지\n예은이가 죽을 둥 살 둥 해봐야 넘사벽인 거구\n뭐, 그런 상황에서 자존감이 싹트겠냐?","en":"Growing up as a twin, I am sure Ye-Eun felt left out.\nHer sister got all the attention.\nAnd it's not like she could ever surpass her sister in any way.\nIt's natural that she has low self-esteem.","text":"Có người chị như vậy, Ye Eun được chiều chuộng chắc?\nMọi quan tâm đều dành cho người chị rồi.\nYe Eun có chết cũng không thể vượt qua sự hoàn hảo ấy.\nTrong tình huống như thế thì lòng tự tôn cao sao được?\\n쌍둥이가 그래버리니까 어려서부터 좀 치였겠냐?\n모든 관심이 그쪽으로 쏠린 거지\n예은이가 죽을 둥 살 둥 해봐야 넘사벽인 거구\n뭐, 그런 상황에서 자존감이 싹트겠냐?\\nGrowing up as a twin, I am sure Ye-Eun felt left out.\nHer sister got all the attention.\nAnd it's not like she could ever surpass her sister in any way.\nIt's natural that she has low self-esteem.","koRange":{"start":2050.702109,"end":2064.937474},"viRange":{"start":1918.116135,"end":1932.98513},"start":1918.116135,"end":2064.937474,"koSentenceMarks":[2054.629,2056.847,2060.226],"koShadowSegments":[{"index":0,"start":2050.702109,"end":2054.629,"text":"쌍둥이가 그래버리니까 어려서부터 좀 치였겠냐?","speed":1,"cueUid":"merged-msbf8108-58"},{"index":1,"start":2054.629,"end":2056.847,"text":"모든 관심이 그쪽으로 쏠린 거지","speed":1,"cueUid":"merged-msbf8108-58"},{"index":2,"start":2056.847,"end":2060.226,"text":"예은이가 죽을 둥 살 둥 해봐야 넘사벽인 거구","speed":1,"cueUid":"merged-msbf8108-58"},{"index":3,"start":2060.226,"end":2064.678,"text":"뭐, 그런 상황에서 자존감이 싹트겠냐?","speed":1,"cueUid":"merged-msbf8108-58"}],"hasShadow":true,"segments":[{"index":0,"start":2050.702109,"end":2054.629,"text":"쌍둥이가 그래버리니까 어려서부터 좀 치였겠냐?","speed":1,"cueUid":"merged-msbf8108-58"},{"index":1,"start":2054.629,"end":2056.847,"text":"모든 관심이 그쪽으로 쏠린 거지","speed":1,"cueUid":"merged-msbf8108-58"},{"index":2,"start":2056.847,"end":2060.226,"text":"예은이가 죽을 둥 살 둥 해봐야 넘사벽인 거구","speed":1,"cueUid":"merged-msbf8108-58"},{"index":3,"start":2060.226,"end":2064.678,"text":"뭐, 그런 상황에서 자존감이 싹트겠냐?","speed":1,"cueUid":"merged-msbf8108-58"}]},{"id":108,"cueNo":109,"displayNo":109,"sourceUid":"merged-msbfag0l-61","uid":"merged-msbfag0l-61","originalCueNo":109,"vi":"Cũng đúng.\nNhững người không có lòng tự tôn khi yêu sai người sẽ thành như thế.\nEm cứ nghĩ chị ấy lớn lên trong gia đình hạnh phúc.\nThế mới nói đó.\nMà lạ nhé.\nChị ấy bảo chị ấy là con một mà nhỉ?","ko":"그렇죠\n자존감 없는 애들이 연애 잘못하면 그렇게 되는 거야\n(유은재) 어휴\n예은 선배는 되게 좋은 집에서 되게 행복하게 자란 줄 알았는데\n[가벼운 한숨소리] 그러니까 말이다\n어? 이상하다? [매미 소리]\n예은 선배 외동딸이랬는데?","en":"That's true.\nThis is what happens when people with no confidence date the wrong person.\nI thought Ye-Eun grew up in a nice house with a happy family.\nI thought so, too.\nThat's weird.\nYe-Eun said that she was an only child.","text":"Cũng đúng.\nNhững người không có lòng tự tôn khi yêu sai người sẽ thành như thế.\nEm cứ nghĩ chị ấy lớn lên trong gia đình hạnh phúc.\nThế mới nói đó.\nMà lạ nhé.\nChị ấy bảo chị ấy là con một mà nhỉ?\\n그렇죠\n자존감 없는 애들이 연애 잘못하면 그렇게 되는 거야\n(유은재) 어휴\n예은 선배는 되게 좋은 집에서 되게 행복하게 자란 줄 알았는데\n[가벼운 한숨소리] 그러니까 말이다\n어? 이상하다? [매미 소리]\n예은 선배 외동딸이랬는데?\\nThat's true.\nThis is what happens when people with no confidence date the wrong person.\nI thought Ye-Eun grew up in a nice house with a happy family.\nI thought so, too.\nThat's weird.\nYe-Eun said that she was an only child.","koRange":{"start":2064.937474,"end":2086.064739},"viRange":{"start":1932.98513,"end":1953.153981},"start":1932.98513,"end":2086.064739,"koSentenceMarks":[2067.097,2070.704,2073.357,2077.994,2080.285,2083.393],"koShadowSegments":[{"index":0,"start":2064.937474,"end":2067.097,"text":"그렇죠","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":1,"start":2067.097,"end":2070.704,"text":"자존감 없는 애들이 연애 잘못하면 그렇게 되는 거야","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":2,"start":2070.704,"end":2073.357,"text":"(유은재) 어휴","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":3,"start":2073.357,"end":2077.994,"text":"예은 선배는 되게 좋은 집에서 되게 행복하게 자란 줄 알았는데","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":4,"start":2077.994,"end":2080.285,"text":"[가벼운 한숨소리] 그러니까 말이다","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":5,"start":2080.285,"end":2083.393,"text":"어? 이상하다? [매미 소리]","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":6,"start":2083.393,"end":2085.953,"text":"예은 선배 외동딸이랬는데?","speed":1,"cueUid":"merged-msbfag0l-61"}],"hasShadow":true,"segments":[{"index":0,"start":2064.937474,"end":2067.097,"text":"그렇죠","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":1,"start":2067.097,"end":2070.704,"text":"자존감 없는 애들이 연애 잘못하면 그렇게 되는 거야","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":2,"start":2070.704,"end":2073.357,"text":"(유은재) 어휴","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":3,"start":2073.357,"end":2077.994,"text":"예은 선배는 되게 좋은 집에서 되게 행복하게 자란 줄 알았는데","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":4,"start":2077.994,"end":2080.285,"text":"[가벼운 한숨소리] 그러니까 말이다","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":5,"start":2080.285,"end":2083.393,"text":"어? 이상하다? [매미 소리]","speed":1,"cueUid":"merged-msbfag0l-61"},{"index":6,"start":2083.393,"end":2085.953,"text":"예은 선배 외동딸이랬는데?","speed":1,"cueUid":"merged-msbfag0l-61"}]},{"id":109,"cueNo":110,"displayNo":110,"sourceUid":"merged-msbfbjvq-62","uid":"merged-msbfbjvq-62","originalCueNo":110,"vi":"Chị nói dối đấy hả?\nThật là. Sao chị lại nói dối chuyện đó?\nEm nghe chị kể xong thì nghĩ Ye Eun như thế cũng hiểu được, đúng không?\nÝ chị là,\ndù chuyện của chị không đúng, nhưng ai cũng có sự tình riêng cả.","ko":"뭐예요-거짓말한 거예요?\n아우 진짜 왜 그런 거짓말을 해요?\n너 방금 내 얘기 듣고 예은이가 그럴 만도 하다-싶었지?\n그러니까-내 말은\n내 얘기가 정답은 아니라도 사람마다-죄다 사정이란 게 있다는 거야","en":"Did you just lie to me?\nWhy would you lie to me about something like that?\nAfter hearing my story, you thought it would've been the case.\nSo my point is,\neven though my story wasn't true, everyone has their own reasons.","text":"Chị nói dối đấy hả?\nThật là. Sao chị lại nói dối chuyện đó?\nEm nghe chị kể xong thì nghĩ Ye Eun như thế cũng hiểu được, đúng không?\nÝ chị là,\ndù chuyện của chị không đúng, nhưng ai cũng có sự tình riêng cả.\\n뭐예요-거짓말한 거예요?\n아우 진짜 왜 그런 거짓말을 해요?\n너 방금 내 얘기 듣고 예은이가 그럴 만도 하다-싶었지?\n그러니까-내 말은\n내 얘기가 정답은 아니라도 사람마다-죄다 사정이란 게 있다는 거야\\nDid you just lie to me?\nWhy would you lie to me about something like that?\nAfter hearing my story, you thought it would've been the case.\nSo my point is,\neven though my story wasn't true, everyone has their own reasons.","koRange":{"start":2086.064739,"end":2108.175057},"viRange":{"start":1953.153981,"end":1975.706682},"start":1953.153981,"end":2108.175057,"koSentenceMarks":[2090.726,2094.578,2099.828,2102.94],"koShadowSegments":[{"index":0,"start":2086.065,"end":2090.726,"text":"뭐예요-거짓말한 거예요?","speed":1,"cueUid":"merged-msbfbjvq-62"},{"index":1,"start":2090.726,"end":2094.578,"text":"아우 진짜 왜 그런 거짓말을 해요?","speed":1,"cueUid":"merged-msbfbjvq-62"},{"index":2,"start":2094.578,"end":2099.828,"text":"너 방금 내 얘기 듣고 예은이가 그럴 만도 하다-싶었지?","speed":1,"cueUid":"merged-msbfbjvq-62"},{"index":3,"start":2099.828,"end":2102.94,"text":"그러니까-내 말은","speed":1,"cueUid":"merged-msbfbjvq-62"},{"index":4,"start":2102.94,"end":2107.981,"text":"내 얘기가 정답은 아니라도 사람마다-죄다 사정이란 게 있다는 거야","speed":1,"cueUid":"merged-msbfbjvq-62"}],"hasShadow":true,"segments":[{"index":0,"start":2086.065,"end":2090.726,"text":"뭐예요-거짓말한 거예요?","speed":1,"cueUid":"merged-msbfbjvq-62"},{"index":1,"start":2090.726,"end":2094.578,"text":"아우 진짜 왜 그런 거짓말을 해요?","speed":1,"cueUid":"merged-msbfbjvq-62"},{"index":2,"start":2094.578,"end":2099.828,"text":"너 방금 내 얘기 듣고 예은이가 그럴 만도 하다-싶었지?","speed":1,"cueUid":"merged-msbfbjvq-62"},{"index":3,"start":2099.828,"end":2102.94,"text":"그러니까-내 말은","speed":1,"cueUid":"merged-msbfbjvq-62"},{"index":4,"start":2102.94,"end":2107.981,"text":"내 얘기가 정답은 아니라도 사람마다-죄다 사정이란 게 있다는 거야","speed":1,"cueUid":"merged-msbfbjvq-62"}]},{"id":110,"cueNo":111,"displayNo":111,"sourceUid":"merged-msbfeljp-63","uid":"merged-msbfeljp-63","originalCueNo":111,"vi":"Trước khi biết sự tình ấy, ta không nên phán xét bất cứ thứ gì cả.\nKhông những Ye Eun mà cả chị Kang và chị Yoon nữa.\nNgay cả em cũng có những chuyện như thế mà.\nNgười đời không hiểu nổi, nhưng em vẫn không thể làm khác.","ko":"그 사정 알기 전까진 이렇다 저렇다 말하면 안 된다는 거구\n예은이뿐만 아니라 강 언니도 그렇구, 윤 선배도 그렇구\n너만 해도 그런 거 하나쯤은 있을 거 아니야\n남들은 도저히 이해 못 해도 너는 그렇게밖에 할 수 없었던 어떤 거","en":"You can't judge people until you know their reasons.\nIt's not just Ye-Eun, but also Kang and Yoon.\nI'm sure you have something like that about you, too.\nThere's something that no one can understand about you.","text":"Trước khi biết sự tình ấy, ta không nên phán xét bất cứ thứ gì cả.\nKhông những Ye Eun mà cả chị Kang và chị Yoon nữa.\nNgay cả em cũng có những chuyện như thế mà.\nNgười đời không hiểu nổi, nhưng em vẫn không thể làm khác.\\n그 사정 알기 전까진 이렇다 저렇다 말하면 안 된다는 거구\n예은이뿐만 아니라 강 언니도 그렇구, 윤 선배도 그렇구\n너만 해도 그런 거 하나쯤은 있을 거 아니야\n남들은 도저히 이해 못 해도 너는 그렇게밖에 할 수 없었던 어떤 거\\nYou can't judge people until you know their reasons.\nIt's not just Ye-Eun, but also Kang and Yoon.\nI'm sure you have something like that about you, too.\nThere's something that no one can understand about you.","koRange":{"start":2108.175057,"end":2124.873121},"viRange":{"start":1975.706682,"end":1992.517929},"start":1975.706682,"end":2124.873121,"koSentenceMarks":[2112.503,2116.533,2119.69],"koShadowSegments":[{"index":0,"start":2108.175057,"end":2112.503,"text":"그 사정 알기 전까진 이렇다 저렇다 말하면 안 된다는 거구","speed":1,"cueUid":"merged-msbfeljp-63"},{"index":1,"start":2112.503,"end":2116.533,"text":"예은이뿐만 아니라 강 언니도 그렇구, 윤 선배도 그렇구","speed":1,"cueUid":"merged-msbfeljp-63"},{"index":2,"start":2116.533,"end":2119.69,"text":"너만 해도 그런 거 하나쯤은 있을 거 아니야","speed":1,"cueUid":"merged-msbfeljp-63"},{"index":3,"start":2119.69,"end":2124.873,"text":"남들은 도저히 이해 못 해도 너는 그렇게밖에 할 수 없었던 어떤 거","speed":1,"cueUid":"merged-msbfeljp-63"}],"hasShadow":true,"segments":[{"index":0,"start":2108.175057,"end":2112.503,"text":"그 사정 알기 전까진 이렇다 저렇다 말하면 안 된다는 거구","speed":1,"cueUid":"merged-msbfeljp-63"},{"index":1,"start":2112.503,"end":2116.533,"text":"예은이뿐만 아니라 강 언니도 그렇구, 윤 선배도 그렇구","speed":1,"cueUid":"merged-msbfeljp-63"},{"index":2,"start":2116.533,"end":2119.69,"text":"너만 해도 그런 거 하나쯤은 있을 거 아니야","speed":1,"cueUid":"merged-msbfeljp-63"},{"index":3,"start":2119.69,"end":2124.873,"text":"남들은 도저히 이해 못 해도 너는 그렇게밖에 할 수 없었던 어떤 거","speed":1,"cueUid":"merged-msbfeljp-63"}]},{"id":111,"cueNo":112,"displayNo":112,"sourceUid":"merged-msbfggry-64","uid":"merged-msbfggry-64","originalCueNo":112,"vi":"Nên là, không nên phán xét đúng sai một cách tùy tiện chuyện của người khác.\n[Âm nhạc êm dịu và nhẹ nhàng] \nSao vậy? Chị làm ra vẻ ta đây quá hả? Không ạ.\nChỉ là chị rất…\n- Rất gì? - Rất ngầu ấy ạ.\nKhác với thường ngày.","ko":"그러니까-남의 일에 대해선 함부로 이게 옳다-그르다-말...\n[잔잔하고 부드러운 음악] \n왜?-내가 너무 잘난 체했냐?-아뇨!\n그냥 되게, 선배가 되게...\n되게 뭐? - 멋있어서요\n평소와는 달리","en":"That's why you can't judge people willy-nilly...\n[Calm and soft music] \nWhat? Was I acting way too holier-than-thou? No.\nI just feel that you're really...\n-Really what? -You are cool.\nIt's unusual.","text":"Nên là, không nên phán xét đúng sai một cách tùy tiện chuyện của người khác.\n[Âm nhạc êm dịu và nhẹ nhàng] \nSao vậy? Chị làm ra vẻ ta đây quá hả? Không ạ.\nChỉ là chị rất…\n- Rất gì? - Rất ngầu ấy ạ.\nKhác với thường ngày.\\n그러니까-남의 일에 대해선 함부로 이게 옳다-그르다-말...\n[잔잔하고 부드러운 음악] \n왜?-내가 너무 잘난 체했냐?-아뇨!\n그냥 되게, 선배가 되게...\n되게 뭐? - 멋있어서요\n평소와는 달리\\nThat's why you can't judge people willy-nilly...\n[Calm and soft music] \nWhat? Was I acting way too holier-than-thou? No.\nI just feel that you're really...\n-Really what? -You are cool.\nIt's unusual.","koRange":{"start":2124.873121,"end":2148.537144},"viRange":{"start":1992.517929,"end":2015.215435},"start":1992.517929,"end":2148.537144,"koSentenceMarks":[2130.641,2136.246,2141.406,2143.615],"koShadowSegments":[{"index":0,"start":2124.873121,"end":2130.641,"text":"그러니까-남의 일에 대해선 함부로 이게 옳다-그르다-말...","speed":1,"cueUid":"merged-msbfggry-64"},{"index":1,"start":2130.641,"end":2136.246,"text":"왜?-내가 너무 잘난 체했냐?-아뇨!","speed":1,"cueUid":"merged-msbfggry-64"},{"index":2,"start":2136.246,"end":2141.406,"text":"그냥 되게, 선배가 되게...","speed":1,"cueUid":"merged-msbfggry-64"},{"index":3,"start":2141.406,"end":2143.615,"text":"되게 뭐? - 멋있어서요","speed":1,"cueUid":"merged-msbfggry-64"},{"index":4,"start":2143.615,"end":2148.5,"text":"평소와는 달리","speed":1,"cueUid":"merged-msbfggry-64"}],"hasShadow":true,"segments":[{"index":0,"start":2124.873121,"end":2130.641,"text":"그러니까-남의 일에 대해선 함부로 이게 옳다-그르다-말...","speed":1,"cueUid":"merged-msbfggry-64"},{"index":1,"start":2130.641,"end":2136.246,"text":"왜?-내가 너무 잘난 체했냐?-아뇨!","speed":1,"cueUid":"merged-msbfggry-64"},{"index":2,"start":2136.246,"end":2141.406,"text":"그냥 되게, 선배가 되게...","speed":1,"cueUid":"merged-msbfggry-64"},{"index":3,"start":2141.406,"end":2143.615,"text":"되게 뭐? - 멋있어서요","speed":1,"cueUid":"merged-msbfggry-64"},{"index":4,"start":2143.615,"end":2148.5,"text":"평소와는 달리","speed":1,"cueUid":"merged-msbfggry-64"}]},{"id":112,"cueNo":113,"displayNo":113,"sourceUid":"merged-msbfjtpq-65","uid":"merged-msbfjtpq-65","originalCueNo":113,"vi":"Thế thường ngày chị thế nào?\nThường ngày hòa nhã, nhưng giờ lại rất hiểu biết hả?\nÝ em là vậy phải không? Đúng không nào?\nEm cảm động với cả sự hiểu biết của chị sao?\nĐúng rồi, đi kì cọ ghét thôi nào.","ko":"(송지원) [웃음 소리] 평소엔 내가 어땠는데?\n평소엔 우아했는데 지금은 지적이야?\n그 뜻이지? 그 뜻이야?\n내가 한 '지적'하지 니가 나의 지성에 감명을 받았구나\n아하, 그렇지, 때 밀러 가자","en":"What am I usually like, then?\nUsually, I am gracious, but I am intellectual right now?\nThat's what you meant, right? You totally respect me now.\nYou're totally in awe of my intellect, aren't you?\nAll right, let's get you exfoliated.","text":"Thế thường ngày chị thế nào?\nThường ngày hòa nhã, nhưng giờ lại rất hiểu biết hả?\nÝ em là vậy phải không? Đúng không nào?\nEm cảm động với cả sự hiểu biết của chị sao?\nĐúng rồi, đi kì cọ ghét thôi nào.\\n(송지원) [웃음 소리] 평소엔 내가 어땠는데?\n평소엔 우아했는데 지금은 지적이야?\n그 뜻이지? 그 뜻이야?\n내가 한 '지적'하지 니가 나의 지성에 감명을 받았구나\n아하, 그렇지, 때 밀러 가자\\nWhat am I usually like, then?\nUsually, I am gracious, but I am intellectual right now?\nThat's what you meant, right? You totally respect me now.\nYou're totally in awe of my intellect, aren't you?\nAll right, let's get you exfoliated.","koRange":{"start":2148.537144,"end":2169.124536},"viRange":{"start":2015.215435,"end":2034.154211},"start":2015.215435,"end":2169.124536,"koSentenceMarks":[2152.75,2155.7,2158,2163.346],"koShadowSegments":[{"index":0,"start":2148.537144,"end":2152.75,"text":"평소엔 내가 어땠는데?","speed":1,"cueUid":"merged-msbfjtpq-65"},{"index":1,"start":2152.75,"end":2155.7,"text":"평소엔 우아했는데 지금은 지적이야?","speed":1,"cueUid":"merged-msbfjtpq-65"},{"index":2,"start":2155.7,"end":2158,"text":"그 뜻이지? 그 뜻이야?","speed":1,"cueUid":"merged-msbfjtpq-65"},{"index":3,"start":2158,"end":2163.346,"text":"내가 한 '지적'하지 니가 나의 지성에 감명을 받았구나","speed":1,"cueUid":"merged-msbfjtpq-65"},{"index":4,"start":2163.346,"end":2166.676,"text":"아하, 그렇지, 때 밀러 가자","speed":1,"cueUid":"merged-msbfjtpq-65"}],"hasShadow":true,"segments":[{"index":0,"start":2148.537144,"end":2152.75,"text":"평소엔 내가 어땠는데?","speed":1,"cueUid":"merged-msbfjtpq-65"},{"index":1,"start":2152.75,"end":2155.7,"text":"평소엔 우아했는데 지금은 지적이야?","speed":1,"cueUid":"merged-msbfjtpq-65"},{"index":2,"start":2155.7,"end":2158,"text":"그 뜻이지? 그 뜻이야?","speed":1,"cueUid":"merged-msbfjtpq-65"},{"index":3,"start":2158,"end":2163.346,"text":"내가 한 '지적'하지 니가 나의 지성에 감명을 받았구나","speed":1,"cueUid":"merged-msbfjtpq-65"},{"index":4,"start":2163.346,"end":2166.676,"text":"아하, 그렇지, 때 밀러 가자","speed":1,"cueUid":"merged-msbfjtpq-65"}]},{"id":113,"cueNo":114,"displayNo":114,"sourceUid":"ko-ms9zfai4-1088","uid":"ko-ms9zfai4-1088","originalCueNo":114,"vi":"[Kết thúc bản nhạc êm dịu và nhẹ nhàng]","ko":"[잔잔하고 부드러운 음악 끝]","en":"[Calm and soft music ends]","text":"[Kết thúc bản nhạc êm dịu và nhẹ nhàng]\\n[잔잔하고 부드러운 음악 끝]\\n[Calm and soft music ends]","koRange":null,"viRange":null,"start":2164.96,"end":2167.36,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":114,"cueNo":115,"displayNo":115,"sourceUid":"merged-msbfltk6-66","uid":"merged-msbfltk6-66","originalCueNo":115,"vi":"THI VIẾT","ko":"","en":"WRITTEN EXAM","text":"THI VIẾT\\nWRITTEN EXAM","koRange":null,"viRange":null,"start":2166.7,"end":2169.1,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":115,"cueNo":116,"displayNo":116,"sourceUid":"merged-msbfmmgy-67","uid":"merged-msbfmmgy-67","originalCueNo":116,"vi":"[Tiếng lật giấy]\nChà, những nơi thế này lương tầm bao nhiêu nhỉ?\nChắc phải tầm ba đến bốn triệu won?\nNhiều như thế cơ ạ?\nCứ cho là ba triệu đi.\nVậy thì chỉ cần làm ba tháng là được rồi.\nNày, tiền lương để trả hết nợ thì nó ăn gì mà sống?","ko":"[종이 뒤집는 소리]\n(사채업 직원) 이야, 이런 덴 월급이 얼만가?\n(사채업 사장) 한 3, 4백은 되지, 아마?\n(사채업 직원) 진, 진짜요? 그렇게 많아요?\n자, 한 달에 3백이라 치고\n아이, 그럼 세 달 반만 일하면 되네\n야, 이 새끼야, 월급 받아서 다 빚 갚으면 쟤 뭐 먹고 사냐?","en":"[Sound of paper flipping]\nWow, how much does a company like this pay?\nMaybe three to four million won per month?\nDo they really pay people that much?\nLet's say three million per month.\nThen, she only needs to work three months.\nHey, how would she get by if she used her entire paycheck to pay us back?","text":"[Tiếng lật giấy]\nChà, những nơi thế này lương tầm bao nhiêu nhỉ?\nChắc phải tầm ba đến bốn triệu won?\nNhiều như thế cơ ạ?\nCứ cho là ba triệu đi.\nVậy thì chỉ cần làm ba tháng là được rồi.\nNày, tiền lương để trả hết nợ thì nó ăn gì mà sống?\\n[종이 뒤집는 소리]\n(사채업 직원) 이야, 이런 덴 월급이 얼만가?\n(사채업 사장) 한 3, 4백은 되지, 아마?\n(사채업 직원) 진, 진짜요? 그렇게 많아요?\n자, 한 달에 3백이라 치고\n아이, 그럼 세 달 반만 일하면 되네\n야, 이 새끼야, 월급 받아서 다 빚 갚으면 쟤 뭐 먹고 사냐?\\n[Sound of paper flipping]\nWow, how much does a company like this pay?\nMaybe three to four million won per month?\nDo they really pay people that much?\nLet's say three million per month.\nThen, she only needs to work three months.\nHey, how would she get by if she used her entire paycheck to pay us back?","koRange":{"start":2187,"end":2201.677482},"viRange":{"start":2055,"end":2072.839326},"start":2055,"end":2201.677482,"koSentenceMarks":[2190.349,2192.7,2194.407,2198.645],"koShadowSegments":[{"index":0,"start":2187,"end":2190.349,"text":"이야, 이런 덴 월급이 얼만가?","speed":1,"cueUid":"merged-msbfmmgy-67"},{"index":1,"start":2190.349,"end":2192.7,"text":"한 3, 4백은 되지, 아마?","speed":1,"cueUid":"merged-msbfmmgy-67"},{"index":2,"start":2192.7,"end":2194.407,"text":"진, 진짜요? 그렇게 많아요?","speed":1,"cueUid":"merged-msbfmmgy-67"},{"index":3,"start":2194.407,"end":2198.645,"text":"자, 한 달에 3백이라 치고 아이, 그럼 세 달 반만 일하면 되네","speed":1,"cueUid":"merged-msbfmmgy-67"},{"index":4,"start":2198.645,"end":2201.677,"text":"야, 이 새끼야, 월급 받아서 다 빚 갚으면 쟤 뭐 먹고 사냐?","speed":1,"cueUid":"merged-msbfmmgy-67"}],"hasShadow":true,"segments":[{"index":0,"start":2187,"end":2190.349,"text":"이야, 이런 덴 월급이 얼만가?","speed":1,"cueUid":"merged-msbfmmgy-67"},{"index":1,"start":2190.349,"end":2192.7,"text":"한 3, 4백은 되지, 아마?","speed":1,"cueUid":"merged-msbfmmgy-67"},{"index":2,"start":2192.7,"end":2194.407,"text":"진, 진짜요? 그렇게 많아요?","speed":1,"cueUid":"merged-msbfmmgy-67"},{"index":3,"start":2194.407,"end":2198.645,"text":"자, 한 달에 3백이라 치고 아이, 그럼 세 달 반만 일하면 되네","speed":1,"cueUid":"merged-msbfmmgy-67"},{"index":4,"start":2198.645,"end":2201.677,"text":"야, 이 새끼야, 월급 받아서 다 빚 갚으면 쟤 뭐 먹고 사냐?","speed":1,"cueUid":"merged-msbfmmgy-67"}]},{"id":116,"cueNo":117,"displayNo":117,"sourceUid":"merged-msbuqz8t-1","uid":"merged-msbuqz8t-1","originalCueNo":117,"vi":"Mày không có lòng thương người gì cả. Phải cho sinh hoạt phí chứ.\nCứ coi sinh hoạt phí là một triệu.\nVậy mỗi tháng hai triệu, thì sáu tháng là trả được cả lãi rồi.\nĐúng chuẩn rồi!\nCô chỉ cần ký như thế là đẹp cả đôi đường mà.","ko":"아이, 애 새끼가 인간미가 없어 생활비는 빼줘야 될 거 아니야?\n자 그러면, 생활비를 백이라 치고\n한 달에 2백씩 다섯 달 이자까지 여섯 달\n야, 그럼 딱 인데\n그렇게 해주겠다고 사인만 하면 우리 서로 행복한 건데, 어?","en":"You have no humanity. We need to account for her living expenses.\nLet's say the living expenses are one million per month.\nYou can pay us two million per month, about six months including interest.\nThat'd be perfect!\nIf you agree to this, all of us will be happy.","text":"Mày không có lòng thương người gì cả. Phải cho sinh hoạt phí chứ.\nCứ coi sinh hoạt phí là một triệu.\nVậy mỗi tháng hai triệu, thì sáu tháng là trả được cả lãi rồi.\nĐúng chuẩn rồi!\nCô chỉ cần ký như thế là đẹp cả đôi đường mà.\\n아이, 애 새끼가 인간미가 없어 생활비는 빼줘야 될 거 아니야?\n자 그러면, 생활비를 백이라 치고\n한 달에 2백씩 다섯 달 이자까지 여섯 달\n야, 그럼 딱 인데\n그렇게 해주겠다고 사인만 하면 우리 서로 행복한 건데, 어?\\nYou have no humanity. We need to account for her living expenses.\nLet's say the living expenses are one million per month.\nYou can pay us two million per month, about six months including interest.\nThat'd be perfect!\nIf you agree to this, all of us will be happy.","koRange":{"start":2201.677482,"end":2216.453273},"viRange":{"start":2072.839326,"end":2084.771971},"start":2072.839326,"end":2216.453273,"koSentenceMarks":[2204.9,2207.626,2211.8],"koShadowSegments":[{"index":0,"start":2201.677482,"end":2204.9,"text":"아이, 애 새끼가 인간미가 없어 생활비는 빼줘야 될 거 아니야?","speed":1,"cueUid":"merged-msbuqz8t-1"},{"index":1,"start":2204.9,"end":2207.626,"text":"자 그러면, 생활비를 백이라 치고","speed":1,"cueUid":"merged-msbuqz8t-1"},{"index":2,"start":2207.626,"end":2211.8,"text":"한 달에 2백씩 다섯 달 이자까지 여섯 달 야, 그럼 딱 인데","speed":1,"cueUid":"merged-msbuqz8t-1"},{"index":3,"start":2211.8,"end":2216.453,"text":"그렇게 해주겠다고 사인만 하면 우리 서로 행복한 건데, 어?","speed":1,"cueUid":"merged-msbuqz8t-1"}],"hasShadow":true,"segments":[{"index":0,"start":2201.677482,"end":2204.9,"text":"아이, 애 새끼가 인간미가 없어 생활비는 빼줘야 될 거 아니야?","speed":1,"cueUid":"merged-msbuqz8t-1"},{"index":1,"start":2204.9,"end":2207.626,"text":"자 그러면, 생활비를 백이라 치고","speed":1,"cueUid":"merged-msbuqz8t-1"},{"index":2,"start":2207.626,"end":2211.8,"text":"한 달에 2백씩 다섯 달 이자까지 여섯 달 야, 그럼 딱 인데","speed":1,"cueUid":"merged-msbuqz8t-1"},{"index":3,"start":2211.8,"end":2216.453,"text":"그렇게 해주겠다고 사인만 하면 우리 서로 행복한 건데, 어?","speed":1,"cueUid":"merged-msbuqz8t-1"}]},{"id":117,"cueNo":118,"displayNo":118,"sourceUid":"merged-msbut46z-2","uid":"merged-msbut46z-2","originalCueNo":118,"vi":"Này, nhỏ sinh viên!\nCô thật sự không sao dù mẹ có thành thế nào à?\nMẹ thì nói không có cách nào trả được.\nĐứa con gái thì từ chối không trả.\nNếu thế thì bọn tôi thật sự phải ra tay rồi.\nVậy cũng không sao chứ?","ko":"어이, 학생!\n진짜 괜찮겠어? 엄마 어떻게 돼도?\n아무리 둘러봐도 돈 받을 길은 없고\n하나밖에 없는 딸년이 못 갚겠다고 하고\n그럼 진짜 우리식으로 해야 되는데\n그래도 괜찮겠어?","en":"Hey, you!\nYou don't care what happens to your mom?\nThere's no way your mom can pay back\nand her only daughter refuses to help her.\nWe'll really have to do things our way then.\nAre you okay with that?","text":"Này, nhỏ sinh viên!\nCô thật sự không sao dù mẹ có thành thế nào à?\nMẹ thì nói không có cách nào trả được.\nĐứa con gái thì từ chối không trả.\nNếu thế thì bọn tôi thật sự phải ra tay rồi.\nVậy cũng không sao chứ?\\n어이, 학생!\n진짜 괜찮겠어? 엄마 어떻게 돼도?\n아무리 둘러봐도 돈 받을 길은 없고\n하나밖에 없는 딸년이 못 갚겠다고 하고\n그럼 진짜 우리식으로 해야 되는데\n그래도 괜찮겠어?\\nHey, you!\nYou don't care what happens to your mom?\nThere's no way your mom can pay back\nand her only daughter refuses to help her.\nWe'll really have to do things our way then.\nAre you okay with that?","koRange":{"start":2216.453273,"end":2242.384178},"viRange":{"start":2084.771971,"end":2110.043989},"start":2084.771971,"end":2242.384178,"koSentenceMarks":[2218.692,2224.973,2234.543,2238.014,2240.754],"koShadowSegments":[{"index":0,"start":2216.453273,"end":2218.692,"text":"어이, 학생!","speed":1,"cueUid":"merged-msbut46z-2"},{"index":1,"start":2221,"end":2224.973,"text":"진짜 괜찮겠어? 엄마 어떻게 돼도?","speed":1,"cueUid":"merged-msbut46z-2"},{"index":2,"start":2232,"end":2234.543,"text":"아무리 둘러봐도 돈 받을 길은 없고","speed":1,"cueUid":"merged-msbut46z-2"},{"index":3,"start":2235,"end":2238.014,"text":"하나밖에 없는 딸년이 못 갚겠다고 하고","speed":1,"cueUid":"merged-msbut46z-2"},{"index":4,"start":2238.014,"end":2240.754,"text":"그럼 진짜 우리식으로 해야 되는데","speed":1,"cueUid":"merged-msbut46z-2"},{"index":5,"start":2240.754,"end":2242.135,"text":"그래도 괜찮겠어?","speed":1,"cueUid":"merged-msbut46z-2"}],"hasShadow":true,"segments":[{"index":0,"start":2216.453273,"end":2218.692,"text":"어이, 학생!","speed":1,"cueUid":"merged-msbut46z-2"},{"index":1,"start":2221,"end":2224.973,"text":"진짜 괜찮겠어? 엄마 어떻게 돼도?","speed":1,"cueUid":"merged-msbut46z-2"},{"index":2,"start":2232,"end":2234.543,"text":"아무리 둘러봐도 돈 받을 길은 없고","speed":1,"cueUid":"merged-msbut46z-2"},{"index":3,"start":2235,"end":2238.014,"text":"하나밖에 없는 딸년이 못 갚겠다고 하고","speed":1,"cueUid":"merged-msbut46z-2"},{"index":4,"start":2238.014,"end":2240.754,"text":"그럼 진짜 우리식으로 해야 되는데","speed":1,"cueUid":"merged-msbut46z-2"},{"index":5,"start":2240.754,"end":2242.135,"text":"그래도 괜찮겠어?","speed":1,"cueUid":"merged-msbut46z-2"}]},{"id":118,"cueNo":119,"displayNo":119,"sourceUid":"ko-ms9zfai4-1101","uid":"ko-ms9zfai4-1101","originalCueNo":119,"vi":"[Âm nhạc lo lắng bắt đầu]","ko":"[불안한 분위기의 음악 시작]","en":"[Anxious music begins]","text":"[Âm nhạc lo lắng bắt đầu]\\n[불안한 분위기의 음악 시작]\\n[Anxious music begins]","koRange":null,"viRange":null,"start":2225.1,"end":2228.13,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":119,"cueNo":120,"displayNo":120,"sourceUid":"merged-msbuvg1l-3","uid":"merged-msbuvg1l-3","originalCueNo":120,"vi":"(Chủ doanh nghiệp cho vay tư nhân)\nCô chỉ cần ký vào đây là được. Đây nữa.\nEm nghỉ đi. Nghỉ việc ở nhà hàng đi.\nChỉ là việc làm thêm thôi. Có nhiều công việc như thế mà.\nTôi không thể nghỉ được.\nĐối với tôi, nơi này chính là đường giới hạn.\nTận cùng mặt đất.","ko":"(사채업 사장) 다-읽었으면 여기다-사인\n(사채업 사장) 하나 더\n(박재완) 그만둬요 레스토랑 그만둬요\n어차피 알바고, 거기 아니어도 그 정도 일자리는 많잖아요\n그만둘 수 없어요\n나한테 여기는 한계선 같은 거예요\n땅끝 같은 거","en":"(Private loan business owner) \nIf you're done reading it, sign here. Here, too.\nJust quit. Stop working at the restaurant.\nIt's just a part-time job anyway, there's plenty of other jobs.\nI can't quit. To me, this place is like a test. A kind of trial run.","text":"(Chủ doanh nghiệp cho vay tư nhân)\nCô chỉ cần ký vào đây là được. Đây nữa.\nEm nghỉ đi. Nghỉ việc ở nhà hàng đi.\nChỉ là việc làm thêm thôi. Có nhiều công việc như thế mà.\nTôi không thể nghỉ được.\nĐối với tôi, nơi này chính là đường giới hạn.\nTận cùng mặt đất.\\n(사채업 사장) 다-읽었으면 여기다-사인\n(사채업 사장) 하나 더\n(박재완) 그만둬요 레스토랑 그만둬요\n어차피 알바고, 거기 아니어도 그 정도 일자리는 많잖아요\n그만둘 수 없어요\n나한테 여기는 한계선 같은 거예요\n땅끝 같은 거\\n(Private loan business owner) \nIf you're done reading it, sign here. Here, too.\nJust quit. Stop working at the restaurant.\nIt's just a part-time job anyway, there's plenty of other jobs.\nI can't quit. To me, this place is like a test. A kind of trial run.","koRange":{"start":2242.384178,"end":2304.09417 [],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":121,"cueNo":122,"displayNo":122,"sourceUid":"merged-msbuz95j-4","uid":"merged-msbuz95j-4","originalCueNo":122,"vi":"Nếu tôi không thể chịu đựng ở đây, tôi sẽ không thể chịu đựng ở nơi khác.\nNếu có thể chịu đựng ở đây, ở đâu tôi cũng có thể chịu được.\nTôi đã quyết tâm như thế. Vì vậy… tôi sẽ không nghỉ đâu.\nEm sẽ chịu đựng sao?\nĐối với em, cuộc sống này…\nlà như thế sao? Là sự chịu đựng?\nVâng. Vậy thì tùy ý em.","ko":"여기서 못 버티면 난 아무데서도 못 버텨요\n여기서 버티면 어디서든 버텨낼 수 있어요\n(윤진명) 나 혼자 그렇게 결심했어요\n그러니까 난 그만두지 않을 거예요\n(박재완) 버티는 겁니까?\n진명 씨한테 산다는 거\n그런 겁니까? 버티는 거? 네\n맘대로 해요","en":"If I can't survive here, then I won't be able to last anywhere else.\nIf I can survive here then I can do anything.\nI've decided to do that. That's why...I will not quit.\nSo you'll just endure?\nFor you, life is just... a series of obstacles to endure?\nYes. Do whatever you want, then.","text":"Nếu tôi không thể chịu đựng ở đây, tôi sẽ không thể chịu đựng ở nơi khác.\nNếu có thể chịu đựng ở đây, ở đâu tôi cũng có thể chịu được.\nTôi đã quyết tâm như thế. Vì vậy… tôi sẽ không nghỉ đâu.\nEm sẽ chịu đựng sao?\nĐối với em, cuộc sống này…\nlà như thế sao? Là sự chịu đựng?\nVâng. Vậy thì tùy ý em.\\n여기서 못 버티면 난 아무데서도 못 버텨요\n여기서 버티면 어디서든 버텨낼 수 있어요\n(윤진명) 나 혼자 그렇게 결심했어요\n그러니까 난 그만두지 않을 거예요\n(박재완) 버티는 겁니까?\n진명 씨한테 산다는 거\n그런 겁니까? 버티는 거? 네\n맘대로 해요\\nIf I can't survive here, then I won't be able to last anywhere else.\nIf I can survive here then I can do anything.\nI've decided to do that. That's why...I will not quit.\nSo you'll just endure?\nFor you, life is just... a series of obstacles to endure?\nYes. Do whatever you want, then.","koRange":{"start":2304.094172,"end":2354.925941},"viRange":{"start":2177.950474,"end":2222.635665},"start":2177.950474,"end":2354.925941,"koSentenceMarks":[2310.451,2316.63,2321.33,2328.937,2332.786,2341],"koShadowSegments":[{"index":0,"start":2304.094172,"end":2310.451,"text":"여기서 못 버티면 난 아무데서도 못 버텨요","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":1,"start":2310.451,"end":2316.63,"text":"여기서 버티면 어디서든 버텨낼 수 있어요","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":2,"start":2316.63,"end":2321.33,"text":"나 혼자 그렇게 결심했어요","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":3,"start":2321.33,"end":2328.937,"text":"그러니까 난 그만두지 않을 거예요","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":4,"start":2328.937,"end":2332.786,"text":"버티는 겁니까?","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":5,"start":2332.786,"end":2341,"text":"진명 씨한테 산다는 거 그런 겁니까?","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":6,"start":2341,"end":2354,"text":"버티는 거? 네 맘대로 해요","speed":1,"cueUid":"merged-msbuz95j-4"}],"hasShadow":true,"segments":[{"index":0,"start":2304.094172,"end":2310.451,"text":"여기서 못 버티면 난 아무데서도 못 버텨요","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":1,"start":2310.451,"end":2316.63,"text":"여기서 버티면 어디서든 버텨낼 수 있어요","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":2,"start":2316.63,"end":2321.33,"text":"나 혼자 그렇게 결심했어요","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":3,"start":2321.33,"end":2328.937,"text":"그러니까 난 그만두지 않을 거예요","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":4,"start":2328.937,"end":2332.786,"text":"버티는 겁니까?","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":5,"start":2332.786,"end":2341,"text":"진명 씨한테 산다는 거 그런 겁니까?","speed":1,"cueUid":"merged-msbuz95j-4"},{"index":6,"start":2341,"end":2354,"text":"버티는 거? 네 맘대로 해요","speed":1,"cueUid":"merged-msbuz95j-4"}]},{"id":122,"cueNo":123,"displayNo":123,"sourceUid":"merged-msbv6vi2-5","uid":"merged-msbv6vi2-5","originalCueNo":123,"vi":"Tối nay có đoàn khách VIP.\nSẽ có hai sườn nướng chữ T, hai sườn nướng nạc lưng.\nChuẩn bị trước thêm hai cặp rượu vang nữa.\nVâng. Phải chính xác đấy. Được rồi, tiếp theo…","ko":"오늘 저녁에 VIP 단체가 있다\n브로일 같은 경우는 오늘 티본 스테이크 2개 립아이 스테이크 2개\n그리고 안심스테이크 2개 2개, 2개씩 다 준비해 주고\n(브로일) 예\n(매니저) 정확하게 하셔야 됩니다, 이번에 - 네","en":"We have a group of VIPs today.\nBroil Team, I will need two t-bone steaks and two rib eye steaks.\nTwo pairs of wine pairings. Make sure you prepare that.\nYes, sir. Let's be precise, all right? Okay. Next...","text":"Tối nay có đoàn khách VIP.\nSẽ có hai sườn nướng chữ T, hai sườn nướng nạc lưng.\nChuẩn bị trước thêm hai cặp rượu vang nữa.\nVâng. Phải chính xác đấy. Được rồi, tiếp theo…\\n오늘 저녁에 VIP 단체가 있다\n브로일 같은 경우는 오늘 티본 스테이크 2개 립아이 스테이크 2개\n그리고 안심스테이크 2개 2개, 2개씩 다 준비해 주고\n(브로일) 예\n(매니저) 정확하게 하셔야 됩니다, 이번에 - 네\\nWe have a group of VIPs today.\nBroil Team, I will need two t-bone steaks and two rib eye steaks.\nTwo pairs of wine pairings. Make sure you prepare that.\nYes, sir. Let's be precise, all right? Okay. Next...","koRange":{"start":2354.925941,"end":2398.325252},"viRange":{"start":2222.635665,"end":2250.443802},"start":2222.635665,"end":2398.325252,"koSentenceMarks":[2372.6,2375.78,2378.7],"koShadowSegments":[{"index":0,"start":2370,"end":2372.6,"text":"오늘 저녁에 VIP 단체가 있다","speed":1,"cueUid":"merged-msbv6vi2-5"},{"index":1,"start":2372.6,"end":2375.78,"text":"브로일 같은 경우는 오늘 티본 스테이크 2개 립아이 스테이크 2개","speed":1,"cueUid":"merged-msbv6vi2-5"},{"index":2,"start":2375.78,"end":2378.7,"text":"그리고 안심스테이크 2개 2개, 2개씩 다 준비해 주고","speed":1,"cueUid":"merged-msbv6vi2-5"},{"index":3,"start":2378.7,"end":2395,"text":"예 정확하게 하셔야 됩니다, 이번에 - 네","speed":1,"cueUid":"merged-msbv6vi2-5"}],"hasShadow":true,"segments":[{"index":0,"start":2370,"end":2372.6,"text":"오늘 저녁에 VIP 단체가 있다","speed":1,"cueUid":"merged-msbv6vi2-5"},{"index":1,"start":2372.6,"end":2375.78,"text":"브로일 같은 경우는 오늘 티본 스테이크 2개 립아이 스테이크 2개","speed":1,"cueUid":"merged-msbv6vi2-5"},{"index":2,"start":2375.78,"end":2378.7,"text":"그리고 안심스테이크 2개 2개, 2개씩 다 준비해 주고","speed":1,"cueUid":"merged-msbv6vi2-5"},{"index":3,"start":2378.7,"end":2395,"text":"예 정확하게 하셔야 됩니다, 이번에 - 네","speed":1,"cueUid":"merged-msbv6vi2-5"}]},{"id":123,"cueNo":124,"displayNo":124,"sourceUid":"merged-msbvbmsj-6","uid":"merged-msbvbmsj-6","originalCueNo":124,"vi":"[tiếng cửa] [tiếng bước chân]\n[Tiếng cửa] [Tiếng chạy nước kiệu]\n[Âm thanh đóng cửa] [Âm thanh thông  know.\nI'm well aware.\nShe knows it well. Do you want to join us, too?\nWhatever, then.","text":"Em nghĩ rượu ở đây miễn phí à?\nBọn nó điên hay sao mà đãi em uống?\nTôi biết. Biết chứ.\nBiết rõ chứ.\nCô ấy biết kìa. Cô có muốn nhập cuộc không?\nVậy thì thôi.\\n야 임마, 이게 공짜 술인 줄 알아? 얘네들이 미쳤다고 술 사주는 줄 알아?\n알아! 안다고\n나도 안다고\n안다는데 같이 놀래?\n안다면야 뭐\\nDo you think this is free booze?\nWhy do you think they buy you free drinks?\nI know. I know.\nI'm well aware.\nShe knows it well. Do you want to join us, too?\nWhatever, then.","koRange":{"start":2702.836534,"end":2730.805},"viRange":{"start":2570.166735,"end":2597.728},"start":2570.166735,"end":2730.805,"koSentenceMarks":[2706.507,2708.85,2714.074,2724.938],"koShadowSegments":[{"index":0,"start":2702.837,"end":2706.507,"text":"야 임마, 이게 공짜 술인 줄 알아? 얘네들이 미쳤다고 술 사주는 줄 알아?","speed":1,"cueUid":"merged-msculgxc-16"},{"index":1,"start":2706.507,"end":2708.85,"text":"알아! 안다고","speed":1,"cueUid":"merged-msculgxc-16"},{"index":2,"start":2708.85,"end":2714.074,"text":"나도 안다고","speed":1,"cueUid":"merged-msculgxc-16"},{"index":3,"start":2720,"end":2724.938,"text":"안다는데 같이 놀래?","speed":1,"cueUid":"merged-msculgxc-16"},{"index":4,"start":2728,"end":2730.476,"text":"안다면야 뭐","speed":1,"cueUid":"merged-msculgxc-16"}],"hasShadow":true,"segments":[{"index":0,"start":2702.837,"end":2706.507,"text":"야 임마, 이게 공짜 술인 줄 알아? 얘네들이 미쳤다고 술 사주는 줄 알아?","speed":1,"cueUid":"merged-msculgxc-16"},{"index":1,"start":2706.507,"end":2708.85,"text":"알아! 안다고","speed":1,"cueUid":"merged-msculgxc-16"},{"index":2,"start":2708.85,"end":2714.074,"text":"나도 안다고","speed":1,"cueUid":"merged-msculgxc-16"},{"index":3,"start":2720,"end":2724.938,"text":"안다는데 같이 놀래?","speed":1,"cueUid":"merged-msculgxc-16"},{"index":4,"start":2728,"end":2730.476,"text":"안다면야 뭐","speed":1,"cueUid":"merged-msculgxc-16"}]},{"id":140,"cueNo":141,"displayNo":141,"sourceUid":"merged-msculn4o-17","uid":"merged-msculn4o-17","originalCueNo":141,"vi":"[Tiếng rót rượu]\n[Tiếng đập cửa]\n[âm thanh nhạc l
