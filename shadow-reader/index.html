ged-mscy9gaa-26","uid":"merged-mscy9gaa-26","originalCueNo":147,"vi":"Liên quan gì đến chị? Đằng nào em cũng hết thuốc chữa rồi. Buồn cười thật.\nEm chả giống chị chút nào hết cả, con bé này.\nEm ghét chị.\nChị cũng ghét em.","ko":"뭔 상관이야?-이미 다-망가졌는데, 웃기시네\n넌 기스도 안 났어 이년아, 나에 비하면.\n난 니가 싫어\n나도 너 싫다","en":"What does it matter when I'm already ruined? Oh, shut up.\nCompared to me, you don't even have a scratch.\nI hate you.\nI hate you, too.","text":"Liên quan gì đến chị? Đằng nào em cũng hết thuốc chữa rồi. Buồn cười thật.\nEm chả giống chị chút nào hết cả, con bé này.\nEm ghét chị.\nChị cũng ghét em.\\n뭔 상관이야?-이미 다-망가졌는데, 웃기시네\n넌 기스도 안 났어 이년아, 나에 비하면.\n난 니가 싫어\n나도 너 싫다\\nWhat does it matter when I'm already ruined? Oh, shut up.\nCompared to me, you don't even have a scratch.\nI hate you.\nI hate you, too.","koRange":{"start":2879.918751,"end":2893.3399},"viRange":{"start":2748.31893,"end":2760.158204},"start":2748.31893,"end":2893.3399,"koSentenceMarks":[2885.529,2888.389,2890],"koShadowSegments":[{"index":0,"start":2879.919,"end":2885.529,"text":"뭔 상관이야?-이미 다-망가졌는데, 웃기시네","speed":1,"cueUid":"merged-mscy9gaa-26"},{"index":1,"start":2885.529,"end":2888.389,"text":"넌 기스도 안 났어 이년아, 나에 비하면.","speed":1,"cueUid":"merged-mscy9gaa-26"},{"index":2,"start":2888.389,"end":2890,"text":"난 니가 싫어","speed":1,"cueUid":"merged-mscy9gaa-26"},{"index":3,"start":2890,"end":2893.241,"text":"나도 너 싫다","speed":1,"cueUid":"merged-mscy9gaa-26"}],"hasShadow":true,"segments":[{"index":0,"start":2879.919,"end":2885.529,"text":"뭔 상관이야?-이미 다-망가졌는데, 웃기시네","speed":1,"cueUid":"merged-mscy9gaa-26"},{"index":1,"start":2885.529,"end":2888.389,"text":"넌 기스도 안 났어 이년아, 나에 비하면.","speed":1,"cueUid":"merged-mscy9gaa-26"},{"index":2,"start":2888.389,"end":2890,"text":"난 니가 싫어","speed":1,"cueUid":"merged-mscy9gaa-26"},{"index":3,"start":2890,"end":2893.241,"text":"나도 너 싫다","speed":1,"cueUid":"merged-mscy9gaa-26"}]},{"id":147,"cueNo":148,"displayNo":148,"sourceUid":"merged-mscyb1z9-27","uid":"merged-mscyb1z9-27","originalCueNo":148,"vi":"Chị xấu xa nhất! - Ừ, cứ coi là thế đi. Thà rằng…\nmỗi mình chị làm sai thì tốt.\nNếu thế thì em chỉ phải ghét chị thôi.\nVậy sẽ đỡ bi thảm hơn.\nNgười em yêu… lại chỉ được đến mức đó thôi.","ko":"니가 젤 나뻐-네, 네, 그런 걸로 합시다. 차라리\n니가 잘못한 거였으면 좋겠어\n그럼 너만 미워하면 되잖아\n(정예은) 그럼 덜 비참하겠어\n내가 사랑한 남자가\n그것밖에 안 되는 놈인 것보다는...아아","en":"You're the worst! -Sure. Let's leave it at that. I wish...\nIf you were the one who did something wrong,\nthen I'd only have to hate you.\nThat'd make me feel less miserable.\nThe man I love is...such a pathetic man.","text":"Chị xấu xa nhất! - Ừ, cứ coi là thế đi. Thà rằng…\nmỗi mình chị làm sai thì tốt.\nNếu thế thì em chỉ phải ghét chị thôi.\nVậy sẽ đỡ bi thảm hơn.\nNgười em yêu… lại chỉ được đến mức đó thôi.\\n니가 젤 나뻐-네, 네, 그런 걸로 합시다. 차라리\n니가 잘못한 거였으면 좋겠어\n그럼 너만 미워하면 되잖아\n(정예은) 그럼 덜 비참하겠어\n내가 사랑한 남자가\n그것밖에 안 되는 놈인 것보다는...아아\\nYou're the worst! -Sure. Let's leave it at that. I wish...\nIf you were the one who did something wrong,\nthen I'd only have to hate you.\nThat'd make me feel less miserable.\nThe man I love is...such a pathetic man.","koRange":{"start":2893.3399,"end":2922.64058},"viRange":{"start":2760.158204,"end":2787.310618},"start":2760.158204,"end":2922.64058,"koSentenceMarks":[2900.172,2904.692,2911.422,2913.728,2916.708],"koShadowSegments":[{"index":0,"start":2893.34,"end":2900.172,"text":"니가 젤 나뻐-네, 네, 그런 걸로 합시다. 차라리","speed":1,"cueUid":"merged-mscyb1z9-27"},{"index":1,"start":2900.172,"end":2904.692,"text":"니가 잘못한 거였으면 좋겠어","speed":1,"cueUid":"merged-mscyb1z9-27"},{"index":2,"start":2904.692,"end":2911.422,"text":"그럼 너만 미워하면 되잖아","speed":1,"cueUid":"merged-mscyb1z9-27"},{"index":3,"start":2911.422,"end":2913.728,"text":"(정예은) 그럼 덜 비참하겠어","speed":1,"cueUid":"merged-mscyb1z9-27"},{"index":4,"start":2913.728,"end":2916.708,"text":"내가 사랑한 남자가","speed":1,"cueUid":"merged-mscyb1z9-27"},{"index":5,"start":2916.708,"end":2922.64058,"text":"그것밖에 안 되는 놈인 것보다는...아아","speed":1,"cueUid":"merged-mscyb1z9-27"}],"hasShado 음, 확실히 짜-진짜요? 어. 어우, 짜\n되게 짜, 엄청 짜다, 이거\n먹지 마요-왜?\n짜다면서요?\n아, 됐어, 먹을 거야. 먹지 마요\\nIs it good?-It's salty.\nDefinitely salty.-Really? Yes. It's so salty.\nIt's super salty.-Don't eat it, then. -Why?\nYou said it is salty.\nIt's fine. I'm eating it. No, don't eat it!","koRange":{"start":2961.370109,"end":2995.129021},"viRange":{"start":2828.328424,"end":2862.656224},"start":2828.328424,"end":2995.129021,"koSentenceMarks":[2963.167,2973.538,2984.538,2990.302,2991.92],"koShadowSegments":[{"index":0,"start":2961.370109,"end":2963.167,"text":"(윤종열) 우와!","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":1,"start":2970,"end":2973.538,"text":"어때요?-맛있어요?-짜","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":2,"start":2973.538,"end":2984.538,"text":"음, 확실히 짜-진짜요? 어. 어우, 짜","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":3,"start":2984.538,"end":2990.302,"text":"되게 짜, 엄청 짜다, 이거 먹지 마요-왜?","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":4,"start":2990.302,"end":2991.92,"text":"짜다면서요?","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":5,"start":2991.92,"end":2994.941,"text":"아, 됐어, 먹을 거야. 먹지 마요","speed":1,"cueUid":"merged-mscyg8it-30"}],"hasShadow":true,"segments":[{"index":0,"start":2961.370109,"end":2963.167,"text":"(윤종열) 우와!","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":1,"start":2970,"end":2973.538,"text":"어때요?-맛있어요?-짜","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":2,"start":2973.538,"end":2984.538,"text":"음, 확실히 짜-진짜요? 어. 어우, 짜","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":3,"start":2984.538,"end":2990.302,"text":"되게 짜, 엄청 짜다, 이거 먹지 마요-왜?","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":4,"start":2990.302,"end":2991.92,"text":"짜다면서요?","speed":1,"cueUid":"merged-mscyg8it-30"},{"index":5,"start":2991.92,"end":2994.941,"text":"아, 됐어, 먹을 거야. 먹지 마요","speed":1,"cueUid":"merged-mscyg8it-30"}]},{"id":151,"cueNo":152,"displayNo":152,"sourceUid":"merged-mscylzev-31","uid":"merged-mscylzev-31","originalCueNo":152,"vi":"Dù chỉ số muối trong người tăng gấp đôi, anh cũng sẽ ăn.\nThôi! - Anh bảo anh ăn mà!\nAnh sẽ ăn mà! - Đưa em!\nAnh sẽ ăn. - Đừng. Tiền bối!\nBỏ ngay cái tay ra!\n- Anh đang làm gì đấy? - Gì cơ?\nĐiều anh đang làm chính là quấy rối tình dục đấy!","ko":"내 몸 안의 염도가 두 배가 되는 한이 있더라도 다 먹을 거야, 내가\n됐어요!-먹는다니까\n안 먹어도 돼요, 줘요!-먹는다니까, 진짜\n(윤종열) 줘 봐, 먹을게\n(김한소영) [날카롭게] 선배!\n당장 그 손 놔요!\n지금 뭐 하는 짓이에요?-뭐가?\n선배 지금 하는 거 성희롱이거든요","en":"I'm going to eat all of this, even if the sodium level doubles in my body.\nNo! Give it! -I will eat it.\nI'm eating it! -Give it back!\nI will eat it. -Stop. You!\nLet go of her hand, right now!\nWhat are you doing right now? -What?\nThat's sexual harassment!","text":"Dù chỉ số muối trong người tăng gấp đôi, anh cũng sẽ ăn.\nThôi! - Anh bảo anh ăn mà!\nAnh sẽ ăn mà! - Đưa em!\nAnh sẽ ăn. - Đừng. Tiền bối!\nBỏ ngay cái tay ra!\n- Anh đang làm gì đấy? - Gì cơ?\nĐiều anh đang làm chính là quấy rối tình dục đấy!\\n내 몸 안의 염도가 두 배가 되는 한이 있더라도 다 먹을 거야, 내가\n됐어요!-먹는다니까\n안 먹어도 돼요, 줘요!-먹는다니까, 진짜\n(윤종열) 줘 봐, 먹을게\n(김한소영) [날카롭게] 선배!\n당장 그 손 놔요!\n지금 뭐 하는 짓이에요?-뭐가?\n선배 지금 하는 거 성희롱이거든요\\nI'm going to eat all of this, even if the sodium level doubles in my body.\nNo! Give it! -I will eat it.\nI'm eating it! -Give it back!\nI will eat it. -Stop. You!\nLet go of her hand, right now!\nWhat are you doing right now? -What?\nThat's sexual harassment!","koRange":{"start":2995.129021,"end":3016.468159},"viRange":{"start":2862.656224,"end":2884.125793},"start":2862.656224,"end":3016.468159,"koSentenceMarks":[2998.266,3002.604,3004.556,3008.516,3013.183],"koShadowSegments":[{"index":0,"start":2995.129021,"end":2998.266,"text":"내 몸 안의 염도가 두 배가 되는 한이 있더라도 다 먹을 거야, 내가","speed":1,"cueUid":"merged-mscylzev-31"},{"index":1,"start":2998.266,"end":3002.604,"text":"됐어요!-먹는다니까 안 먹어도 돼요, 줘요!-먹는다니까, 진짜","speed":1,"cueUid":"merged-mscylzev-31"},{"index":2,"start":3002.604,"end":3004.556,"text":"(윤종열) 줘 봐, 먹을게, (김한소영) [날카롭게] 선배!","speed":1,"cueUid":"merged-mscylzev-31"},{"index":3,"start":3004.556,"end":3008.516,"text":"당장 그 손 놔요!","speed":1,"cueUid":"merged-mscylzev-31"},{"index":4,"start":3008.516,"end":3013.183,"text":"지금 뭐 하는 짓이에요?-뭐가?","speed":1,"cueUid":"merged-mscylzev-31"},{"index":5,"start":3013.183,"end":3016.393,"text":"선배 지금 하는 거 성희롱이거든요","speed":1,"cueUid":"merged-mscylzev-31"}],"hasShadow":true,"segments":[{"index":0,"start":2995.129021,"end":2998.266,"text":"내 몸 안의 염도가 두 배가 되는 한이 있더라도 다 먹을 거야, 내가","speed":1,"cueUid":"merged-mscylzev-31"},{"index":1,"start":2998.266,"end":3002.604,"text":"됐어요!-먹는다니까 안 먹어도 돼요, 줘요!-먹는다니까, 진짜","speed":1,"cueUid":"merged-mscylzev-31"},{"index":2,"start":3002.604,"end":3004.556,"text":"(윤종열) 줘 봐, 먹을게, (김한소영) [날카롭게] 선배!","speed":1,"cueUid":"merged-mscylzev-31"},{"index":3,"start":3004.556,"end":3008.516,"text":"당장 그 손 놔요!","speed":1,"cueUid":"merged-mscylzev-31"},{"index":4,"start":3008.516,"end":3013.183,"text":"지금 뭐 하는 짓이에요?-뭐가?","speed":1,"cueUid":"merged-mscylzev-31"},{"index":5,"start":3013.183,"end":3016.393,"text":"선배 지금 하는 거 성희롱이거든요","speed":1,"cueUid":"merged-mscylzev-31"}]},{"id":152,"cueNo":153,"displayNo":153,"sourceUid":"merged-mscyqqcb-33","uid":"merged-mscyqqcb-33","originalCueNo":153,"vi":"Ai cũng trêu ghẹo!\nEm cũng vậy!\nKhông thích thì phải nói ngay chứ!\nVì những đứa mập mờ như em mà quấy rối tình dục mới không hết đấy.\nNày, quấy rối tình dục gì cơ chứ?\n- Bọn tôi là… - Xin lỗi.","ko":"(김한소영) 아무한테나 그냥 집적집적\n너도 똑바로 해\n싫으면 싫다고 말해\n(김한소영) 너처럼 어정쩡하게 구는 애 때문에 성희롱이 끊이지 않는 거야\n야, 성희롱은 무슨\n우리가...미안","en":"Being all touchy-feel with just anyone!\nAnd you, too! Behave yourself.\nIf you don't like it, speak up and say so!\nSexual harassment is still an issue because of girls like you.\nHey, what do you mean by \"sexual harassment\"?\n-We are-- -Sorry.","text":"Ai cũng trêu ghẹo!\nEm cũng vậy!\nKhông thích thì phải nói ngay chứ!\nVì những đứa mập mờ như em mà quấy rối tình dục mới không hết đấy.\nNày, quấy rối tình dục gì cơ chứ?\n- Bọn tôi là… - Xin lỗi.\\n(김한소영) 아무한테나 그냥 집적집적\n너도 똑바로 해\n싫으면 싫다고 말해\n(김한소영) 너처럼 어정쩡하게 구는 애 때문에 성희롱이 끊이지 않는 거야\n야, 성희롱은 무슨\n우리가...미안\\nBeing all touchy-feel with just anyone!\nAnd you, too! Behave yourself.\nIf you don't like it, speak up and say so!\nSexual harassment is still an issue because of girls like you.\nHey, what do you mean by \"sexual harassment\"?\n-We are-- -Sorry.","koRange":{"start":3016.468159,"end":3032.265749},"viRange":{"start":2884.125793,"end":2899.234222},"start":2884.125793,"end":3032.265749,"koSentenceMarks":[3018.616,3020.8,3022.665,3027.174,3030],"koShadowSegments":[{"index":0,"start":3016.468159,"end":3018.616,"text":"(김한소영) 아무한테나 그냥 집적집적","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":1,"start":3018.616,"end":3020.8,"text":"너도 똑바로 해","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":2,"start":3020.8,"end":3022.665,"text":"싫으면 싫다고 말해","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":3,"start":3022.665,"end":3027.174,"text":"(김한소영) 너처럼 어정쩡하게 구는 애 때문에 성희롱이 끊이지 않는 거야","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":4,"start":3027.174,"end":3030,"text":"야, 성희롱은 무슨","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":5,"start":3030,"end":3031.786,"text":"우리가...미안","speed":1,"cueUid":"merged-mscyqqcb-33"}],"hasShadow":true,"segments":[{"index":0,"start":3016.468159,"end":3018.616,"text":"(김한소영) 아무한테나 그냥 집적집적","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":1,"start":3018.616,"end":3020.8,"text":"너도 똑바로 해","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":2,"start":3020.8,"end":3022.665,"text":"싫으면 싫다고 말해","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":3,"start":3022.665,"end":3027.174,"text":"(김한소영) 너처럼 어정쩡하게 구는 애 때문에 성희롱이 끊이지 않는 거야","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":4,"start":3027.174,"end":3030,"text":"야, 성희롱은 무슨","speed":1,"cueUid":"merged-mscyqqcb-33"},{"index":5,"start":3030,"end":3031.786,"text":"우리가...미안","speed":1,"cueUid":"merged-mscyqqcb-33"}]},{"id":153,"cueNo":154,"displayNo":154,"sourceUid":"ko-ms9zfai5-1289","uid":"ko-ms9zfai5-1289","originalCueNo":154,"vi":"[tiếng bước chân] [tiếng thở dài]","ko":"[발걸음 소리] [한숨소리]","en":"[sound of footsteps] [sound of sighing]","text":"[tiếng bước chân] [tiếng thở dài]\\n[발걸음 소리] [한숨소리]\\n[sound of footsteps] [sound of sighing]","koRange":null,"viRange":null,"start":3034.06,"end":3036.13,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":154,"cueNo":155,"displayNo":155,"sourceUid":"merged-mscyslx1-34","uid":"merged-mscyslx1-34","originalCueNo":155,"vi":"Xin lỗi?\nXin lỗi? Em nói xin lỗi cơ à.\nEm xin lỗi cái gì?\nViệc không gạt tay anh?\nHay vì em không tức giận khi anh \"quấy rối tình dục\"?\nSao em không thể nói?\nRằng \"Anh ấy là người đàn ông của tôi\"? - Em xin lỗi.","ko":"미안?\n아흐, 미안, 미안하단 말이지\n뭐가 미안한데?\n(윤종열) 내 손을 뿌리치지 않은 거?\n(윤종열) 아니, 뭐 성희롱이라고 분연히 떨치고 일어나지 않은 거?\n왜 말을 못해?\n내가 니 남자다\n이 남자가 내 남자다!-(유은재) 미안해요","en":"Sorry?\nSorry? You are sorry.\nWhat are you sorry about?\nThe fact that you didn't push my hand away?\nOr the fact that you weren't angry about being \"sexually harassed\"?\nWhy can't you speak up?\nWhy couldn't you say, \"He's my man\"? -I'm sorry.","text":"Xin lỗi?\nXin lỗi? Em nói xin lỗi cơ à.\nEm xin lỗi cái gì?\nViệc không gạt tay anh?\nHay vì em không tức giận khi anh \"quấy rối tình dục\"?\nSao em không thể nói?\nRằng \"Anh ấy là người đàn ông của tôi\"? - Em xin lỗi.\\n미안?\n아흐, 미안, 미안하단 말이지\n뭐가 미안한데?\n(윤종열) 내 손을 뿌리치지 않은 거?\n(윤종열) 아니, 뭐 성희롱이라고 분연히 떨치고 일어나지 않은 거?\n왜 말을 못해?\n내가 니 남자다\n이 남자가 내 남자다!-(유은재) 미안해요\\nSorry?\nSorry? You are sorry.\nWhat are you sorry about?\nThe fact that you didn't push my hand away?\nOr the fact that you weren't angry about being \"sexually harassed\"?\nWhy can't you speak up?\nWhy couldn't you say, \"He's my man\"? -I'm sorry.","koRange":{"start":3032.265749,"end":3067.005704},"viRange":{"start":2899.234222,"end":2933.913224},"start":2899.234222,"end":3067.005704,"koSentenceMarks":[3046.058,3052.578,3055.367,3058.084,3060.774,3062.133,3063.903],"koShadowSegments":[{"index":0,"start":3045,"end":3046.058,"text":"미안?","speed":1,"cueUid":"merged-mscyslx1-34"},{"index":1,"star ares me.\nI don't know what I should do.\nI'm quite a frustrating person.","koRange":{"start":3107.27491,"end":3132.012869},"viRange":{"start":2975.100895,"end":2999.699192},"start":2975.100895,"end":3132.012869,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":158,"cueNo":159,"displayNo":159,"sourceUid":"ko-ms9zfai5-1315","uid":"ko-ms9zfai5-1315","originalCueNo":159,"vi":"(Jong-yeol Yoon) [thở dài]","ko":"(윤종열) [한숨소리]","en":"(Jong-yeol Yoon) [sigh]","text":"(Jong-yeol Yoon) [thở dài]\\n(윤종열) [한숨소리]\\n(Jong-yeol Yoon) [sigh]","koRange":null,"viRange":null,"start":3135.63,"end":3137.3,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":159,"cueNo":160,"displayNo":160,"sourceUid":"merged-mscz4uq6-39","uid":"merged-mscz4uq6-39","originalCueNo":160,"vi":"Anh giận rồi sao? - Em…Không lẽ anh ghét em rồi sao?\nEm là cao thủ hẹn hò đúng không?\nDạ? - Em đang làm giá đúng không?\nĐâu ạ. - Ôi trời.\nCon bé này. - Nhưng em sắp phải đi học.\nỞ thêm năm phút nữa rồi đi.\nLại còn biết nghe lời nữa. Trời ạ.","ko":"화 많이 났어요?-너...혹시 나 싫어졌어요?\n사실은 고수지?\n네?-너 나랑 밀당하는 거지, 지금?\n아닌데-으이그, 이게 진짜, 으이그\n요물 진짜-근데 저 수업 가야 되는데\n5분만 더 있다가 가\n으이그, 말은 또 잘 들어요\n으이그, 요물","en":"Are you really angry? -Yeah. Perhaps, you don't like me anymore?\nAren't you actually a pro at dating?\nWhat? -Are you playing hard to get?\nNo. You little...\nYou little rascal. I have to go to class.\nStay here just five more minutes.\nYou're so obedient. You seductress.","text":"Anh giận rồi sao? - Em…Không lẽ anh ghét em rồi sao?\nEm là cao thủ hẹn hò đúng không?\nDạ? - Em đang làm giá đúng không?\nĐâu ạ. - Ôi trời.\nCon bé này. - Nhưng em sắp phải đi học.\nỞ thêm năm phút nữa rồi đi.\nLại còn biết nghe lời nữa. Trời ạ.\\n화 많이 났어요?-너...혹시 나 싫어졌어요?\n사실은 고수지?\n네?-너 나랑 밀당하는 거지, 지금?\n아닌데-으이그, 이게 진짜, 으이그\n요물 진짜-근데 저 수업 가야 되는데\n5분만 더 있다가 가\n으이그, 말은 또 잘 들어요\n으이그, 요물\\nAre you really angry? -Yeah. Perhaps, you don't like me anymore?\nAren't you actually a pro at dating?\nWhat? -Are you playing hard to get?\nNo. You little...\nYou little rascal. I have to go to class.\nStay here just five more minutes.\nYou're so obedient. You seductress.","koRange":{"start":3132.012869,"end":3175.000943},"viRange":{"start":2999.699192,"end":3038.444941},"start":2999.699192,"end":3175.000943,"koSentenceMarks":[3144.932,3148.052,3153.311,3158.912,3162.155,3168.395],"koShadowSegments":[{"index":0,"start":3132.013,"end":3144.932,"text":"화 많이 났어요?-너...혹시 나 싫어졌어요?","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":1,"start":3144.932,"end":3148.052,"text":"사실은 고수지?","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":2,"start":3148.052,"end":3153.311,"text":"네?-너 나랑 밀당하는 거지, 지금?","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":3,"start":3153.311,"end":3158.912,"text":"아닌데-으이그, 이게 진짜, 으이그 요물 진짜-근데 저 수업 가야 되는데","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":4,"start":3158.912,"end":3162.155,"text":"5분만 더 있다가 가","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":5,"start":3162.155,"end":3168.395,"text":"으이그, 말은 또 잘 들어요","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":6,"start":3168.395,"end":3170.833,"text":"으이그, 요물","speed":1,"cueUid":"merged-mscz4uq6-39"}],"hasShadow":true,"segments":[{"index":0,"start":3132.013,"end":3144.932,"text":"화 많이 났어요?-너...혹시 나 싫어졌어요?","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":1,"start":3144.932,"end":3148.052,"text":"사실은 고수지?","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":2,"start":3148.052,"end":3153.311,"text":"네?-너 나랑 밀당하는 거지, 지금?","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":3,"start":3153.311,"end":3158.912,"text":"아닌데-으이그, 이게 진짜, 으이그 요물 진짜-근데 저 수업 가야 되는데","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":4,"start":3158.912,"end":3162.155,"text":"5분만 더 있다가 가","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":5,"start":3162.155,"end":3168.395,"text":"으이그, 말은 또 잘 들어요","speed":1,"cueUid":"merged-mscz4uq6-39"},{"index":6,"start":3168.395,"end":3170.833,"text":"으이그, 요물","speed":1,"cueUid":"merged-mscz4uq6-39  like me?\nThere are countless reasons why I shouldn't like that man.\nWhy are you being so nice?\nBecause I don't know when I'll be mean to you again.\nAnd the worst thing among those reasons...\nas much as I wish for...\nGet the hell out!\nHe doesn't like me.","koRange":{"start":3175.000943,"end":3203.717768},"viRange":{"start":3038.444941,"end":3074.521321},"start":3038.444941,"end":3203.717768,"koSentenceMarks":[3182.57,3185.87,3190.608,3192.439,3194.41,3196.99,3199.659,3200.96],"koShadowSegments":[{"index":0,"start":3180,"end":3182.57,"text":"[정예은 생각] (고두영) 넌 내가 왜 좋냐?","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":1,"start":3182.57,"end":3185.87,"text":"(고두영) 나 같은 놈이 어디가 좋아?","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":2,"start":3185.87,"end":3190.608,"text":"(정예은) 저 남자를 좋아하면 안 되는 이유는 수만 가지 \n[애잔한 톤의 여성 보컬 노래]","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":3,"start":3190.608,"end":3192.439,"text":"(정예은) 오빠, 왜 이렇게 잘해줘","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":4,"start":3192.439,"end":3194.41,"text":"(고두영) 언제 또 못되게 굴지도 모르니까","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":5,"start":3194.41,"end":3196.99,"text":"(정예은) 그 중에서 제일 나쁜 건","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":6,"start":3196.99,"end":3199.659,"text":"(정예은) 내가 원하는 만큼","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":7,"start":3199.659,"end":3200.96,"text":"(고두영) 내려 좀!","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":8,"start":3200.96,"end":3203.491,"text":"(정예은) 날 좋아해주지 않는다는 거","speed":1,"cueUid":"merged-mscz9i3b-41"}],"hasShadow":true,"segments":[{"index":0,"start":3180,"end":3182.57,"text":"[정예은 생각] (고두영) 넌 내가 왜 좋냐?","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":1,"start":3182.57,"end":3185.87,"text":"(고두영) 나 같은 놈이 어디가 좋아?","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":2,"start":3185.87,"end":3190.608,"text":"(정예은) 저 남자를 좋아하면 안 되는 이유는 수만 가지 \n[애잔한 톤의 여성 보컬 노래]","speed":1,"cueUid":"merged-mscz9i3b-41"},{"index":3,"start":3190.608,"end":3192.439,"text":"(정예은 an qua. Tạm biệt.\\n[아무렇지 않은 듯]\n오늘도 늦었네\n갑자기 연락하니까 그러지\n왜? 할 얘기 뭔데? (고두영) 해! 커피 마시고\n아, 너 요새 마음에 안 들어\n(고두영) 저, 아이스 아메리카노 - (종업원) 네\n오빠! 왜? 우리 헤어져. 우리 헤어지자 \n[쓸쓸한 분위기의 음악 시작]\n장난하냐? - 아니\n오빠, 그동안 고마웠어. 안녕\\n[As if nothing had happened]\nYou are late again.\nIt's because you called me out suddenly.\nWhat? What do you need to talk about?\nGo ahead.\nLet me drink my coffee first.\nYou've really been getting on my nerves lately.\nCan I get an iced Americano, please? -Yes, sir. Honey. Sao? What? Let's break up. \n[Lonely music starts]-Is this a joke? -No. Thanks for everything. Goodbye.","koRange":{"start":3273.880836,"end":3386.791},"viRange":{"start":3140.380848,"end":3210.202845},"start":3140.380848,"end":3386.791,"koSentenceMarks":[3286.823,3291.702,3294.2,3305.433,3321.858,3330.436,3339.845,3349.254,3358.663],"koShadowSegments":[{"index":0,"start":3284,"end":3286.823,"text":"[아무렇지 않은 듯] 오늘도 늦었네","speed":1,"cueUid":"merged-msczmt8b-46"},{"index":1,"start":3286.823,"end":3291.702,"text":"갑자기 연락하니까 그러지 왜?","speed":1,"cueUid":"merged-msczmt8b-46"},{"index":2,"start":3291.702,"end":3294.2,"text":"할 얘기 뭔데? (고두영) 해!","speed":1,"cueUid":"merged-msczmt8b-46"},{"index":3,"start":3294.2,"end":3305.433,"text":"커피 마시고 아, 너 요새 마음에 안 들어 (고두영) 저, 아이스 아메리카노 - (종업원) 네","speed":1,"cueUid":"merged-msczmt8b-46"},{"index":4,"start":3318.479,"end":3321.858,"text":"오빠!","speed":1,"cueUid":"merged-msczmt8b-46"},{"index":5,"start":3321.858,"end":3330.436,"text":"왜?","speed":1,"cueUid":"merged-msczmt8b-46"},{"index":6,"start":3330.436,"end":3339.845,"text":"우리 헤어져.","speed":1,"cueUid":"merged-msczmt8b-46"},{"index":7,"start":3339.845,"end":3349.254,"text":"우리 헤어지자 [쓸쓸한 분위기의 음악 시작] 장난하냐?","speed":1,"cueUid":"merged-msczmt8b-46"},{"index":8,"start":3349.254,"end":3358.663,"text":"아니 오빠, 그동안 고마웠어.","speed":1,"cueUid":"merged-msczmt8b-46"},{"index":9,"start":3358.663,"end":3368.073,"text":"안녕","speed":1,"cueUid":"merged-msczmt8b-46"}],"hasShadow":true,"segments":[{"index":0,"start":3284,"end":32 e,"segments":[]},{"id":178,"cueNo":179,"displayNo":179,"sourceUid":"merged-msd2uiza-69","uid":"merged-msd2uiza-69","originalCueNo":179,"vi":"CHỨC VỤ Ở NHÀ HÀNG?\nTôi là bếp phó.\nCẢM XÚC VỚI JIN MYUNG?\nThương cảm.\nThấy thương nên tôi muốn đối xử tốt.\nLÀ DO ĐỒNG CẢM?\nKhông. Chắc là yêu.\nCÔ ẤY KHÔNG ĐI LÀM THÊM VÀO NGÀY ĐI VỚI QUẢN LÝ?\nTôi đã không hỏi.\nThật ra ban đầu tôi có nghi ngờ.\nNhưng tôi biết cô ấy không phải là người như vậy.","ko":"네, 지금 저는 세컨쿡입니다\n불쌍해요\n불쌍해서 잘해주고 싶어요\n사랑인 거 같습니다\n아뇨, 저 물어보지는 않았구요\n근데 솔직히 처음에는 좀 의심했거든요\n근데 진명씨가 그럴 사람이 아니라는 거를 저는 알고 있습니다","en":"Position at the restaurant?\nI'm a sous-chef.\nFeeling towards Jin-Myung?\nI feel bad for her.\nI want to be nice to her because of that.\nIs it pity?\nI think it's love.\nDo you know why Jin-Myung was eating with her manager?\nNo. I didn't ask her about it.\nWell, honestly, I had my doubts at first.\nBut I know that Jin-Myung isn't the type to do stuff like that.","text":"CHỨC VỤ Ở NHÀ HÀNG?\nTôi là bếp phó.\nCẢM XÚC VỚI JIN MYUNG?\nThương cảm.\nThấy thương nên tôi muốn đối xử tốt.\nLÀ DO ĐỒNG CẢM?\nKhông. Chắc là yêu.\nCÔ ẤY KHÔNG ĐI LÀM THÊM VÀO NGÀY ĐI VỚI QUẢN LÝ?\nTôi đã không hỏi.\nThật ra ban đầu tôi có nghi ngờ.\nNhưng tôi biết cô ấy không phải là người như vậy.\\n네, 지금 저는 세컨쿡입니다\n불쌍해요\n불쌍해서 잘해주고 싶어요\n사랑인 거 같습니다\n아뇨, 저 물어보지는 않았구요\n근데 솔직히 처음에는 좀 의심했거든요\n근데 진명씨가 그럴 사람이 아니라는 거를 저는 알고 있습니다\\nPosition at the restaurant?\nI'm a sous-chef.\nFeeling towards Jin-Myung?\nI feel bad for her.\nI want to be nice to her because of that.\nIs it pity?\nI think it's love.\nDo you know why Jin-Myung was eating with her manager?\nNo. I didn't ask her about it.\nWell, honestly, I had my doubts at first.\nBut I know that Jin-Myung isn't the type to do stuff like that.","koRange":{"start":3794.132912,"end":3814.422402},"viRange":{"start":3642.604815,"end":3680.727341},"start":3642.604815,"end":3814.422402,"koSentenceMarks":[3797.082,3798.684,3800.911,3804.243,3808.162,3810.045],"koShadowSegments":[{"index": function fmt(t){t=Math.max(0,Number(t)||0);let h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=Math.floor(t%60),ms=Math.round((t-Math.floor(t))*1000);if(ms>=1000){s++;ms-=1000}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+','+String(ms).padStart(3,'0')}

function clampSpeed(v){v=Number(v);if(!isFinite(v)||v<=0)v=1;return Math.max(.45,Math.min(1.5,Math.round(v*100)/100))}

function audioCandidates(kind){const file=String(kind==='vi'?project.viAudioFile:project.koAudioFile||'').trim();const folder=String(project.audioFolder||'audio').replace(/^\.\//,'').replace(/^\/+|\/+$/g,'')||'audio';const slug=String(project.githubSlug||project.title||'shadow').replace(/[^A-Za-z0-9._-]+/g,'_');const fallback=kind==='vi'?[slug+'_VI_Dub.mp3',slug+'_vi_dub.mp3','VI_Dub.mp3','vi_dub.mp3']:[slug+'_KO_Live.mp3',slug+'_ko_live.mp3','KO_Live.mp3','ko_live.mp3'];const names=[file].concat(fallback).filter(Boolean);const out=[];names.forEach(function(n){out.push('../'+folder+'/'+n);out.push('./'+folder+'/'+n);out.push('../../'+folder+'/'+n);out.push(n)});return Array.from(new Set(out))}
function tryAutoAudio(kind){const a=audios[kind];const c=audioCandidates(kind);let i=0;function next(){if(i>=c.length){$(kind+'AudioStatus').textContent='Chưa tự nạp được audio. Hãy chọn file thủ công.';return}const src=c[i++];$(kind+'AudioStatus').textContent='Thử nạp: '+src;a.src=src;try{a.load()}catch(e){next()}}a.onerror=next;a.oncanplay=function(){$(kind+'AudioStatus').textContent='Đã nạp: '+(a.currentSrc||a.src)};if(c.length)next()}
function segmentCardHtml(s,i,mini){const active=i===activeSeg?' active':'';const hasText=String(s.text||'').trim().length>0;const text=hasText?escHtml(s.text):'<span class="small">[Khoảng âm thanh không lời]</span>';const label=hasText?'Câu ':'Đoạn ';if(mini){return '<div class="miniSeg'+active+'"><div class="miniHead"><span>'+label+(i+1)+'</span><span>'+shortTime(s.start)+' → '+shortTime(s.end)+' · '+(Number(s.end)-Number(s.start)).toFixed(2)+'s · '+segSpeed(s)+'x</span></div><div class="miniText">'+text+'</div><div class="miniSpeed"><span class="small">Tốc</span><select onchange="setSegSpeed('+i+',this.value)">'+speedOptions(s.speed)+'</select><button onclick="nudgeSegSpeed('+i+',-.1)">-</button><button onclick="nudgeSegSpeed('+i+',.1)">+</button></div><div class="miniBtns"><button class="violet" onclick="playSegment('+i+',\'once\')">Nghe</button><button class="warn" onclick="playSegment('+i+',\'repeat\')">Repeat</button><button class="good" onclick="playSegment('+i+',\'shadow\')">Shadow</button></div></div>'}return '<div class="seg'+active+'"><div class="segHead"><span>'+label+(i+1)+'</span><span>'+fmt(s.start)+' → '+fmt(s.end)+' · '+(Number(s.end)-Number(s.start)).toFixed(2)+'s · '+segSpeed(s)+'x</span></div><div class="segText">'+text+'</div><div class="segSpeed"><span class="small">Tốc độ</span><select onchange="setSegSpeed('+i+',this.value)">'+speedOptions(s.speed)+'</select><button onclick="nudgeSegSpeed('+i+',-.1)">-</button><button onclick="nudgeSegSpeed('+i+',.1)">+</button></div><div class="segBtns"><button class="violet" onclick="playSegment('+i+',\'once\')">Nghe</button><button class="warn" onclick="playSegment('+i+',\'repeat\')">Repeat</button><button class="good" onclick="playSegment('+i+',\'shadow\')">Shadow</button></div></div>'}
function inlineDetailHtml(it,i){if(i!==cur)return '';const segs=it.segments||[];const hasShadow=segs.length>0;let html='<div class="inlineDetail" onclick="event.stopPropagation()"><div class="inlineMain">';if(it.vi)html+='<div class="inlineBlock vi"><b>VI</b>\n'+escHtml(it.vi)+'</div>';if(it.ko)html+='<div class="inlineBlock ko"><b>KO</b>\n'+escHtml(it.ko)+'</div>';if(it.en)html+='<div class="inlineBlock en"><b>EN</b>\n'+escHtml(it.en)+'</div>';html+='</div>';if(hasShadow){html+='<div class="inlineSegs">'+segs.map(function(s,j){return segmentCardHtml(s,j,true)}).join('')+'</div>'}else{html+='<div class="empty">Cue này chưa có Shadow. Có thể nghe cả cue bằng VI Dub / KO Live.</div>'}return html+'</div>'}
function renderList(){const q=String($('q').value||'').toLowerCase();let shown=0;const html=items.map(function(it,i){if(q&&!itemText(it).includes(q))return '';shown++;const hasShadow=!!it.hasShadow;const vr=rangeOk(it.viRange), kr=rangeOk(it.koRange);const koPreview=escHtml(String(it.ko||'').split('\n').slice(0,3).join('\n'));const viPreview=escHtml(String(it.vi||'').split('\n').slice(0,2).join('\n'));return '<div id="cue-'+i+'" class="cue '+(i===cur?'active':'')+'" onclick="cur='+i+';activeSeg=0;render();"><div class="cueTop"><span class="cueNo">'+String(i+1).padStart(2,'0')+'.</span>'+(hasShadow?'<span class="badge shadow">SHADOW</span>':'')+(vr?'<span class="badge vi">VI</span>':'')+(kr?'<span class="badge ko">KO</span>':'')+'<span class="badge">'+(it.segments?it.segments.length:0)+' câu</span></div><div class="cueText ko">'+koPreview+'</div><div class="cuePreview">'+viPreview+'</div>'+inlineDetailHtml(it,i)+'</div>'}).join('');$('list').innerHTML=html||'<div class="empty">Không có cue phù hợp.</div>';$('count').textContent=shown+' / '+items.length+' cue · có shadow: '+(project.shadowCount||items.filter(function(x){return x.hasShadow}).length)}
function render(){const it=items[cur]||{};renderList();$('meta').textContent=[project.movieTitle,project.episodeTitle].filter(Boolean).join(' ')+' · Cue '+(cur+1)+'/'+items.length+' · Shadow '+(project.shadowCount||0);$('viText').textContent=it.vi||'';$('koText').textContent=it.ko||'';$('enText').textContent=it.en||'';const segs=it.segments||[];if(!segs.length){$('segs').innerHTML='<div class="empty">Cue này chưa có ngắt câu Shadow. Vẫn có thể nghe VI Dub / KO Live cả cue nếu có audio range.</div>';return}$('segs').innerHTML=segs.map(function(s,i){return segmentCardHtml(s,i,false)}).join('')}
function scrollToActive(){const el=$('cue-'+cur);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}
function pauseAll(){token++;clearTimeout(timer);timer=null;stopAt.vi=null;stopAt.ko=null;try{audios.vi.pause()}catch(e){}try{audios.ko.pause()}catch(e){}setStatus('Pause.')}
function playRange(kind,start,end,label,done,rate){const a=audios[kind];if(!a.src)return alert('Chưa có '+kind.toUpperCase()+' audio. Hãy chọn file hoặc kiểm tra folder audio.');try{a.playbackRate=rate||1}catch(e){}token++;const tk=token;clearTimeout(timer);stopAt[kind]=Number(end);try{audios[kind==='vi'?'ko':'vi'].pause()}catch(e){}a.currentTime=Number(start);setStatus(label+' · '+fmt(start)+' → '+fmt(end));a.play().catch(function(e){alert('Không phát được audio: '+(e&&e.message?e.message:e))});const check=function(){if(tk!==token)return;if(a.currentTime>=Number(end)-.025){a.pause();stopAt[kind]=null;if(done)done();return}timer=setTimeout(check,45)};check()}
function playCue(kind){const it=items[cur];if(!it)return;const rg=rangeFor(it,kind);if(!rangeOk(rg))return alert('Cue này chưa có '+kind.toUpperCase()+' range.');playRange(kind,Number(rg.start),Number(rg.end),(kind==='vi'?'VI Dub':'KO Live')+' cue #'+(cur+1))}
function playSegment(i,mode){const it=items[cur]||{}, seg=(it.segments||[])[i];if(!seg)return alert('Cue này chưa có câu shadow.');activeSeg=i;render();const total=mode==='once'?1:Math.max(1,Number($('repeat').value)||3);let n=0;const rate=segSpeed(seg), dur=Math.max(.05,Number(seg.end)-Number(seg.start)), gap=mode==='shadow'?Math.max(1,Math.min(5,dur/rate+.5)):.35;const run=function(){if(n>=total){setStatus('Xong câu '+(i+1));return}n++;playRange('ko',seg.start,seg.end,(mode==='shadow'?'Shadow':'Repeat')+' câu '+(i+1)+' · '+rate+'x · lượt '+n+'/'+total,function(){timer=setTimeout(run,gap*1000)},rate)};run()}
function playActiveSeg(mode){playSegment(activeSeg,mode||'repeat')}
function prevCue(){cur=Math.max(0,cur-1);activeSeg=0;render();scrollToActive()}function nextCue(){cur=Math.min(items.length-1,cur+1);activeSeg=0;render();scrollToActive()}
function toggleFloatPanel(e){if(e)e.stopPropagation();const el=$('floatCtl');if(!el)return;if(el.dataset.moved==='1'){el.dataset.moved='0';return}el.classList.toggle('open')}
function initFloatDrag(){const el=$('floatCtl'),h=$('floatMain');if(!el||!h)return;let sx=0,sy=0,ox=0,oy=0,drag=false,moved=false;h.addEventListener('pointerdown',function(e){if(window.innerWidth>760)return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;try{h.setPointerCapture(e.pointerId)}catch(_){}});h.addEventListener('pointermove',function(e){if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(!moved)return;const maxX=window.innerWidth-el.offsetWidth-8,maxY=window.innerHeight-el.offsetHeight-8;el.style.left=Math.max(8,Math.min(maxX,ox+dx))+'px';el.style.top=Math.max(8,Math.min(maxY,oy+dy))+'px';el.style.right='auto';el.style.bottom='auto'});function end(){if(!drag)return;drag=false;if(moved){el.dataset.moved='1';try{localStorage.setItem('shadowFloatPos',JSON.stringify({left:el.style.left,top:el.style.top}))}catch(_){}}}h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);try{const p=JSON.parse(localStorage.getItem('shadowFloatPos')||'null');if(p&&p.left&&p.top&&window.innerWidth<=760){el.style.left=p.left;el.style.top=p.top;el.style.right='auto';el.style.bottom='auto'}}catch(_){}}
function toggleSettings(){const s=$('settings');s.classList.toggle('hidden')}
audios.vi.ontimeupdate=function(){if(stopAt.vi!=null&&audios.vi.currentTime>=stopAt.vi){audios.vi.pause();stopAt.vi=null}}
audios.ko.ontimeupdate=function(){if(stopAt.ko!=null&&audios.ko.currentTime>=stopAt.ko){audios.ko.pause();stopAt.ko=null}}
$('q').oninput=renderList;$('viVol').oninput=function(){setVol('vi')};$('koVol').oninput=function(){setVol('ko')};$('viFile').onchange=function(e){const f=e.target.files[0];if(f){audios.vi.src=URL.createObjectURL(f);$('viAudioStatus').textContent='Đã nạp VI từ máy: '+f.name}};$('koFile').onchange=function(e){const f=e.target.files[0];if(f){audios.ko.src=URL.createObjectURL(f);$('koAudioStatus').textContent='Đã nạp KO từ máy: '+f.name}};
document.addEventListener('keydown',function(e){if(/input|textarea|select/i.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();if(audios.ko.paused)playCue('ko');else pauseAll()}if(e.key==='ArrowRight')nextCue();if(e.key==='ArrowLeft')prevCue();if(e.key==='v'||e.key==='V')playCue('vi');if(e.key==='k'||e.key==='K')playCue('ko')});
initFloatDrag();setVol('vi');setVol('ko');tryAutoAudio('vi');tryAutoAudio('ko');render();
</script>
</body>
</html>
