rely there)!","sourceUid":"nar-msgxh0bo-pio6qu","sourceNo":"N3","viRanges":[],"koRanges":[]},{"id":5,"readerNo":6,"displayNo":"N4","n":"N4","kind":"narration","type":"narration","vi":"Tiếng diêm được đánh. Ngọn nến thơm được thắp lên. Bụp! Nút chai được kéo ra.","ko":"성냥 켜는 소리. 향초에 불이 붙는다. 뽁! 코르크 마개가 뽑힌다.","en":"The sound of a match being struck. The scented candle is lit. Boop! The cork is pulled out.","text":"Tiếng diêm được đánh. Ngọn nến thơm được thắp lên. Bụp! Nút chai được kéo ra.\n성냥 켜는 소리. 향초에 불이 붙는다. 뽁! 코르크 마개가 뽑힌다.\nThe sound of a match being struck. The scented candle is lit. Boop! The cork is pulled out.","sourceUid":"nar-msgxh36u-3f8se8","sourceNo":"N4","viRanges":[],"koRanges":[]},{"id":6,"readerNo":7,"displayNo":"N5","n":"N5","kind":"narration","type":"narration","vi":"Một ly rượu vang được làm sạch kỹ chứa đầy rượu vang đỏ khoảng một phần ba.","ko":"잘 닦인 와인 잔에 3분의 1 정도 차오르는 레드 와인.","en":"A well-cleaned wine glass filled with red wine about one-third full.","text":"Một ly rượu vang được làm sạch kỹ chứa đầy rượu vang đỏ khoảng một phần ba.\n잘 닦인 와인 잔에 3분의 1 정도 차오르는 레드 와인.\nA well-cleaned wine glass filled with red wine about one-third full.","sourceUid":"nar-msgxh4ix-w5jpk9","sourceNo":"N5","viRanges":[],"koRanges":[]},{"id":7,"readerNo":8,"displayNo":"N6","n":"N6","kind":"narration","type":"narration","vi":"Bà chủ vừa uống rượu vừa nghe nhạc tango phát trên chiếc radio cổ.","ko":"앤티크한 라디오에서 흘러나오는 탱고 음악을 들으며 주인집 할머니가 와인을 마신다.","en":"The owner's grandmother drinks wine while listening to tango music playing on an antique radio.","text":"Bà chủ vừa uống rượu vừa nghe nhạc tango phát trên chiếc radio cổ.\n앤티크한 라디오에서 흘러나오는 탱고 음악을 들으며 주인집 할머니가 와인을 마신다.\nThe owner's grandmother drinks wine while listening to tango music playing on an antique radio.","sourceUid":"nar-msgxh5th-rjwkwb","sourceNo":"N6","viRanges":[],"koRanges":[]},{"id":8,"readerNo":9,"displayNo":"N7","n":"N7","kind":"narration","type":"narration","vi":"Màu son đỏ tươi xuất hiện trên ly rượu.","ko":"와인 잔에 새빨간 립스틱이 그대로 묻어난다.","en":"Bright red lipstick appears on the wine glass.","text":"Màu son đỏ tươi xuất hiện trên ly rượu.\n와인 잔에 새빨간 립스틱이 그대로 묻어난다.\nBright red lipstick appears on the wine glass.","sourceUid":"nar-msgxh6v7-x04a4d","sourceNo":"N7","viRanges":[],"koRanges":[]},{"id":9,"readerNo":10,"displayNo":"N8","n":"N8","kind":"narration","type":"narration","vi":"Đôi khi tôi quay đầu theo âm nhạc.","ko":"음악에 맞춰 가끔 고개를 휙휙 돌린다.","en":"Sometimes I turn my head to the music.","text":"Đôi khi tôi quay đầu theo âm nhạc.\n음악에 맞춰 가끔 고개를 휙휙 돌린다.\nSometimes I turn my head to the music.","sourceUid":"nar-msgxh7u3-cmvuop","sourceNo":"N8","viRanges":[],"koRanges":[]},{"id":10,"readerNo":11,"displayNo":"N9","n":"N9","kind":"narration","type":"narration","vi":"Đặt bụng lợn lên vỉ nướng.","ko":"그릴에 삼겹살을 올려놓는다.","en":"Place the pork belly on the grill.","text":"Đặt bụng lợn lên vỉ nướng.\n그릴에 삼겹살을 올려놓는다.\nPlace the pork belly on the grill.","sourceUid":"nar-msgxh8py-6wk6us","sourceNo":"N9","viRanges":[],"koRanges":[]},{"id":11,"readerNo":12,"displayNo":"N10","n":"N10","kind":"narration","type":"narration","vi":"Tôi quay đầu lại lần nữa nhưng nhanh chóng nấp vào bóng người đang quan sát và bà gật đầu.","ko":"다시 고개를 휙휙 돌리는데, 누군가 지켜보는 그림자, 할머니의 고갯짓에 휙 숨는다.","en":"I turn my head again, but I quickly hide in the shadow of someone watching, and the grandmother nods.","text":"Tôi quay đầu lại lần nữa nhưng nhanh chóng nấp vào bóng người đang quan sát và bà gật đầu.\n다시 고개를 휙휙 돌리는데, 누군가 지켜보는 그림자, 할머니의 고갯짓에 휙 숨는다.\nI turn my head again, but I quickly hide in the shadow of someone watching, and the grandmother nods.","sourceUid":"nar-msgxh9m4-j1z7q2","sourceNo":"N10","viRanges":[],"koRanges":[]},{"id":12,"readerNo":13,"displayNo":"N11","n":"N11","kind":"narration","type":"narration","vi":"Tôi đoán là tôi đã không nhìn thấy bà tôi.","ko":"할머니는 못 봤나 보다.","en":"I guess I didn't see my grandmother.","text":"Tôi đoán là tôi đã không nhìn thấy bà tôi.\n할머니는 못 봤나 보다.\nI guess I didn't see my grandmother.","sourceUid":"nar-msgxhb94-aaluxp","sourceNo":"N11","viRanges":[],"koRanges":[]},{"id":13,"readerNo":14,"displayNo":"N12","n":"N12","kind":"narration","type":"narration","vi":"Có vẻ như anh ấy đang tiếp tục việc mình đang làm... Đột nhiên ngừng hoạt động. Chai rượu đang bay.","ko":"하던 일을 계속하는 듯···. 갑자기 와인드업. 와인 병이 날라온다.","en":"It seems like he's continuing what he's doing... Suddenly wind up. Wine bottles are flying.","text":"Có vẻ như anh ấy đang tiếp tục việc mình đang làm... Đột nhiên ngừng hoạt động. Chai rượu đang bay.\n하던 일을 계속하는 듯···. 갑자기 와인드업. 와인 병이 날라온다.\nIt seems like he's continuing what he's doing... Suddenly wind up. Wine bottles are flying.","sourceUid":"nar-msgxhe8y-mvuuia","sourceNo":"N12","viRanges":[],"koRanges":[]},{"id":14,"readerNo":15,"displayNo":"N13","n":"N13","kind":"narration","type":"narration","vi":"Chai rượu vừa quay dường như biến mất trong bóng tối.","ko":"스핀을 먹은 와인 병이 빙글빙글 어둠 속으로 사라지는가 싶더니,","en":"The wine bottle that had been spun seemed to disappear into the darkness.","text":"Chai rượu vừa quay dường như biến mất trong bóng tối.\n스핀을 먹은 와인 병이 빙글빙글 어둠 속으로 사라지는가 싶더니,\nThe wine bottle that had been spun seemed to disappear into the darkness.","sourceUid":"nar-msgxhfsn-i5lbot","sourceNo":"N13","viRanges":[],"koRanges":[]},{"id":15,"readerNo":16,"displayNo":"N14","n":"N14","kind":"narration","type":"narration","vi":"Tôi nghe thấy âm thanh 'Ayat'. Đó là giọng của một người đàn ông.","ko":"‘아얏’ 소리가 들린다. 남자의 목소리다.","en":"I hear the sound ‘Ayat’. It's a man's voice.","text":"Tôi nghe thấy âm thanh 'Ayat'. Đó là giọng của một người đàn ông.\n‘아얏’ 소리가 들린다. 남자의 목소리다.\nI hear the sound ‘Ayat’. It's a man's voice.","sourceUid":"nar-msgxhh79-ka8upu","sourceNo":"N14","viRanges":[],"koRanges":[]},{"id":16,"readerNo":17,"displayNo":3,"n":3,"kind":"sub","type":"merged","vi":"GẦN ĐÂY CÓ MỘT NGƯỜI ĐÀN ÔNG LẠ MẶT LẢNG VẢNG QUANH NHÀ\nNHỚ ĐÓNG CỬA CẨN THẬN, HẠN CHẾ VỀ MUỘN, TỰ BẢO VỆ BẢN THÂN\nCHỦ NHÀ NHƯ TỪ MẪU","ko":"","en":"Lately ong giả vờ không biết, mắt cô bỗng ngấn nước.","ko":"그러나 윤진명이 모르는 척외면하자 눈이 말똥말똥해진다.","en":"However, when Yoon Jin-myeong pretends not to know, her eyes become watery.","text":"Tuy nhiên, khi Yoon Jin-myeong giả vờ không biết, mắt cô bỗng ngấn nước.\n그러나 윤진명이 모르는 척외면하자 눈이 말똥말똥해진다.\nHowever, when Yoon Jin-myeong pretends not to know, her eyes become watery.","sourceUid":"nar-msgypuma-0v0rrj","sourceNo":"N35","viRanges":[],"koRanges":[]},{"id":43,"readerNo":44,"displayNo":"N36","n":"N36","kind":"narration","type":"dialogue","vi":"(Jinmyeong Yoon): (Bỏ đi, phớt lờ đứa trẻ) Đứa trẻ đó sẽ thức dậy một mình.","ko":"(윤진명): (아이를 무시한 채 걸어간다) 저 아이는 혼자 일어날 것이다.","en":"(Jinmyeong Yoon): (Walks away, ignoring the child) That child will wake up alone.","text":"(Jinmyeong Yoon): (Bỏ đi, phớt lờ đứa trẻ) Đứa trẻ đó sẽ thức dậy một mình.\n(윤진명): (아이를 무시한 채 걸어간다) 저 아이는 혼자 일어날 것이다.\n(Jinmyeong Yoon): (Walks away, ignoring the child) That child will wake up alone.","sourceUid":"nar-msgypypl-i6opaj","sourceNo":"N36","viRanges":[],"koRanges":[]},{"id":44,"readerNo":45,"displayNo":"N37","n":"N37","kind":"narration","type":"narration","vi":"Đứa trẻ thức dậy.","ko":"아이가 일어난다.","en":"The child wakes up.","text":"Đứa trẻ thức dậy.\n아이가 일어난다.\nThe child wakes up.","sourceUid":"nar-msgyq16e-xxmnub","sourceNo":"N37","viRanges":[],"koRanges":[]},{"id":45,"readerNo":46,"displayNo":"N38","n":"N38","kind":"narration","type":"narration","vi":"phủi lớp bụi bẩn không dính trên mặt và nhìn vào lòng bàn tay mình.","ko":"묻지도 않은 흙을 탁탁 털고 손바닥을 본다.","en":"shake off the dirt that wasn't on my face and look at my palm.","text":"phủi lớp bụi bẩn không dính trên mặt và nhìn vào lòng bàn tay mình.\n묻지도 않은 흙을 탁탁 털고 손바닥을 본다.\nshake off the dirt that wasn't on my face and look at my palm.","sourceUid":"nar-msgyqtqt-xyo1xa","sourceNo":"N38","viRanges":[],"koRanges":[]},{"id":46,"readerNo":47,"displayNo":"N39","n":"N39","kind":"narration","type":"narration","vi":"cô bé hơi tức giận. Tôi liếc nhìn Jinmyeong Yoon lần nữa "N129","kind":"narration","type":"narration","vi":"Song Ji-won, người đang bước ra khỏi phòng tắm, và Jeong Ye-eun, người đang ngồi ở bàn, cũng quay lại để xem chuyện gì đang xảy ra.","ko":"화장실에서 나오던 송지원, 식탁에 있던 정예은도 뭔 일인가 돌아본다.","en":"Song Ji-won, who was coming out of the bathroom, and Jeong Ye-eun, who was at the table, also turned to see what was going on.","text":"Song Ji-won, người đang bước ra khỏi phòng tắm, và Jeong Ye-eun, người đang ngồi ở bàn, cũng quay lại để xem chuyện gì đang xảy ra.\n화장실에서 나오던 송지원, 식탁에 있던 정예은도 뭔 일인가 돌아본다.\nSong Ji-won, who was coming out of the bathroom, and Jeong Ye-eun, who was at the table, also turned to see what was going on.","sourceUid":"nar-msgzzc7y-7ccsg7","sourceNo":"N129","viRanges":[],"koRanges":[]},{"id":148,"readerNo":149,"displayNo":"N130","n":"N130","kind":"narration","type":"dialogue","vi":"Người đưa thư: Song Ji-won?","ko":"택배: 송지원 씨?","en":"Courier: Song Ji-won?","text":"Người đưa thư: Song Ji-won?\n택배: 송지원 씨?\nCourier: Song Ji-won?","sourceUid":"nar-msgzzlj6-l6vhxg","sourceNo":"N130","viRanges":[],"koRanges":[]},{"id":149,"readerNo":150,"displayNo":"N131","n":"N131","kind":"narration","type":"dialogue","vi":"Song Ji-won: Đúng vậy.","ko":"송지원: 전데요.","en":"Song Ji-won: I am.","text":"Song Ji-won: Đúng vậy.\n송지원: 전데요.\nSong Ji-won: I am.","sourceUid":"nar-msgzzmnc-q4j43o","sourceNo":"N131","viRanges":[],"koRanges":[]},{"id":150,"readerNo":151,"displayNo":"N132","n":"N132","kind":"narration","type":"narration","vi":"•Nhảy 〉〉","ko":"•점프 〉〉","en":"•Jump 〉〉","text":"•Nhảy 〉〉\n•점프 〉〉\n•Jump 〉〉","sourceUid":"nar-msgzznld-01abqd","sourceNo":"N132","viRanges":[],"koRanges":[]},{"id":151,"readerNo":152,"displayNo":"N133","n":"N133","kind":"narration","type":"narration","vi":"Hộp chứa các món ăn kèm, tương đậu nành, tương ớt đỏ, kim chi, bí đỏ, cà tím và đào.","ko":"상자에 밑반찬, 된장, 고추장, 김치, 호박, 가지, 복숭아가 들어 있다.","en":"The box contains side dishes, soybean paste, red pepper paste, kimchi, pumpkin, eggplant, and peach.","text":"Hộp chứa các món ăn kèm, tương đậu nành, tương ớt đỏ, kim chi, bí đỏ, cà tím và đào.\n상자에 밑반찬, 된장, 고추장, 김치, 호박, 가지, 복숭아가 들어 있다.\nThe box contains side dishes, soybean paste, red pepper paste, kimchi, pumpkin, eggplant, and peach.","sourceUid":"nar-msgzzoos-xl2uqr","sourceNo":"N133","viRanges":[],"koRanges":[]},{"id":152,"readerNo":153,"displayNo":"N134","n":"N134","kind":"narration","type":"dialogue","vi":"Song Ji-won: (Rửa đào) Anh chàng này đã quay lại lúc đó (làm chim bồ câu bằng ngón tay)?","ko":"송지원: (복숭아를 씻는다) 그때 왔던 (손가락으로 비둘기 만들어 보이며) 이 아저씨?","en":"Song Ji-won: (Washing peaches) This guy who came back then (making a pigeon with his fingers)?","text":"Song Ji-won: (Rửa đào) Anh chàng này đã quay lại lúc đó (làm chim bồ câu bằng ngón tay)?\n송지원: (복숭아를 씻는다) 그때 왔던 (손가락으로 비둘기 만들어 보이며) 이 아저씨?\nSong Ji-won: (Washing peaches) This guy who came back then (making a pigeon with his fingers)?","sourceUid":"nar-msgzzq83-s0m9q0","sourceNo":"N134","viRanges":[],"koRanges":[]},{"id":153,"readerNo":154,"displayNo":"N135","n":"N135","kind":"narration","type":"dialogue","vi":"Kang Ina: Ờ.","ko":"강이나: 어.","en":"Kang Ina: Uh.","text":"Kang Ina: Ờ.\n강이나: 어.\nKang Ina: Uh.","sourceUid":"nar-msgzztd6-yxxt4l","sourceNo":"N135","viRanges":[],"koRanges":[]},{"id":154,"readerNo":155,"displayNo":20,"n":20,"kind":"sub","type":"merged","vi":"Vâng, đến đây! Này, đừng mở!\nHàng giao đến mà.\n- Xin chào. - Xin chào quý khách. - Xin cảm ơn! - Vâng, tạm biệt.\nAnh đi cẩn thận! Gửi nhiều quá nhỉ. Ôi, bố ơi!","ko":"(송지원) 네, 나가요\n[후다닥 뛰어나오며] 야, 열지 마!\n택밴데?\n[문 여는 소리] (송지원) 어, 예, 어서 오세요, 네\n- 감사합니다 - (택배) 네, 안녕히 계세요\n(송지원) 안녕히 가십시오, 어휴, 많이도 보냈네, 어휴, 으, 아바!","en":"Yes, coming! Hey, don't get that! It's a delivery.\n-Hello. -A package for you, ma'am. -Thank you! -Yes, goodbye.\nGoodbye! He sent a lot. Oh, Dad!","text":"Vâng, đến đây! Này, đừng mở!\nHàng giao đến mà.\n- Xin chào. - Xin chào quý khách. - Xin cảm ơn! - Vâng, tạm biệt.\nAnh đi cẩn thận! Gửi nhiều quá nhỉ. Ôi, bố ơi!\n(송지원) 네, 나가요\n[후다닥 뛰어나오며] 야, 열지 마!\n택밴데?\n[문 여는 소리] (송지원) 어, 예, 어서 오세요, 네\n- 감사합니다 - (택배) 네, 안녕히 계세요\n(송지원) 안녕히 가십시오, 어휴, 많이도 보냈네, 어휴, 으, 아바!\nYes, coming! Hey, don't get that! It's a delivery.\n-Hello. -A package for you, ma'am. -Thank you! -Yes, goodbye.\nGoodbye! He sent a lot. Oh, Dad!","sourceUid":"merged-msafhqsk-2109","sourceNo":40,"viRanges":[{"start":375,"end":401.888368}],"koRanges":[{"start":415.381587,"end":444.766371}]},{"id":155,"readerNo":156,"displayNo":21,"n":21,"kind":"sub","type":"ko","vi":"[Kết thúc nhạc nền trầm với bầu không khí căng thẳng]","ko":"[긴장되는 분위기의 낮은 톤 배경음악 끝]","en":"[End of low tone background music with a tense atmosphere]","text":"[Kết thúc nhạc nền trầm với bầu không khí căng thẳng]\n[긴장되는 분위기의 낮은 톤 배경음악 끝]\n[End of low tone background music with a tense atmosphere]","sourceUid":"ko-ms9zfai3-700","sourceNo":73,"viRanges":[],"koRanges":[]},{"id":156,"readerNo":157,"displayNo":22,"n":22,"kind":"sub","type":"merged","vi":"Quý cô Jung, ra xơi ít đào này!\n[Tiếng kéo ghế]\nLà cái chú gặp lần trước đấy hả? Ừ.","ko":"정 여사, 복숭아 좀 잡숴 봐\n[의자 끄는 소리]\n그때 봤던 이 아저씨?\n(강이나) 어","en":"Madame Jung, have some peaches!\n[Sound of chair being pulled]\nIs that the guy from last time who did this stuff? Yeah.","text":"Quý cô Jung, ra xơi ít đào này!\n[Tiếng kéo ghế]\nLà cái chú gặp lần trước đấy hả? Ừ.\n정 여사, 복숭아 좀 잡숴 봐\n[의자 끄는 소리]\n그때 봤던 이 아저씨?\n(강이나) 어\nMadame Jung, have some peaches!\n[Sound of chair being pulled]\nIs that the guy from last time who did this stuff? Yeah.","sourceUid":"merged-msafxkws-2110","sourceNo":43,"viRanges":[{"start":401.888368,"end":419.805098}],"koRanges":[{"start":444.766371,"end":460.357}]},{"id":157,"readerNo":158,"displayNo":23,"n":23,"kind":"sub","type":"merged","vi":"(Song Ji-won) [ồn ào] [âm thanh đặt nĩa]\n[Tiếng đóng cửa và bước đi]","ko":"(송지원) [콧노래] [포크 놓는 소리]\n[문 닫고 걸어오는 소리]","en":"(Song Ji-won) [humming] [sound of placing fork]\n[Sound of closing door and walking]","text":"(Song Ji-won) [ồn ào] [âm thanh đặt nĩa]\n[Tiếng đóng cửa và bước đi]\n(송지원) [콧노래] [포크 놓는 소리]\n[문 닫고 걸어오는 소리]\n(Song Ji-won) [humming] [sound of placing fork]\n[Sound of closing door and walking]","sourceUid":"merged-msafxr4i-2111","sourceNo":81,"viRanges":[],"koRanges":[]},{"id":158,"readerNo":159,"displayNo":"N136","n":"N136","kind":"narration","type":"dialogue","vi":"Eunjae Yoo: (mang dao nĩa)...?","ko":"유은재: (칼과 포크를 가져온다) ···?","en":"Eunjae Yoo: (brings a knife and fork) ...?","text":"Eunjae Yoo: (mang dao nĩa)...?\n유은재: (칼과 포크를 가져온다) ···?\nEunjae Yoo: (brings a knife and fork) ...?","sourceUid":"nar-msh03xyo-wfdcy9","sourceNo":"N136","viRanges":[],"koRanges":[]},{"id":159,"readerNo":160,"displayNo":24,"n":24,"kind":"sub","type":"merged","vi":"Chú ấy là cái người đáng nghi mà bà chủ đã gặp hả?\nChắc thế.\nRốt cuộc cũng thành thế này.","ko":"그럼 할머니가 봤다는 수상한 남자도 그 아저씬가?\n아마도?\n(정예은) 결국 그렇게 됐네","en":"Maybe he's the \"strange man\" that the landlady mentioned?\nProbably.\nSo things turned out that way.","text":"Chú ấy là cái người đáng nghi mà bà chủ đã gặp hả?\nChắc thế.\nRốt cuộc cũng thành thế này.\n그럼 할머니가 봤다는 수상한 남자도 그 아저씬가?\n아마도?\n(정예은) 결국 그렇게 됐네\nMaybe he's the \"strange man\" that the landlady mentioned?\nProbably.\nSo things turned out that way.","sourceUid":"merged-msag03l0-2112","sourceNo":84,"viRanges":[{"start":419.85399,"end":425.072683}],"koRanges":[{"start":462.024217,"end":469.022131}]},{"id":160,"readerNo":161,"displayNo":25,"n":25,"kind":"sub","type":"merged","vi":"Chị bảo không phải mà.\nKhông phải như thế.\nVậy sao lại bám theo chị như thế?\nTóm lại là không biết thế nào hết, nên đừng tùy tiện mở cửa.","ko":"그런 사이 아니라더니\n그런 사이 아니야\n근데 왜 쫓아 다녀?\n아무튼 혹시 모르니까 함부로 문 열어주고 그러지 말라구","en":"You said it wasn't like that.\nWe are not like that.\nThen, why does he keep following you around?\nYou never know, so don't just open the door for anyone.","text":"Chị bảo không phải mà.\nKhông phải như thế.\nVậy sao lại bám theo chị như thế?\nTóm lại là không biết thế nào hết, nên đừng tùy tiện mở cửa.\n그런 사이 아니라더니\n그런 사이 아니야\n근데 왜 쫓아 다녀?\n아무튼 혹시 모르니까 함부로 문 열어주고 그러지 말라구\nYou said it wasn't like that.\nWe are not like that.\nThen, why does he keep following you around?\nYou never know, so don't just open the door for anyone.","sourceUid":"merged-msag0wge-2113","sourceNo":50,"viRanges":[{"start":425.072683,"end":438.842116}],"koRanges":[{"start":469.022131,"end":481.880181}]},{"id":161,"readerNo":162,"displayNo":26,"n":26,"kind":"sub","type":"merged","vi":"Đúng là chị Kang giỏi thu hút đàn ông! Bí quyết của chị là gì vậy?\nDễ dãi là được chứ sao.\nĐàn ông thích con gái dễ dãi mà.\nChính xác!","ko":"아휴, 아무튼 강언니 남자 복은 아주 타고났어, 도대체 비결이 뭐야?\n쉬워 보이면 돼\n- (유은재) [기침] - (정예은) 남자들은 쉬운 여자 좋아하잖아\n정답!\n흐흐","en":"You sure have a great fortune for men! What's your secret?\nJust be an easy woman.\nMen love that.\nCorrect answer!","text":"Đúng là chị Kang giỏi thu hút đàn ông! Bí quyết của chị là gì vậy?\nDễ dãi là được chứ sao.\nĐàn ông thích con gái dễ dãi mà.\nChính xác!\n아휴, 아무튼 강언니 남자 복은 아주 타고났어, 도대체 비결이 뭐야?\n쉬워 보이면 돼\n- (유은재) [기침] - (정예은) 남자들은 쉬운 여자 좋아하잖아\n정답!\n흐흐\nYou sure have a great fortune for men! What's your secret?\nJust be an easy woman.\nMen love that.\nCorrect answer!","sourceUid":"merged-msag2muo-2114","sourceNo":95,"viRanges":[{"start":438.842116,"end":457.958131}],"koRanges":[{"start":481.880181,"end":503.320181}]},{"id":162,"readerNo":163,"displayNo":27,"n":27,"kind":"sub","type":"merged","vi":"Cười vừa phải.\nĐong đưa mắt vừa phải.\nCúc áo cũng mở vừa phải.\nĐúng rồi, chính nó. Thời gian qua em đã quá kín đáo rồi.","ko":"적당히 웃어주고\n눈도 적당히 풀어주고\n단추도 적당히 풀고\n그래, 그거였어 내가 그동안 너무 철옹성이었어","en":"Smile, but not too much.\nGive a little glance, but not too much.\nAnd loosen a few buttons, but not too many.\nYes, that's right. I was doing it all wrong.","text":"Cười vừa phải.\nĐong đưa mắt vừa phải.\nCúc áo cũng mở vừa phải.\nĐúng rồi, chính nó. Thời gian qua em đã quá kín đáo rồi.\n적당히 웃어주고\n눈도 적당히 풀어주고\n단추도 적당히 풀고\n그래, 그거였어 내가 그동안 너무 철옹성이었어\nSmile, but not too much.\nGive a little glance, but not too much.\nAnd loosen a few buttons, but not too many.\nYes, that's right. I was doing it all wrong.","sourceUid":"merged-msah1qlv-2115","sourceNo":58,"viRanges":[{"start":457.958131,"end":472.989018}],"koRanges":[{"start":503.320181,"end":516.405}]},{"id":163,"readerNo":164,"displayNo":28,"n":28,"kind":"sub","type":"merged","vi":"Thấy sao? Đẹp không?\nChị thấy thích thú khi nghe đàn ông tỏ tình vậy sao?\nNgon quá. Nếu ăn hết rồi thì đứng dậy thôi nào.\nSao bảo hôm nay tâm trạng không tốt? Đứng dậy đi.\n- Đứng dậy đi nào! - Này!\nEm sao vậy? Gì?","ko":"어때, 헤퍼 보여 [웃음]\n좋아 남자가 좋다고 하면 아무나 다, 좋냐고?\n(송지원) 흐음 ['쩝쩝' 먹는 소리][맛있다는 듯] 흐음\n맛있다, 음, 다 먹었으면 그만 일어납시다\n정여사, 컨디션 안 좋다며? 그만 일어나자\n들어가 자자, 푹 자자 (강이나) 야!\n너 왜 그래? 뭐가?","en":"How do I look pretty?\nWould you like any man who says he likes you?\nThis is so good. If you're done, let's get up.\nYou said you're not feeling good today, right? Get up.\n-Let's go and sleep! -Hey!\nWhat is wrong with you? What?","text":"Thấy sao? Đẹp không?\nChị thấy thích thú khi nghe đàn ông tỏ tình vậy sao?\nNgon quá. Nếu ăn hết rồi thì đứng dậy thôi nào.\nSao bảo hôm nay tâm trạng không tốt? Đứng dậy đi.\n- Đứng dậy đi nào! - Này!\nEm sao vậy? Gì?\n어때, 헤퍼 보여 [웃음]\n좋아 남자가 좋다고 하면 아무나 다, 좋냐고?\n(송지원) 흐음 ['쩝쩝' 먹는 소리][맛있다는 듯] 흐음\n맛있다, 음, 다 먹었으면 그만 일어납시다\n정여사, 컨디션 안 좋다며? 그만 일어나자\n들어가 자자, 푹 자자 (강이나) 야!\n너 왜 그래? 뭐가?\nHow do I look pretty?\nWould you like any man who says he likes you?\nThis is so good. If you're done, let's get up.\nYou said you're not feeling good today, right? Get up.\n-Let's go and sleep! -Hey!\nWhat is wrong with you? What?","sourceUid":"merged-msah3xk3-2116","sourceNo":65,"viRanges":[{"start":472.989018,"end":501.12954}],"koRanges":[{"start":516.405352,"end":543.845533}]},{"id":164,"readerNo":165,"displayNo":29,"n":29,"kind":"sub","type":"merged","vi":"Muốn gì thì nói thẳng ra, đừng có sưng sỉa.\nNói gì cơ chứ?\nĐâu có gì để nói.\nHay chị có gì muốn nói hả?\nCon thảm hại…","ko":"할 말 있으면 똑바로 해 빙빙 돌리지 말구\n할 말 뭐?\n나 할 말 없는데\n아, 너 g the remaining two peaches into his mouth at once) I ate them all!","text":"Song Ji-won: (Bỏ hai quả đào còn lại vào miệng cùng một lúc) Tôi đã ăn hết rồi!\n송지원: (두 개 남은 복숭아 한꺼번에 입에 집어넣고는) 다 먹었다아!\nSong Ji-won: (Putting the remaining two peaches into his mouth at once) I ate them all!","sourceUid":"nar-msh0be4e-gzq9ai","sourceNo":"N139","viRanges":[],"koRanges":[]},{"id":168,"readerNo":169,"displayNo":"N140","n":"N140","kind":"narration","type":"narration","vi":"Chúng ta hãy đứng dậy khi chúng ta ăn xong.","ko":"먹을 거 다 먹었으면 그만 일어납시다.","en":"Let's get up when we've finished eating.","text":"Chúng ta hãy đứng dậy khi chúng ta ăn xong.\n먹을 거 다 먹었으면 그만 일어납시다.\nLet's get up when we've finished eating.","sourceUid":"nar-msh0bfee-ak34t6","sourceNo":"N140","viRanges":[],"koRanges":[]},{"id":169,"readerNo":170,"displayNo":"N141","n":"N141","kind":"narration","type":"narration","vi":"(Kéo Ye-eun Jeong vào) Bà Jeong, tôi nghe nói bà không khỏe phải không? Chúng ta hãy đi vào nhanh chóng. Hãy ngủ ngon nhé.","ko":"(정예은을 잡아끌며) 정 여사, 컨디션 안 좋다며? 얼른 들어가 자. 푹 자자.","en":"(Pulling Ye-eun Jeong in) Mrs. Jeong, I heard you’re not feeling well? Let's go in quickly. Let's sleep well.","text":"(Kéo Ye-eun Jeong vào) Bà Jeong, tôi nghe nói bà không khỏe phải không? Chúng ta hãy đi vào nhanh chóng. Hãy ngủ ngon nhé.\n(정예은을 잡아끌며) 정 여사, 컨디션 안 좋다며? 얼른 들어가 자. 푹 자자.\n(Pulling Ye-eun Jeong in) Mrs. Jeong, I heard you’re not feeling well? Let's go in quickly. Let's sleep well.","sourceUid":"nar-msh0bmhl-odrdzh","sourceNo":"N141","viRanges":[],"koRanges":[]},{"id":170,"readerNo":171,"displayNo":30,"n":30,"kind":"sub","type":"merged","vi":"[tiếng bước chân][Tiếng đập cửa]\n[Tiếng xe chạy qua][Âm thanh máy xây dựng bắt đầu]\n[Tiếng thở nặng nhọc][tiếng thở ra]\n[Âm nhạc trong bầu không khí bí ẩn bắt đầu] [Âm thanh của máy xây dựng kết thúc]\n[chó sủa][Thở dài] [Âm nhạc bí ẩn kết thúc] [Tiếng click]\n[tiếng lạch cạch][tiếng cửa]","ko":"[발걸음 소리][문 세게 닫는 소리]\n[차 지나가는 소리][공사 기계 소리 시작]\n[힘들어하는 숨소리][내쉬는 숨소리 ion","vi":"Jeong Ye-eun gọi cho Go Doo-young.","ko":"정예은이 고두영에게 전화를 건다.","en":"Jeong Ye-eun calls Go Doo-young.","text":"Jeong Ye-eun gọi cho Go Doo-young.\n정예은이 고두영에게 전화를 건다.\nJeong Ye-eun calls Go Doo-young.","sourceUid":"nar-msh0f5ja-31kgha","sourceNo":"N172","viRanges":[],"koRanges":[]},{"id":206,"readerNo":207,"displayNo":"N173","n":"N173","kind":"narration","type":"narration","vi":"Tôi cắn móng tay trong khi nghe nhạc chuông.","ko":"통화 연결음을 들으며 손톱을 물어뜯는다.","en":"I bite my nails while listening to the ring tone.","text":"Tôi cắn móng tay trong khi nghe nhạc chuông.\n통화 연결음을 들으며 손톱을 물어뜯는다.\nI bite my nails while listening to the ring tone.","sourceUid":"nar-msh0f6j1-6zcuki","sourceNo":"N173","viRanges":[],"koRanges":[]},{"id":207,"readerNo":208,"displayNo":"N174","n":"N174","kind":"narration","type":"narration","vi":"Một lúc sau, bạn nghe thấy âm thanh máy móc nói rằng 'bạn không thể trả lời điện thoại.' Jeong Ye-eun chạy ra ngoài.","ko":"잠시 후 들려오는 ‘전화를 받을수 없다’는 기계음. 정예은이 뛰쳐나간다.","en":"After a while, you hear a mechanical sound saying ‘you can’t answer the phone.’ Jeong Ye-eun runs out.","text":"Một lúc sau, bạn nghe thấy âm thanh máy móc nói rằng 'bạn không thể trả lời điện thoại.' Jeong Ye-eun chạy ra ngoài.\n잠시 후 들려오는 ‘전화를 받을수 없다’는 기계음. 정예은이 뛰쳐나간다.\nAfter a while, you hear a mechanical sound saying ‘you can’t answer the phone.’ Jeong Ye-eun runs out.","sourceUid":"nar-msh0f7rd-koo5pe","sourceNo":"N174","viRanges":[],"koRanges":[]},{"id":208,"readerNo":209,"displayNo":"N175","n":"N175","kind":"narration","type":"narration","vi":". Xe của Seo Dong-ju (đêm)","ko":". 서동주 차 안(밤)","en":". Seo Dong-ju’s car (night)","text":". Xe của Seo Dong-ju (đêm)\n. 서동주 차 안(밤)\n. Seo Dong-ju’s car (night)","sourceUid":"nar-msh0f9ce-70124v","sourceNo":"N175","viRanges":[],"koRanges":[]},{"id":209,"readerNo":210,"displayNo":"N176","n":"N176","kind":"narration","type":"narration","vi":"Seo Dong-ju đang nói chuyện với Kang In-na về Oh Jong-gyu.","ko":"서동주가 강이나에게 오종규에 관한 이야기를 하고 있다.","en":"Seo Dong-ju is talking to Kang In-na about Oh Jong-gyu.","text":"Seo Dong-ju đang nói chuyện với Kang In-na về Oh Jong-gyu.\n서동주가 강이나에게 오종규에 관한 이야기를 하고 있다.\nSeo Dong-ju is talking to Kang In-na about Oh Jong-gyu.","sourceUid":"nar-msh0fdl5-0eicyg","sourceNo":"N176","viRanges":[],"koRanges":[]},{"id":210,"readerNo":211,"displayNo":35,"n":35,"kind":"sub","type":"merged","vi":"Chú ấy vốn dĩ là thợ mộc.\nChuyên xây chùa hay nhà truyền thống Hanok.\nNhưng chú ấy chỉ chơi bời sau khi ra tù.\nRa tù?\nChú ấy bị tuyên án mười năm tù, nhưng được ân xá còn bảy.","ko":"그 아저씨 원래는 목수였대\n절이나 한옥 같은 그런 거 짓는...\n감옥 갔다 오고 나서 노가다로 돌기 시작했다는데\n감옥?\n폭행치사로 10년 7년 만에 가석방","en":"Apparently, he used to be a carpenter.\nHe specialized in temples and traditional homes.\nBut he doesn't do that any more after he got out of jail.\nJail?\nHe got ten years for foul play and was released on parole after seven.","text":"Chú ấy vốn dĩ là thợ mộc.\nChuyên xây chùa hay nhà truyền thống Hanok.\nNhưng chú ấy chỉ chơi bời sau khi ra tù.\nRa tù?\nChú ấy bị tuyên án mười năm tù, nhưng được ân xá còn bảy.\n그 아저씨 원래는 목수였대\n절이나 한옥 같은 그런 거 짓는...\n감옥 갔다 오고 나서 노가다로 돌기 시작했다는데\n감옥?\n폭행치사로 10년 7년 만에 가석방\nApparently, he used to be a carpenter.\nHe specialized in temples and traditional homes.\nBut he doesn't do that any more after he got out of jail.\nJail?\nHe got ten years for foul play and was released on parole after seven.","sourceUid":"merged-msahnlq5-2123","sourceNo":77,"viRanges":[{"start":658,"end":672.134967}],"koRanges":[{"start":700.761489,"end":713.450048}]},{"id":211,"readerNo":212,"displayNo":36,"n":36,"kind":"sub","type":"merged","vi":"Vì tội gì?\nĐánh người đến chết.\nBáo cảnh sát đi, còn chờ gì nữa.\nĐể một thời gian nữa.","ko":"폭행치사가 뭐야?\n사람을 때려죽였다는 얘기야\n신고해, 경찰 뒀다 뭐해?\n좀 있다가","en":"What does \"foul play\" mean?\nIt means that he beat someone to death.\nYou should call the cops.\nI'll do it later.","text":"Vì tội gì?\nĐánh người đến chết.\nBáo cảnh sát đi, còn chờ gì nữa.\nĐể một thời gian nữa ration","type":"narration","vi":"Khi ánh mắt họ gặp nhau, Yoo Eun-jae cảm thấy tiếc nuối vô cớ và quay đi.","ko":"눈이 마주치면 유은재가 괜히 미안해서 외면하게 된다.","en":"When their eyes meet, Yoo Eun-jae feels sorry for no reason and turns away.","text":"Khi ánh mắt họ gặp nhau, Yoo Eun-jae cảm thấy tiếc nuối vô cớ và quay đi.\n눈이 마주치면 유은재가 괜히 미안해서 외면하게 된다.\nWhen their eyes meet, Yoo Eun-jae feels sorry for no reason and turns away.","sourceUid":"nar-msh0nfn2-pxqop0","sourceNo":"N236","viRanges":[],"koRanges":[]},{"id":291,"readerNo":292,"displayNo":"N237","n":"N237","kind":"narration","type":"narration","vi":"Jinmyeong Yoon chào bạn bằng ánh mắt và đi vào trong.","ko":"윤진명이 눈으로 인사하고 안으로 들어간다.","en":"Jinmyeong Yoon greets you with his eyes and goes inside.","text":"Jinmyeong Yoon chào bạn bằng ánh mắt và đi vào trong.\n윤진명이 눈으로 인사하고 안으로 들어간다.\nJinmyeong Yoon greets you with his eyes and goes inside.","sourceUid":"nar-msh0ngwn-0nokfw","sourceNo":"N237","viRanges":[],"koRanges":[]},{"id":292,"readerNo":293,"displayNo":"N238","n":"N238","kind":"narration","type":"narration","vi":"Eunjae Yoo nhìn lại Jinmyeong Yoon.","ko":"유은재가 윤진명을 돌아본다.","en":"Eunjae Yoo looks back at Jinmyeong Yoon.","text":"Eunjae Yoo nhìn lại Jinmyeong Yoon.\n유은재가 윤진명을 돌아본다.\nEunjae Yoo looks back at Jinmyeong Yoon.","sourceUid":"nar-msh0ni53-4zpik9","sourceNo":"N238","viRanges":[],"koRanges":[]},{"id":293,"readerNo":294,"displayNo":"N239","n":"N239","kind":"narration","type":"narration","vi":"Cánh cửa kính có gắn 'giấy thông báo' rung chuyển.","ko":"‘알림 종이’가 붙은 유리문이 흔들린다.","en":"The glass door with the ‘notification paper’ attached shakes.","text":"Cánh cửa kính có gắn 'giấy thông báo' rung chuyển.\n‘알림 종이’가 붙은 유리문이 흔들린다.\nThe glass door with the ‘notification paper’ attached shakes.","sourceUid":"nar-msh0njd9-hrbgke","sourceNo":"N239","viRanges":[],"koRanges":[]},{"id":294,"readerNo":295,"displayNo":"N240","n":"N240","kind":"narration","type":"narration","vi":"Eunjae Yoo di chuyển về phía điểm thu gom rác.","ko":"유 중) 점심 값\n(오대표) 들어가 - (황대중) 엉","en":"How long does it take to get to a golf course?\nWhy? Did you get some practice?\nWell, you do have to pay me back for lunch.\n-See you later, then. -Yeah.\nBye.","text":"Mất bao nhiêu thời gian đến sân golf nhỉ?\nSao? Cậu luyện trước rồi hả?\nTôi cũng phải gỡ lại tiền ăn trưa chứ.\n- Gặp lại sau nhé. - Được rồi.\nTạm biệt.\n(오대표) 야, 여기서 골프장까지 얼마나 걸리냐?\n(황대중) 왜? 연습 좀 했나부지?\n(오대표) 아이, 점심 값 벌어야지 - (황대중) 점심 값\n(오대표) 들어가 - (황대중) 엉\nHow long does it take to get to a golf course?\nWhy? Did you get some practice?\nWell, you do have to pay me back for lunch.\n-See you later, then. -Yeah.\nBye.","sourceUid":"merged-msb74kzy-14","sourceNo":179,"viRanges":[{"start":1295.691845,"end":1307.351165}],"koRanges":[{"start":1428.422128,"end":1439.402264}]},{"id":387,"readerNo":388,"displayNo":73,"n":73,"kind":"sub","type":"merged","vi":"[thở dài]\n[Âm nhạc căng thẳng bắt đầu]","ko":"[한숨 소리]\n[긴장되는 분위기의 음악 시작]","en":"[sigh]\n[Tense music starts]","text":"[thở dài]\n[Âm nhạc căng thẳng bắt đầu]\n[한숨 소리]\n[긴장되는 분위기의 음악 시작]\n[sigh]\n[Tense music starts]","sourceUid":"merged-msb75g4b-15","sourceNo":274,"viRanges":[],"koRanges":[]},{"id":388,"readerNo":389,"displayNo":"N316","n":"N316","kind":"narration","type":"narration","vi":"Phòng nhìn từ vườn. Bốn người cười lớn.","ko":"정원에서 본 방. 네 사람이 깔깔깔 웃는다.","en":"Room seen from the garden. The four people laugh.","text":"Phòng nhìn từ vườn. Bốn người cười lớn.\n정원에서 본 방. 네 사람이 깔깔깔 웃는다.\nRoom seen from the garden. The four people laugh.","sourceUid":"nar-msh0wv3z-5lmtl8","sourceNo":"N316","viRanges":[],"koRanges":[]},{"id":389,"readerNo":390,"displayNo":"N317","n":"N317","kind":"narration","type":"narration","vi":". Bãi đỗ xe (ban ngày)","ko":". 주차장(낮)","en":". Parking lot (daytime)","text":". Bãi đỗ xe (ban ngày)\n. 주차장(낮)\n. Parking lot (daytime)","sourceUid":"nar-msh0ww9s-l1g2ui","sourceNo":"N317","viRanges":[],"koRanges":[]},{"id":390,"readerNo":391,"displayNo":"N318","n":"N318","kind":"narration","type":"narration","vi":"Đây là bãi đậu xe của nhà hàng nằm ở vị trí có view đẹp.","ko":"경치 좋은 곳에 위치한 식당 주차장이다.","en":"This is a restaurant parking lot located in a place with a nice view.","text":"Đây là bãi đậu xe của nhà hàng nằm ở vị trí có view đẹp.\n경치 좋은 곳에 위치한 식당 주차장이다.\nThis is a restaurant parking lot located in a place with a nice view.","sourceUid":"nar-msh0wxfz-kltj7j","sourceNo":"N318","viRanges":[],"koRanges":[]},{"id":391,"readerNo":392,"displayNo":"N319","n":"N319","kind":"narration","type":"narration","vi":"Công chúng và nhóm Kangana bước ra.","ko":"대중과 강이나 일행이 나온다.","en":"The public and Kangana's group come out.","text":"Công chúng và nhóm Kangana bước ra.\n대중과 강이나 일행이 나온다.\nThe public and Kangana's group come out.","sourceUid":"nar-msh0x1me-1u5qx3","sourceNo":"N319","viRanges":[],"koRanges":[]},{"id":392,"readerNo":393,"displayNo":"N320","n":"N320","kind":"narration","type":"narration","vi":"Hai chiếc xe nước ngoài phát ra tiếng bíp.","ko":"외제차 두 대가 삑 하며 소리를 낸다.","en":"Two foreign cars make a beeping noise.","text":"Hai chiếc xe nước ngoài phát ra tiếng bíp.\n외제차 두 대가 삑 하며 소리를 낸다.\nTwo foreign cars make a beeping noise.","sourceUid":"nar-msh0x2nt-ofizp8","sourceNo":"N320","viRanges":[],"koRanges":[]},{"id":393,"readerNo":394,"displayNo":"N321","n":"N321","kind":"narration","type":"dialogue","vi":"Hwang Dae-jung: Bạn đã tập luyện chưa?","ko":"황대중: 연습 좀 했나 부지.","en":"Hwang Dae-jung: Have you had some practice?","text":"Hwang Dae-jung: Bạn đã tập luyện chưa?\n황대중: 연습 좀 했나 부지.\nHwang Dae-jung: Have you had some practice?","sourceUid":"nar-msh0xcpk-7t5xuo","sourceNo":"N321","viRanges":[],"koRanges":[]},{"id":394,"readerNo":395,"displayNo":"N322","n":"N322","kind":"narration","type":"dialogue","vi":"Người đàn ông: (giả vờ đu dây) Tôi cần kiếm tiền để ăn trưa.","ko":"남자: (스윙하는 시늉을 하며) 점심 값 벌어야지.","en":"Man: (pretending to swing) I need to earn money for lunch.","text":"Người đàn ông: (giả vờ đu dây) Tôi cần kiếm tiền để ăn trưa.\n남자: (스윙하는 시늉을 하며) 점심 값 벌어야지.\nMan: (pretending to swing) I need to earn money for lunch.","sourceUid":"nar-msh0xdro-07elpx","sourceNo":"N322","viRanges":[],"koRanges":[]},{"id":395,"readerNo":396,"displayNo":"N323","n":"N323","kind":"narration","type":"dialogue","vi":"Kang Ina: (Cô ấy mỉm cười khi ngồi vào ghế phụ, nhưng sau đó mặt cô ấy đanh lại.","ko":"강이나: (조수석 쪽으로 가며 미소 짓다가 얼굴이 굳어버린다.","en":"Kang Ina: (She smiles as she goes to the passenger seat, but then her face hardens.","text":"Kang Ina: (Cô ấy mỉm cười khi ngồi vào ghế phụ, nhưng sau đó mặt cô ấy đanh lại.\n강이나: (조수석 쪽으로 가며 미소 짓다가 얼굴이 굳어버린다.\nKang Ina: (She smiles as she goes to the passenger seat, but then her face hardens.","sourceUid":"nar-msh0xf3y-8rokd4","sourceNo":"N323","viRanges":[],"koRanges":[]},{"id":396,"readerNo":397,"displayNo":"N324","n":"N324","kind":"narration","type":"narration","vi":"Trong một bãi đậu xe đầy xe hơi nước ngoài và sang trọng, có một chiếc xe tải cũ nát không vừa.)","ko":"외제차 고급차 일색의 주차장에 어울리지 않는 써금써금한 용달차가 서 있다)","en":"In a parking lot full of foreign and luxury cars, there is a worn-out truck that doesn't fit in.)","text":"Trong một bãi đậu xe đầy xe hơi nước ngoài và sang trọng, có một chiếc xe tải cũ nát không vừa.)\n외제차 고급차 일색의 주차장에 어울리지 않는 써금써금한 용달차가 서 있다)\nIn a parking lot full of foreign and luxury cars, there is a worn-out truck that doesn't fit in.)","sourceUid":"nar-msh0xgg3-6f7u18","sourceNo":"N324","viRanges":[],"koRanges":[]},{"id":397,"readerNo":398,"displayNo":"N325","n":"N325","kind":"narration","type":"dialogue","vi":"(Oh Jong-gyu): (Đột nhiên nắm lấy Kang hoặc cánh tay của anh ấy từ phía sau) ···Nói chuyện với tôi.","ko":"(오종규): (갑자기 뒤에서 강이나 팔을 잡는다) ···얘기 좀 해.","en":"(Oh Jong-gyu): (Suddenly grabs Kang or his arm from behind) ···Talk to me.","text":"(Oh Jong-gyu): (Đột nhiên nắm lấy Kang hoặc cánh tay của anh ấy từ phía sau) ···Nói chuyện với tôi.\n(오종규): (갑자기 뒤에서 강이나 팔을 잡는다) ···얘기 좀 해.\n(Oh Jong-gyu): (Suddenly grabs Kang or his arm from behind) ···Talk to me.","sourceUid":"nar-msh0xkc6- \n-Let go! -Who are you?\nWhy are you avoiding me? What happened that day?\nTell me, damn it!\nI have nothing to say. Let go!","text":"Nói chuyện trước đi. Một lát thôi.\nChuyện gì? Tôi không có gì để nói hết.\n- Bỏ tay ra! - Chú là ai vậy?\nSao cô lại tránh mặt tôi? Rốt cuộc ngày ấy có chuyện gì?\nNói cho tôi đi!\nTôi không có gì để nói! Bỏ tay ra!\n(강이나) [짧은 비명] - 얘기 좀 해, 잠깐이면 돼\n무슨 얘기? 나 할 얘기 없어요\n이거 놔 - (황대중) 아저씨 누구야?\n날 피하는 이유가 뭐야? 도대체 그날 무슨 일이 있었던 거야?\n제발 말해줘!\n나 할 얘기 없어, 이거 놔\nWe need to talk. It won't be long.\nTalk about what? I have nothing to talk about.\n-Let go! -Who are you?\nWhy are you avoiding me? What happened that day?\nTell me, damn it!\nI have nothing to say. Let go!","sourceUid":"merged-msb778yt-17","sourceNo":180,"viRanges":[{"start":1307.351165,"end":1324.717007}],"koRanges":[{"start":1439.402264,"end":1460.142951}]},{"id":402,"readerNo":403,"displayNo":75,"n":75,"kind":"sub","type":"merged","vi":"- Chú là ai cơ chứ? - Vì tôi là bố!\nVì là bố nên tôi cần biết tại sao con gái tôi lại chết!\nNày, chú kia. Nói đi! Làm ơn nói cho tôi đi! Này! Chết tiệt!\n- Thằng khốn. - Khốn nạn.","ko":"아저씨가 뭔데! - 아버지니까!\n아버지로서 알아야겠어! 내 딸이 왜 죽었는지? 어떻게 죽었는지?\n(황대중) 어이, 아저씨\n말해줘! 제발 말해줘!\n(황대중) 어이! [퍽 치는 소리] - (오종규) [비명]\n(오종규) 아유, 씨!\n아유, 씨! [서로 치는 소리]\n(오종규) [비명]","en":"-Who do you think you are? -I'm the father!\nAnd as her father, I need to know how and why my daughter died.\nHey, Mister. Tell me! Please, tell me!\nHey! Damn it. -You jerk. -Asshole.","text":"- Chú là ai cơ chứ? - Vì tôi là bố!\nVì là bố nên tôi cần biết tại sao con gái tôi lại chết!\nNày, chú kia. Nói đi! Làm ơn nói cho tôi đi! Này! Chết tiệt!\n- Thằng khốn. - Khốn nạn.\n아저씨가 뭔데! - 아버지니까!\n아버지로서 알아야겠어! 내 딸이 왜 죽었는지? 어떻게 죽었는지?\n(황대중) 어이, 아저씨\n말해줘! 제발 말해줘!\n(황대중) 어이! [퍽 치는 소리] - (오종규) [비명]\n(오종규) 아유, 씨!\n아유, 씨! [서로 치는 소리]\n(오종규) [비명]\n-Who do you think you are? -I'm the father!\nAnd as her father, I need to know how and why my daughter died.\nHey, Mister. Tell me! Please, tell me!\nHey! Damn it. -You jerk. -Asshole.","sourceUid":"merged-msb79r5b-19","sourceNo":184,"viRanges":[{"start":1324.717007,"end":1349.820921}],"koRanges":[{"start":1460.142951,"end":1480.914394}]},{"id":403,"readerNo":404,"displayNo":"N329","n":"N329","kind":"narration","type":"narration","vi":"Đúng lúc đó, Hwang Dae-jung tung ra một cú đấm.","ko":"그 순간 황대중이 주먹을 날린다.","en":"At that moment, Hwang Dae-jung throws a punch.","text":"Đúng lúc đó, Hwang Dae-jung tung ra một cú đấm.\n그 순간 황대중이 주먹을 날린다.\nAt that moment, Hwang Dae-jung throws a punch.","sourceUid":"nar-msh0ymx9-mzs7mr","sourceNo":"N329","viRanges":[],"koRanges":[]},{"id":404,"readerNo":405,"displayNo":"N330","n":"N330","kind":"narration","type":"narration","vi":"Hwang Dae-jung và người đàn ông bắt đầu đánh Oh Jong-gyu.","ko":"황대중과 남자가 오종규를 패기 시작한다.","en":"Hwang Dae-jung and the man begin to beat up Oh Jong-gyu.","text":"Hwang Dae-jung và người đàn ông bắt đầu đánh Oh Jong-gyu.\n황대중과 남자가 오종규를 패기 시작한다.\nHwang Dae-jung and the man begin to beat up Oh Jong-gyu.","sourceUid":"nar-msh0yoct-jmsxtm","sourceNo":"N330","viRanges":[],"koRanges":[]},{"id":405,"readerNo":406,"displayNo":"N331","n":"N331","kind":"narration","type":"narration","vi":"Oh Jong-gyu cố gắng chống cự nhưng anh không thể đánh bại hai người đàn ông đó.","ko":"오종규가 반항해보지만 두 사람을 당할 수는 없다.","en":"Oh Jong-gyu tries to resist, but he can't defeat the two men.","text":"Oh Jong-gyu cố gắng chống cự nhưng anh không thể đánh bại hai người đàn ông đó.\n오종규가 반항해보지만 두 사람을 당할 수는 없다.\nOh Jong-gyu tries to resist, but he can't defeat the two men.","sourceUid":"nar-msh0ypgg-jh16mf","sourceNo":"N331","viRanges":[],"koRanges":[]},{"id":406,"readerNo":407,"displayNo":"N332","n":"N332","kind":"narration","type":"narration","vi":"Người phụ nữ được người đàn ông đưa vào hét lên đầy đe dọa.","ko":"남자가 데려온 여자가 새된 비명을 지른다.","en":"The woman brought in by the man screams threateningly.","text":"Người phụ nữ được người đàn ông đưa vào hét lên đầy đe dọa.\n남자가 데려온 여자가 새된 비명을 지른다.\nThe woman brought in by the man screams threateningly.","sourceUid":"nar-msh0ytyz-l0ninv","sourceNo":"N332","viRanges":[],"koRanges":[]},{"id":407,"readerNo":408,"displayNo":"N333","n":"N333","kind":"narration","type":"narration","vi":"Kang Ina vặn ngón tay và nhìn Oh Jong-gyu, người đang bị đánh.","ko":"강이나는 손가락을 비틀며 얻어맞는 오종규를 바라본다.","en":"Kang Ina twists her fingers and looks at Oh Jong-gyu, who is being beaten.","text":"Kang Ina vặn ngón tay và nhìn Oh Jong-gyu, người đang bị đánh.\n강이나는 손가락을 비틀며 얻어맞는 오종규를 바라본다.\nKang Ina twists her fingers and looks at Oh Jong-gyu, who is being beaten.","sourceUid":"nar-msh0yv4p-ux8zdq","sourceNo":"N333","viRanges":[],"koRanges":[]},{"id":408,"readerNo":409,"displayNo":"N334","n":"N334","kind":"narration","type":"narration","vi":"Nhân viên bảo vệ bãi đậu xe chạy tới.","ko":"주차장 경비원이 달려온다.","en":"The parking lot security guard comes running.","text":"Nhân viên bảo vệ bãi đậu xe chạy tới.\n주차장 경비원이 달려온다.\nThe parking lot security guard comes running.","sourceUid":"nar-msh0ywuq-gp0lai","sourceNo":"N334","viRanges":[],"koRanges":[]},{"id":409,"readerNo":410,"displayNo":76,"n":76,"kind":"sub","type":"merged","vi":"- Các anh không được làm loạn ở đây. - Chết tiệt! Ngăn lại đi.\nCô làm ơn nói đi! Ngày ấy có chuyện gì vậy?\nSao em lại đi gặp cái thằng không ra gì như thế? Em xin lỗi.\nGiờ sao đây. Hỏng hết lịch trình của anh rồi.","ko":"(경비원) 여기서 이러시면 안 됩니다, (경비원) 막어, 막어, 막어!\n(오종규) 제발 말해줘!\n그날 무슨 일이 있었던 거야, 제발 말해줘, 제발 말해줘!\n어디서 그런 질 낮은 놈을 만난 거야? 미안해요\n이게 뭐냐? 스케줄 다-꼬이고","en":"-Please calm down, both of you. -Damn it! Stop him.\nPlease, tell me! What happened that day?\nHow did you end up meeting a guy like him? I am sorry.\nIt sucks. My schedule is all messed up now.","text":"- Các anh không được làm loạn ở đây. - Chết tiệt! Ngăn lại đi.\nCô làm ơn nói đi! Ngày ấy có chuyện gì vậy?\nSao em lại đi gặp cái thằng không ra gì như thế? Em xin lỗi.\nGiờ sao đây. Hỏng hết lịch trình của anh rồi.\n(경비원) 여기서 이러시면 안 됩니다, (경비원) 막어, 막어, 막어!\n(오종규) 제발 말해줘!\n그날 무슨 일이 있었던 거야, 제발 말해줘, 제발 말해줘!\n어디서 그런 질 낮은 놈을 만난 거야? 미안해요\n이게 뭐냐? 스케줄 다-꼬이고\n-Please calm down, both of you. -Damn it! Stop him.\nPlease, tell me! What happened that day?\nHow did you end up meeting a guy like him? I am sorry.\nIt sucks. My schedule is all messed up now.","sourceUid":"merged-msb7gay7-22","sourceNo":196,"viRanges":[{"start":1349.820921,"end":1382.066957}],"koRanges":[{"start":1480.914394,"end":1514.14215}]},{"id":410,"readerNo":411,"displayNo":"N335","n":"N335","kind":"narration","type":"narration","vi":". Trên ô tô (ban ngày)","ko":". 차 안(낮)","en":". In the car (daytime)","text":". Trên ô tô (ban ngày)\n. 차 안(낮)\n. In the car (daytime)","sourceUid":"nar-msh0z2je-dgkom8","sourceNo":"N335","viRanges":[],"koRanges":[]},{"id":411,"readerNo":412,"displayNo":"N336","n":"N336","kind":"narration","type":"dialogue","vi":"Hwang Dae-jung: (Tôi đang lái xe. Cú đấm của tôi với Oh Jong-gyu rất đau. Anh ấy đã cắt cổ tay mình.)","ko":"황대중: (운전 중이다. 오종규를 때린 주먹이 아프다. 손목을 턴다)","en":"Hwang Dae-jung: (I'm driving. The fist I hit with Oh Jong-gyu hurts. He cuts his wrist.)","text":"Hwang Dae-jung: (Tôi đang lái xe. Cú đấm của tôi với Oh Jong-gyu rất đau. Anh ấy đã cắt cổ tay mình.)\n황대중: (운전 중이다. 오종규를 때린 주먹이 아프다. 손목을 턴다)\nHwang Dae-jung: (I'm driving. The fist I hit with Oh Jong-gyu hurts. He cuts his wrist.)","sourceUid":"nar-msh0z3j0-qo1hrr","sourceNo":"N336","viRanges":[],"koRanges":[]},{"id":412,"readerNo":413,"displayNo":77,"n":77,"kind":"sub","type":"merged","vi":"[Tiếng xe dừng lại]\n[Bản nhạc hồi hộp kết thúc]\n[Tiếng cửa xe đóng lại và xe rời đi]\n[tiếng bước chân] [tiếng chuông điện thoại di động]","ko":"[차 서는 소리]\n[긴장되는 분위기의 음악 끝]\n[차문 닫히고 차 떠나는 소리]\n[발소리] [핸드폰 벨 소리]","en":"[Sound of car stopping]\n[Nervous music ends]\n[Sound of car door closing and car leaving]\n[footsteps] [cell phone ringing]","text":"[Tiếng xe dừng lại]\n[Bản nhạc hồi hộp kết thúc]\n[Tiếng cửa xe đóng lại và xe rời đi]\n[tiếng bước chân] [tiếng chuông điện thoại di động]\n[차 서는 소리]\n[긴장되는 분위기의 음악 끝]\n[차문 닫히고 차 떠나는 소리]\n[발소리] [핸드폰 벨 소리]\n[Sound of car stopping]\n[Nervous music ends]\n[Sound of car door closing and car leaving]\n[footsteps] [cell phone ringing]","sourceUid":"merged-msb7gspc-23","sourceNo":300,"viRanges":[],"koRanges":[]},{"id":413,"readerNo":414,"displayNo":78,"n":78,"kind":"sub","type":"merged","vi":"Vâng. Không, em sẽ đi.\nĐã bảo đừng đến mà!\nNày, em làm anh bất ngờ quá.\nDù vậy cũng dễ thương đúng không?\nĐáng yêu đúng không?\nGãy cái lưng anh mất.","ko":"응 아니야, 내가 나갈게\n[소리 지르며] 아, 오지 말라구!\n너... 야, 놀랬잖아\n그래도 귀엽지?\n사랑스럽지?\n(고두영) 어휴, 허리 나가는 줄 알았네","en":"Yes. No, I'll go there.\nI told you not to come here!\nHey, you surprised me.\nBut you still think I'm cute, right?\nYou think that I'm lovable, right?\nI thought I was gonna break my back.","text":"Vâng. Không, em sẽ đi.\nĐã bảo đừng đến mà!\nNày, em làm anh bất ngờ quá.\nDù vậy cũng dễ thương đúng không?\nĐáng yêu đúng không?\nGãy cái lưng anh mất.\n응 아니야, 내가 나갈게\n[소리 지르며] 아, 오지 말라구!\n너... 야, 놀랬잖아\n그래도 귀엽지?\n사랑스럽지?\n(고두영) 어휴, 허리 나가는 줄 알았네\nYes. No, I'll go there.\nI told you not to come here!\nHey, you surprised me.\nBut you still think I'm cute, right?\nYou think that I'm lovable, right?\nI thought I was gonna break my back.","sourceUid":"merged-msb7jz4h-27","sourceNo":201,"viRanges":[{"start":1382.066957,"end":1445.809281}],"koRanges":[{"start":1514.14215,"end":1577.605189}]},{"id":414,"readerNo":415,"displayNo":79,"n":79,"kind":"sub","type":"merged","vi":"[Âm nhạc căng thẳng bắt đầu]\n[Tiếng đóng cửa xe] [Tiếng kéo dài]","ko":"[긴장되는 분위기의 음악 시작]\n[차문 닫히는 소리] [기지개 펴는 소리]","en":"[Tense music starts]\n[Sound of car door closing] [Sound of stretching]","text":"[Âm nhạc căng thẳng bắt đầu]\n[Tiếng đóng cửa xe] [Tiếng kéo dài]\n[긴장되는 분위기의 음악 시작]\n[차문 닫히는 소리] [기지개 펴는 소리]\n[Tense music starts]\n[Sound of car door closing] [Sound of stretching]","sourceUid":"merged-msb7hvs7-25","sourceNo":305,"viRanges":[],"koRanges":[]},{"id":415,"readerNo":416,"displayNo":80,"n":80,"kind":"sub","type":"merged","vi":"Lên xe đi. Em lên hết lịch trình, rồi tìm hiểu các quán ăn ngon rồi.\nĐầu tiên, đi đến Trung tâm Cộng đồng Boamdong.\nĐi vào đằng sau thì sẽ có một con đường đất.\nĐó là nơi nổi tiếng với cả dân địa phương. Được chứ?\nSao nay tâm trạng em tốt thế?","ko":"타. 내가 스케줄 다 짜왔어 맛집도 알아놨구\n일단 부암동 주민센터 쪽으로 가\n주민센터 뒤쪽으로 가면 흙길이 있는데\n거기가 동네 사람들만 아는 산책로래, 좋겠지?\n[피식 웃으며] 왜 이렇게 기분 좋아?","en":"Get in. I planned everything and found some good restaurants.\nFirst, go toward the Boamdong Citizen's Center.\nIf you go behind that building, there's a dirt path.\nApparently, it's popular with locals. Would you like that?\nWhy are you in such a good mood?","text":"Lên xe đi. Em lên hết lịch trình, rồi tìm hiểu các quán ăn ngon rồi.\nĐầu tiên, đi đến Trung tâm Cộng đồng Boamdong.\nĐi vào đằng sau thì sẽ có một con đường đất.\nĐó là nơi nổi tiếng với cả dân địa phương. Được chứ?\nSao nay tâm trạng em tốt thế?\n타. 내가 스케줄 다 짜왔어 맛집도 알아놨구\n일단 부암동 주민센터 쪽으로 가\n주민센터 뒤쪽으로 가면 흙길이 있는데\n거기가 동네 사람들만 아는 산책로래, 좋겠지?\n[피식 웃으며] 왜 이렇게 기분 좋아?\nGet in. I planned everything and found some good restaurants.\nFirst, go toward the Boamdong Citizen's Center.\nIf you go behind that building, there's a dirt path.\nApparently, it's popular with locals. Would you like that?\nWhy are you in such a good mood?","sourceUid":"merged-msb7rf4u-29","sourceNo":209,"viRanges":[{"start":1445.809281,"end":1461.728826}],"koRanges":[{"start":1577.605189,"end":1594.227774}]},{"id":416,"readerNo":417,"displayNo":"N337","n":"N337","kind":"narration","type":"narration","vi":". Trước Belle Epoque (ban ngày)","ko":". 벨 에포크 앞(낮)","en":". In front of Belle Epoque (daytime)","text":". Trước Belle Epoque (ban ngày)\n. 벨 에포크 앞(낮)\n. In front of Belle Epoque (daytime)","sourceUid":"nar-msh106t6-pzpwjd","sourceNo":"N337","viRanges":[],"koRanges":[]},{"id":417,"readerNo":418,"displayNo":"N338","n":"N338","kind":"narration","type":"narration","vi":"Kang Ina bước ra khỏi xe.","ko":"강이나가 차에서 내린다.","en":"Kang Ina gets out of the car.","text":"Kang Ina bước ra khỏi xe.\n강이나가 차에서 내린다.\nKang Ina gets out of the car.","sourceUid":"nar-msh108gt-c1pdh0","sourceNo":"N338","viRanges":[],"koRanges":[]},{"id":418,"readerNo":419,"displayNo":"N339","n":"N339","kind":"narration","type":"narration","vi":"Khi tôi quay lại sau khi tiễn xe của Hwang Dae-jung, Jeong Ye-eun đang quan sát.","ko":"황대중의 차를 배웅하고 돌아서는데 정예은이 보고 있다.","en":"As I turn around after seeing off Hwang Dae-jung's car, Jeong Ye-eun is watching.","text":"Khi tôi quay lại sau khi tiễn xe của Hwang Dae-jung, Jeong Ye-eun đang quan sát.\n황대중의 차를 배웅하고 돌아서는데 정예은이 보고 있다.\nAs I turn around after seeing off Hwang Dae-jung's car, Jeong Ye-eun is watching.","sourceUid":"nar-msh109h6-551kcq","sourceNo":"N339","viRanges":[],"koRanges":[]},{"id":419,"readerNo":420,"displayNo":"N340","n":"N340","kind":"narration","type":"narration","vi":"Kang Ina phớt lờ anh ta và đi vào trong.","ko":"강이나가 무시하고 안으로 들어간다.","en":"Kang Ina ignores him and goes inside.","text":"Kang Ina phớt lờ anh ta và đi vào trong.\n강이나가 무시하고 안으로 들어간다.\nKang Ina ignores him and goes inside.","sourceUid":"nar-msh10bch-lc1v7t","sourceNo":"N340","viRanges":[],"koRanges":[]},{"id":420,"readerNo":421,"displayNo":"N341","n":"N341","kind":"narration","type":"narration","vi":"Điện thoại di động của Jeong Ye-eun đổ chuông. Đó là 'oppa'.","ko":"정예은의 핸드폰이 울린다. ‘오빠’다.","en":"Jeong Ye-eun’s cell phone rings. It’s ‘oppa’.","text":"Điện thoại di động của Jeong Ye-eun đổ chuông. Đó là 'oppa'.\n정예은의 핸드폰이 울린다. ‘오빠’다.\nJeong Ye-eun’s cell phone rings. It’s ‘oppa’.","sourceUid":"nar-msh10drz-xjwonl","sourceNo":"N341","viRanges":[],"koRanges":[]},{"id":421,"readerNo":422,"displayNo":"N342","n":"N342","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Chấp nhận) Vâng. (Sau khi nghe) Không. Nó không đến. Tôi sẽ đi ra ngoài.","ko":"정예은: (받는다) 응. (듣다가) 아니야. 올 거 없어. 내가 나갈게.","en":"Jeong Ye-eun: (Accepts) Yes. (After listening) No. It's not coming. I'll go out.","text":"Jeong Ye-eun: (Chấp nhận) Vâng. (Sau khi nghe) Không. Nó không đến. Tôi sẽ đi ra ngoài.\n정예은: (받는다) 응. (듣다가) 아니야. 올 거 없어. 내가 나갈게.\nJeong Ye-eun: (Accepts) Yes. (After listening) No. It's not coming. I'll go out.","sourceUid":"nar-msh10gl9-f3vxl0","sourceNo":"N342","viRanges":[],"koRanges":[]},{"id":422,"readerNo":423,"displayNo":"N343","n":"N343","kind":"narration","type":"narration","vi":"(Nghe xong, anh ấy hét lên) Đừng đến!!","ko":"(듣다가 버럭) 오지 말라구!!","en":"(After listening, he bursts out) Don’t come!!","text":"(Nghe xong, anh ấy hét lên) Đừng đến!!\n(듣다가 버럭) 오지 말라구!!\n(After listening, he bursts out) Don’t come!!","sourceUid":"nar-msh10ln9-45wgfn","sourceNo":"N343","viRanges":[],"koRanges":[]},{"id":423,"readerNo":424,"displayNo":"N344","n":"N344","kind":"narration","type":"narration","vi":"(Ngập ngừng) Vì là ngõ nên khó lái xe...","ko":"(우물쭈물) 골목이라 운전하기도 힘들고···","en":"(Hesitating) It’s hard to drive because it’s an alley...","text":"(Ngập ngừng) Vì là ngõ nên khó lái xe...\n(우물쭈물) 골목이라 운전하기도 힘들고···\n(Hesitating) It’s hard to drive because it’s an alley...","sourceUid":"nar-msh10o46-lut6i6","sourceNo":"N344","viRanges":[],"koRanges":[]},{"id":424,"readerNo":425,"displayNo":"N345","n":"N345","kind":"narration","type":"narration","vi":"Khó quá anh trai ạ. Tôi sẽ đi ra ngoài.","ko":"오빠 힘들잖아. 내가 나갈게.","en":"It's hard, brother. I'll go out.","text":"Khó quá anh trai ạ. Tôi sẽ đi ra ngoài.\n오빠 힘들잖아. 내가 나갈게.\nIt's hard, brother. I'll go out.","sourceUid":"nar-msh10pis-xl1jwe","sourceNo":"N345","viRanges":[],"koRanges":[]},{"id":425,"readerNo":426,"displayNo":"N346","n":"N346","kind":"narration","type":"narration","vi":". Ven đường (ban ngày)","ko":". 길가(낮)","en":". Roadside (daytime)","text":". Ven đường (ban ngày)\n. 길가(낮)\n. Roadside (daytime)","sourceUid":"nar-msh10qkw-z2alqi","sourceNo":"N346","viRanges":[],"koRanges":[]},{"id":426,"readerNo":427,"displayNo":"N347","n":"N347","kind":"narration","type":"narration","vi":"Jeong Ye-eun, người đang đến từ xa, nhìn thấy Go Doo-young.","ko":"멀리서 오던 정예은이 고두영을 발견한다.","en":"Jeong Ye-eun, who was coming from afar, spots Go Doo-young.","text":"Jeong Ye-eun, người đang đến từ xa, nhìn thấy Go Doo-young.\n멀리서 오던 정예은이 고두영을 발견한다.\nJeong Ye-eun, who was coming from afar, spots Go Doo-young.","sourceUid":"nar-msh10rgl-9amlhi","sourceNo":"N347","viRanges":[],"koRanges":[]},{"id":427,"readerNo":428,"displayNo":"N348","n":"N348","kind":"narration","type":"narration","vi":"Tôi nhìn Go Doo-young bước ra khỏi xe và vươn vai.","ko":"고두영이 차에서 내려 기지개를 켜는 모습을 지켜본다.","en":"I watch Go Doo-young get out of the car and stretch.","text":"Tôi nhìn Go Doo-young bước ra khỏi xe và vươn vai.\n고두영이 차에서 내려 기지개를 켜는 모습을 지켜본다.\nI watch Go Doo-young get out of the car and stretch.","sourceUid":"nar-msh10so0-mpgmkw","sourceNo":"N348","viRanges":[],"koRanges":[]},{"id":428,"readerNo":429,"displayNo":"N349","n":"N349","kind":"narration","type":"narration","vi":"Khoảnh khắc Go Doo-young quay đầu lại và giao tiếp bằng mắt,","ko":"고두영이 고개를 돌려 시선이 마주치려는 순간,","en":"The moment Go Doo-young turned his head and made eye contact,","text":"Khoảnh khắc Go Doo-young quay đầu lại và giao tiếp bằng mắt,\n고두영이 고개를 돌려 시선이 마주치려는 순간,\nThe moment Go Doo-young turned his head and made eye contact,","sourceUid":"nar-msh10tzp-nc7kin","sourceNo":"N349","viRanges":[],"koRanges":[]},{"id":429,"readerNo":430,"displayNo":"N350","n":"N350","kind":"narration","type":"narration","vi":"Jeong Ye-eun chạy đến và ôm anh.","ko":"정예은이 달려와 와락 안긴다.","en":"Jeong Ye-eun runs up and hugs him.","text":"Jeong Ye-eun chạy đến và ôm anh.\n정예은이 달려와 와락 안긴다.\nJeong Ye-eun runs up and hugs him.","sourceUid":"nar-msh10vbg-zzvp96","sourceNo":"N350","viRanges":[],"koRanges":[]},{"id":430,"readerNo":431,"displayNo":"N351","n":"N351","kind":"narration","type":"narration","vi":"Cơ thể của Go Doo-young đang run rẩy.","ko":"고두영의 몸이 휘청할 정도다.","en":"Go Doo-young's body is shaking.","text":"Cơ thể của Go Doo-young đang run rẩy.\n고두영의 몸이 휘청할 정도다.\nGo Doo-young's body is shaking.","sourceUid":"nar-msh10wee-gzh93o","sourceNo":"N351","viRanges":[],"koRanges":[]},{"id":431,"readerNo":432,"displayNo":"N352","n":"N352","kind":"narration","type":"dialogue","vi":"Go Doo-young: (ngạc nhiên) Này! Bạn đã rất ngạc nhiên.","ko":"고두영: (놀랐다) 야! 놀랬잖아.","en":"Go Doo-young: (surprised) Hey! You were surprised.","text":"Go Doo-young: (ngạc nhiên) Này! Bạn đã rất ngạc nhiên.\n고두영: (놀랐다) 야! 놀랬잖아.\nGo Doo-young: (surprised) Hey! You were surprised.","sourceUid":"nar-msh10yni-4g36yw","sourceNo":"N352","viRanges":[],"koRanges":[]},{"id":432,"readerNo":433,"displayNo":"N353","n":"N353","kind":"narration","type":"dialogue","vi":"Go Doo-young: (Bước vào xe) Tôi cứ tưởng eo mình sắp lòi ra ngoài rồi.","ko":"고두영: (차에 탄다) 허리 나가는 줄 알았다.","en":"Go Doo-young: (Getting into the car) I thought my waist was going to go out.","text":"Go Doo-young: (Bước vào xe) Tôi cứ tưởng eo mình sắp lòi ra ngoài rồi.\n고두영: (차에 탄다) 허리 나가는 줄 알았다.\nGo Doo-young: (Getting into the car) I thought my waist was going to go out.","sourceUid":"nar-msh1144r-swyao0","sourceNo":"N353","viRanges":[],"koRanges":[]},{"id":433,"readerNo":434,"displayNo":"N354","n":"N354","kind":"narration","type":"narration","vi":". Go Doo-young trên ô tô (ban ngày)","ko":". 고두영 차 안(낮)","en":". Go Doo-young in the car (daytime)","text":". Go Doo-young trên ô tô (ban ngày)\n. 고두영 차 안(낮)\n. Go Doo-young in the car (daytime)","sourceUid":"nar-msh1151m-nx3pij","sourceNo":"N354","viRanges":[],"koRanges":[]},{"id":434,"readerNo":435,"displayNo":"N355","n":"N355","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Vui mừng) Tôi đã lên lịch rồi. Tôi cũng biết một nhà hàng ngon.","ko":"정예은: (신났다) 내가 스케줄 다 짜 왔어. 맛집도 알아놨구.","en":"Jeong Ye-eun: (Excited) I made the schedule. I also knew a good restaurant.","text":"Jeong Ye-eun: (Vui mừng) Tôi đã lên lịch rồi. Tôi cũng biết một nhà hàng ngon.\n정예은: (신났다) 내가 스케줄 다 짜 왔어. 맛집도 알아놨구.\nJeong Ye-eun: (Excited) I made the schedule. I also knew a good restaurant.","sourceUid":"nar-msh11bh6-5gdrbj","sourceNo":"N355","viRanges":[],"koRanges":[] ","viRanges":[],"koRanges":[]},{"id":439,"readerNo":440,"displayNo":81,"n":81,"kind":"sub","type":"merged","vi":"Chỉ cần ở cạnh anh là em hạnh phúc mà. Anh không vậy sao?\nEm làm gì vậy?\nĐi thôi. Anh, há miệng đi. Chờ một lát nào.","ko":"난 오빠만 있으면 행복한데 오빤 안 그래?\n(고두영) 뭐해?\n가자\n오빠, 아\n야, 하하\n음, 잠깐만\n(고두영) 아","en":"I'm happy as long as I am with you. Don't you feel the same way?\nWhat are you doing?\nLet's go. Honey, open your mouth. Wait.","text":"Chỉ cần ở cạnh anh là em hạnh phúc mà. Anh không vậy sao?\nEm làm gì vậy?\nĐi thôi. Anh, há miệng đi. Chờ một lát nào.\n난 오빠만 있으면 행복한데 오빤 안 그래?\n(고두영) 뭐해?\n가자\n오빠, 아\n야, 하하\n음, 잠깐만\n(고두영) 아\nI'm happy as long as I am with you. Don't you feel the same way?\nWhat are you doing?\nLet's go. Honey, open your mouth. Wait.","sourceUid":"merged-msb7ti7o-31","sourceNo":325,"viRanges":[],"koRanges":[{"start":1594.227774,"end":1642.850359}]},{"id":440,"readerNo":441,"displayNo":"N360","n":"N360","kind":"narration","type":"narration","vi":"Một ngày nọ, Jeong Ye-eun nhìn vào KakaoTalk của cô ấy.","ko":"언젠가 자신의 카톡을 들여다보는 정예은.","en":"One day, Jeong Ye-eun looks into her KakaoTalk.","text":"Một ngày nọ, Jeong Ye-eun nhìn vào KakaoTalk của cô ấy.\n언젠가 자신의 카톡을 들여다보는 정예은.\nOne day, Jeong Ye-eun looks into her KakaoTalk.","sourceUid":"nar-msh1ez4t-ezqvox","sourceNo":"N360","viRanges":[],"koRanges":[]},{"id":441,"readerNo":442,"displayNo":"N361","n":"N361","kind":"narration","type":"dialogue","vi":"Ko Doo-young: (Không biết anh ấy có nhìn nhầm không)...","ko":"고두영: (자기가 잘못 봤나 싶다) ···.","en":"Ko Doo-young: (I wonder if he saw it wrong)...","text":"Ko Doo-young: (Không biết anh ấy có nhìn nhầm không)...\n고두영: (자기가 잘못 봤나 싶다) ···.\nKo Doo-young: (I wonder if he saw it wrong)...","sourceUid":"nar-msh1f07u-d2yhjb","sourceNo":"N361","viRanges":[],"koRanges":[]},{"id":442,"readerNo":443,"displayNo":"N362","n":"N362","kind":"narration","type":"narration","vi":". Đường đi bộ Buam-dong (ban ngày)","ko":". 부암동 산책로(낮)","en":". Buam-dong walking trail (dayt 구야?\n어허, 동식이\n왜? - 그냥, 술 먹자고\n(고두영) 아, 그 자식은 알콜홀릭이야 일주일에 여덟 번은 마실걸\n(고두영) 잘 마시지도 못하는 게\n[와인 '후루룩' 마시는 소리]\nHere you are. Who is that? It's Dong-Shik.\nWhat does he want? -He just wants us to go have a drink.\nMan, that guy is a total alcoholic. He drinks about eight times a week.\nBut he can't handle a lot of alcohol.\n[Sound of slurping wine]","sourceUid":"merged-msb82vf2-33","sourceNo":221,"viRanges":[{"start":1461.728826,"end":1557.284761}],"koRanges":[{"start":1642.850359,"end":1688.261214}]},{"id":464,"readerNo":465,"displayNo":"N381","n":"N381","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (nhâm nhi phần rượu còn lại với vẻ mặt nghiêm nghị) ...","ko":"정예은: (굳은 얼굴로 남은 와인을 홀짝 마신다) ···.","en":"Jeong Ye-eun: (sips the remaining wine with a stern expression) ...","text":"Jeong Ye-eun: (nhâm nhi phần rượu còn lại với vẻ mặt nghiêm nghị) ...\n정예은: (굳은 얼굴로 남은 와인을 홀짝 마신다) ···.\nJeong Ye-eun: (sips the remaining wine with a stern expression) ...","sourceUid":"nar-msh1gfdg-0p8x4y","sourceNo":"N381","viRanges":[],"koRanges":[]},{"id":465,"readerNo":466,"displayNo":"N382","n":"N382","kind":"narration","type":"narration","vi":"(Giơ tay gọi người phục vụ) ···.","ko":"(웨이터를 부르려고 손을 든다) ···.","en":"(Raises hand to call waiter) ···.","text":"(Giơ tay gọi người phục vụ) ···.\n(웨이터를 부르려고 손을 든다) ···.\n(Raises hand to call waiter) ···.","sourceUid":"nar-msh1gryd-mignud","sourceNo":"N382","viRanges":[],"koRanges":[]},{"id":466,"readerNo":467,"displayNo":"N383","n":"N383","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Đột nhiên tỉnh dậy.","ko":"정예은: (갑자기 일어난다.","en":"Jeong Ye-eun: (Suddenly wakes up.","text":"Jeong Ye-eun: (Đột nhiên tỉnh dậy.\n정예은: (갑자기 일어난다.\nJeong Ye-eun: (Suddenly wakes up.","sourceUid":"nar-msh1gt70-ea1sg3","sourceNo":"N383","viRanges":[],"koRanges":[]},{"id":467,"readerNo":468,"displayNo":"N384","n":"N384","kind":"narration","type":"narration","vi":"Tiếng đẩy ghế rất lớn!! (Thật khó chịu) Dừng lại!","ko":"의자가 밀리는 소리가 드르륵!! 귀에 거슬린다) 그만 가!", e the bus.\nThere's a bus that takes me straight home. That'd be better for me.","sourceUid":"merged-msb8qrh1-36","sourceNo":235,"viRanges":[{"start":1589.86526,"end":1608.482987}],"koRanges":[{"start":1723.982212,"end":1740.690374}]},{"id":474,"readerNo":475,"displayNo":"N388","n":"N388","kind":"narration","type":"narration","vi":". Trên xe buýt (đêm)","ko":". 버스 안(밤)","en":". On the bus (night)","text":". Trên xe buýt (đêm)\n. 버스 안(밤)\n. On the bus (night)","sourceUid":"nar-msh1in82-g40fvb","sourceNo":"N388","viRanges":[],"koRanges":[]},{"id":475,"readerNo":476,"displayNo":"N389","n":"N389","kind":"narration","type":"narration","vi":"Jeong Ye-eun gọi cho Kang In-na.","ko":"정예은이 강이나에게 전화한다.","en":"Jeong Ye-eun calls Kang In-na.","text":"Jeong Ye-eun gọi cho Kang In-na.\n정예은이 강이나에게 전화한다.\nJeong Ye-eun calls Kang In-na.","sourceUid":"nar-msh1iogj-8yvy81","sourceNo":"N389","viRanges":[],"koRanges":[]},{"id":476,"readerNo":477,"displayNo":"N390","n":"N390","kind":"narration","type":"narration","vi":"Bạn sẽ nghe thấy âm thanh máy móc báo rằng 'nguồn bị tắt'.","ko":"‘전원이 꺼져 있다’는 기계음 들린다.","en":"You will hear a mechanical sound saying ‘the power is off.’","text":"Bạn sẽ nghe thấy âm thanh máy móc báo rằng 'nguồn bị tắt'.\n‘전원이 꺼져 있다’는 기계음 들린다.\nYou will hear a mechanical sound saying ‘the power is off.’","sourceUid":"nar-msh1iqov-xebw7o","sourceNo":"N390","viRanges":[],"koRanges":[]},{"id":477,"readerNo":478,"displayNo":"N391","n":"N391","kind":"narration","type":"narration","vi":"Jeong Ye-eun đang gọi cho Go Doo-young.","ko":"정예은이 고두영에게 전화 중이다.","en":"Jeong Ye-eun is calling Go Doo-young.","text":"Jeong Ye-eun đang gọi cho Go Doo-young.\n정예은이 고두영에게 전화 중이다.\nJeong Ye-eun is calling Go Doo-young.","sourceUid":"nar-msh1irxu-upo3yg","sourceNo":"N391","viRanges":[],"koRanges":[]},{"id":478,"readerNo":479,"displayNo":"N392","n":"N392","kind":"narration","type":"narration","vi":"Tôi không nhận được nó. Jeong Ye Eun trở nên lo lắng.","ko":"안 받는다. 정예은은 초조해진다.","en":"I don't recei nằm trên giường.\n강이나가 침대에 누워 있다.\nKang Ina is lying on the bed.","sourceUid":"nar-msh1kbbi-al1cey","sourceNo":"N398","viRanges":[],"koRanges":[]},{"id":489,"readerNo":490,"displayNo":"N399","n":"N399","kind":"narration","type":"narration","vi":"•Chèn - Bãi đậu xe 〉〉","ko":"•인서트 - 주차장 〉〉","en":"•Insert - Parking Lot 〉〉","text":"•Chèn - Bãi đậu xe 〉〉\n•인서트 - 주차장 〉〉\n•Insert - Parking Lot 〉〉","sourceUid":"nar-msh1keqy-y4jly9","sourceNo":"N399","viRanges":[],"koRanges":[]},{"id":490,"readerNo":491,"displayNo":"N400","n":"N400","kind":"narration","type":"narration","vi":"Oh Jong-gyu, bị nhân viên bảo vệ bãi đậu xe kéo đi, nhìn mình đến cuối và hét lên.","ko":"주차장 경비원에게 끌려가는 오종규가 끝까지 자신을 바라보며 소리친다.","en":"Oh Jong-gyu, being dragged away by the parking lot security guard, looks at himself until the end and shouts.","text":"Oh Jong-gyu, bị nhân viên bảo vệ bãi đậu xe kéo đi, nhìn mình đến cuối và hét lên.\n주차장 경비원에게 끌려가는 오종규가 끝까지 자신을 바라보며 소리친다.\nOh Jong-gyu, being dragged away by the parking lot security guard, looks at himself until the end and shouts.","sourceUid":"nar-msh1kg0p-dwwgov","sourceNo":"N400","viRanges":[],"koRanges":[]},{"id":491,"readerNo":492,"displayNo":92,"n":92,"kind":"sub","type":"merged","vi":"Tại sao hôm đó chú khóc? Vì tôi nhớ về quá khứ.\nCon gái tôi…Cô đã giết con gái tôi sao?\nNói đi! - Chú là ai? Vì là bố nên tôi cần biết.\nCô làm ơn nói đi! Ngày ấy có chuyện gì vậy? Cô làm ơn nói đi!","ko":"(강이나) [생각] 아저씨, 그날 왜 울었어요?\n(오종규) 옛날 생각이 나서\n(오종규) 딸아이하고 놀던-내 딸, 니가 죽였어?\n(강이나) 아저씨가 뭔데!\n(오종규) 아버지니까! 아버지로서 알아야겠어! 제발 말해줘!\n그날 무슨 일이 있었던 거야! 제발 말해줘! 제발 말해줘!","en":"Why did you cry that day? Because it reminded me of my past.\nMy daughter... Tell me. Did you kill her? -Tell me! -Who do you think you are? Because I am her father! I need to know. Please, tell me!\nWhat happened that day? Please, tell me!","text":"Tại sao hôm đó chú khóc? Vì tôi nhớ về quá khứ.\nCon gái tôi…Cô đã giết con gái tôi sao?\nNói đi! - Chú là ai? Vì là bố nên tôi cần biết.\nCô làm ơn nói đi! Ngày ấy có chuyện gì vậy? Cô làm ơn nói đi!\n(강이나) [생각] 아저씨, 그날 왜 울었어요?\n(오종규) 옛날 생각이 나서\n(오종규) 딸아이하고 놀던-내 딸, 니가 죽였어?\n(강이나) 아저씨가 뭔데!\n(오종규) 아버지니까! 아버지로서 알아야겠어! 제발 말해줘!\n그날 무슨 일이 있었던 거야! 제발 말해줘! 제발 말해줘!\nWhy did you cry that day? Because it reminded me of my past.\nMy daughter... Tell me. Did you kill her? -Tell me! -Who do you think you are? Because I am her father! I need to know. Please, tell me!\nWhat happened that day? Please, tell me!","sourceUid":"cand-msfk4a6u-2","sourceNo":1,"viRanges":[{"start":1636.994208,"end":1681.696}],"koRanges":[{"start":1786.070886,"end":1824.150705}]},{"id":492,"readerNo":493,"displayNo":"N401","n":"N401","kind":"narration","type":"narration","vi":"Kang Ina bật điện thoại di động lên.","ko":"강이나가 핸드폰의 전원을 켠다.","en":"Kang Ina turns on her cell phone.","text":"Kang Ina bật điện thoại di động lên.\n강이나가 핸드폰의 전원을 켠다.\nKang Ina turns on her cell phone.","sourceUid":"nar-msh1kr19-bv27yu","sourceNo":"N401","viRanges":[],"koRanges":[]},{"id":493,"readerNo":494,"displayNo":"N402","n":"N402","kind":"narration","type":"dialogue","vi":"Kang Ina: (gọi Seo Dong-ju) ... Là tôi đây.","ko":"강이나: (서동주에게 전화한다) ···난데.","en":"Kang Ina: (calling Seo Dong-ju) ... It's me.","text":"Kang Ina: (gọi Seo Dong-ju) ... Là tôi đây.\n강이나: (서동주에게 전화한다) ···난데.\nKang Ina: (calling Seo Dong-ju) ... It's me.","sourceUid":"nar-msh1kslj-etm5uc","sourceNo":"N402","viRanges":[],"koRanges":[]},{"id":494,"readerNo":495,"displayNo":"N403","n":"N403","kind":"narration","type":"narration","vi":"Lần trước tên đó nói hắn sống ở goshiwon. Bạn có gia đình nào khác không?","ko":"지난번 그 아저씨 고시원 산다 그랬지. 다른 가족은 없어?","en":"Last time, that guy said he lives in a goshiwon. Do you have any other family?","text":"Lần trước tên đó nói hắn sống ở goshiwon. Bạn có gia đình nào khác không?\n지난번 그 아저씨 고시원 산다 그랬지. 다른 가족은 없어?\nLast time, that guy said he lives in a goshiwon. Do you have any other family?","sourceUid":"nar-msh1ku2e-7s4orr","sourceNo":"N403","viRanges":[],"koRanges":[]},{"id":495,"readerNo":496,"displayNo":"N404","n":"N404","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Anh ta mở cửa bước vào, giật lấy Kang hoặc điện thoại di động của anh ta và áp vào tai) ...","ko":"정예은: (문을 벌컥 열고 들어와 다짜고짜 강이나 핸드폰을 빼앗아 귀에 대본다) ···.","en":"Jeong Ye-eun: (He bursts open the door, comes in, snatches Kang or his cell phone and puts it to his ear) ...","text":"Jeong Ye-eun: (Anh ta mở cửa bước vào, giật lấy Kang hoặc điện thoại di động của anh ta và áp vào tai) ...\n정예은: (문을 벌컥 열고 들어와 다짜고짜 강이나 핸드폰을 빼앗아 귀에 대본다) ···.\nJeong Ye-eun: (He bursts open the door, comes in, snatches Kang or his cell phone and puts it to his ear) ...","sourceUid":"nar-msh1kxzn-nh5lbl","sourceNo":"N404","viRanges":[],"koRanges":[]},{"id":496,"readerNo":497,"displayNo":93,"n":93,"kind":"sub","type":"merged","vi":"[âm thanh quay số điện thoại]\n[Âm kết nối điện thoại và âm quay số] Hmm","ko":"[전화 거는 소리]\n[전화 연결음 및 신호음] 으흠","en":"[phone dialing sound]\n[Phone connection tone and dial tone] Hmm","text":"[âm thanh quay số điện thoại]\n[Âm kết nối điện thoại và âm quay số] Hmm\n[전화 거는 소리]\n[전화 연결음 및 신호음] 으흠\n[phone dialing sound]\n[Phone connection tone and dial tone] Hmm","sourceUid":"merged-msb983bv-41","sourceNo":365,"viRanges":[],"koRanges":[]},{"id":497,"readerNo":498,"displayNo":94,"n":94,"kind":"sub","type":"merged","vi":"Này, tôi đây.\nCậu nói chú ấy sống ở nhà trọ hả?\nCòn người nhà nào không? - Tôi không biết.\nTôi có là nhà ngoại cảm đâu mà biết. Cần tôi tìm hiểu cho không?\nAlô?","ko":"어, 야, 난데\n지난번 그 아저씨 고시원 산다고 그랬지\n딴 가족은 없어?\n(서동주) 모르지\n(서동주) 내가 뭐 흥신소냐?\n[쿵쾅 소리] [거친 발소리]\n알아봐 줘?\n[숨가쁜 소리]\n(서동주) 여보세요?\n(서동주) 여보세요?","en":"Hey, it's me.\nYou told me that guy lives at a student hostel, right?\n-Any family members? -I don't know.\nI am not a mind reader. Do you want me to find out?\nHello?","text":"Này, tôi đây.\nCậu nói chú ấy sống ở nhà trọ hả?\nCòn người nhà nào không? - Tôi không biết.\nTôi có là nhà ngoại cảm đâu mà biết. Cần tôi tìm hiểu cho không?\nAlô?\n어, 야, 난데\n지난번 그 아저씨 고시원 산다고 그랬지\n딴 가족은 없어?\n(서동주) 모르지\n(서동주) 내가 뭐 흥신소냐?\n[쿵쾅 소리] [거친 발소리]\n알아봐 줘?\n[숨가쁜 소리]\n(서동주) 여보세요?\n(서동주) 여보세요?\nHey, it's me.\nYou told me that guy lives at a student hostel, right?\n-Any family members? -I don't know.\nI am not a mind reader. Do you want me to find out?\nHello?","sourceUid":"merged-msb9a0r6-43","sourceNo":254,"viRanges":[{"start":1681.695523,"end":1720.77553}],"koRanges":[{"start":1824.150705,"end":1853.318999}]},{"id":498,"readerNo":499,"displayNo":"N405","n":"N405","kind":"narration","type":"narration","vi":". Phòng khách (ban đêm)","ko":". 거실(밤)","en":". Living room (night)","text":". Phòng khách (ban đêm)\n. 거실(밤)\n. Living room (night)","sourceUid":"nar-msh1lwns-nipbid","sourceNo":"N405","viRanges":[],"koRanges":[]},{"id":499,"readerNo":500,"displayNo":"N406","n":"N406","kind":"narration","type":"dialogue","vi":"Kang Ina: (đi ra khỏi phòng) Này!!","ko":"강이나: (방에서 나오며) 야!!","en":"Kang Ina: (coming out of the room) Hey!!","text":"Kang Ina: (đi ra khỏi phòng) Này!!\n강이나: (방에서 나오며) 야!!\nKang Ina: (coming out of the room) Hey!!","sourceUid":"nar-msh1lxwt-xw2i37","sourceNo":"N406","viRanges":[],"koRanges":[]},{"id":500,"readerNo":501,"displayNo":"N407","n":"N407","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (cố gắng vào phòng mà không quay lại) ...","ko":"정예은: (돌아보지도 않고 방으로 들어가려 한다) ···.","en":"Jeong Ye-eun: (trying to enter the room without turning around) ...","text":"Jeong Ye-eun: (cố gắng vào phòng mà không quay lại) ...\n정예은: (돌아보지도 않고 방으로 들어가려 한다) ···.\nJeong Ye-eun: (trying to enter the room without turning around) ...","sourceUid":"nar-msh1lz5i-wl1ppd","sourceNo":"N407","viRanges":[],"koRanges":[]},{"id":501,"readerNo":502,"displayNo":"N408","n":"N408","kind":"narration","type":"dialogue","vi":"Kang Ina: (cầm lấy Jeong Ye-eun) Anh là ai?","ko":"강이나: (정예은을 낚아챈다) 너 뭐야?","en":"Kang Ina: (grabs Jeong Ye-eun) What are you?","text":"Kang Ina: (cầm lấy Jeong Ye-eun) Anh là ai?\n강이나: (정예은을 낚아챈다) 너 뭐야?\nKang Ina: (grabs Jeong Ye-eun) What are you?","sourceUid":"nar-msh1m5dt-6fsghk","sourceNo":"N408","viRanges":[],"koRanges":[]},{"id":502,"readerNo":503,"displayNo":"N409","n":"N409","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Giật cánh tay của Kang E-na ra và hét lên. Khó chịu) Cái gì?","ko":"정예은: (강이나의 팔을 뿌리치며 소리친다. 속상하다) 뭐가?","en":"Jeong Ye-eun: (Shocks away Kang E-na’s arm and shouts. Upset) What?","text":"Jeong Ye-eun: (Giật cánh tay của Kang E-na ra và hét lên. Khó chịu) Cái gì?\n정예은: (강이나의 팔을 뿌리치며 소리친다. 속상하다) 뭐가?\nJeong Ye-eun: (Shocks away Kang E-na’s arm and shouts. Upset) What?","sourceUid":"nar-msh1m6dg-q0172r","sourceNo":"N409","viRanges":[],"koRanges":[]},{"id":503,"readerNo":504,"displayNo":"N410","n":"N410","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Mặc dù vậy, tôi cũng muốn khóc vì xấu hổ.","ko":"정예은: (그렇잖아도 자괴감으로 울고 싶다.","en":"Jeong Ye-eun: (Even so, I want to cry out of shame.","text":"Jeong Ye-eun: (Mặc dù vậy, tôi cũng muốn khóc vì xấu hổ.\n정예은: (그렇잖아도 자괴감으로 울고 싶다.\nJeong Ye-eun: (Even so, I want to cry out of shame.","sourceUid":"nar-msh1md0l-ywdbe7","sourceNo":"N410","viRanges":[],"koRanges":[]},{"id":504,"readerNo":505,"displayNo":95,"n":95,"kind":"sub","type":"merged","vi":"Lát tôi gọi lại nhé. Này! - Em sao thế? - Cái gì?\nDạo gần đây em sao vậy? - Tôi làm sao?\nThằng bạn trai của em nói gì rồi?\nDù chị chả biết thằng chó đó nói gì…\nChị là cái thá gì mà gọi người ta như thế? Chị không liên quan gì hết.\nChính thằng đó hứng lên đấy. Làm rõ trước khi làm loạn đi.\nLà chị ve vãn trước. Nó nói vậy sao? Là chị ve vãn trước?","ko":"야, 나중에 내가 다시 전화할게. [발소리] 야!\n(강이나) 너 왜 그래? - 뭐가?\n너 요새 왜 그러는 건데? - 내가 뭐?\n너! 니 남친한테 무슨 얘기 들었어?\n그 새끼가 뭐라고 했는지 모르겠는데\n이 새끼 저 새끼 하지 마 니가 뭔데?\n(강이나) 난 아무 상관없거든, 그 새끼 혼자 흥분해서 그런 거야, 똑바로 알고나 지랄해\n(정예은) 니가 먼저 꼬리쳤잖아 - 그 새끼가 그러디? 내가 먼저 꼬리쳤다고","en":"I'll call you back. Hey! -Why are you acting like this? -What?\nWhy have you been acting so weird? -What did I do?\nWhat did your boyfriend tell you?\nI don't know what that bastard said, but...\nStop calling him a bastard! How dare you! I have nothing to do with him.\nThat bastard just overreacted. Get the facts straight before bitching.\nYou flirted with him first. Did he tell you that I flirted with him first?","text":"Lát tôi gọi lại nhé. Này! - Em sao thế? - Cái gì?\nDạo gần đây em sao vậy? - Tôi làm sao?\nThằng bạn trai của em nói gì rồi?\nDù chị chả biết thằng chó đó nói gì…\nChị là cái thá gì mà gọi người ta như thế? Chị không liên quan gì hết.\nChính thằng đó hứng lên đấy. Làm rõ trước khi làm loạn đi.\nLà chị ve vãn trước. Nó nói vậy sao? Là chị ve vãn trước?\n야, 나중에 내가 다시 전화할게. [발소리] 야!\n(강이나) 너 왜 그래? - 뭐가?\n너 요새 왜 그러는 건데? - 내가 뭐?\n너! 니 남친한테 무슨 얘기 들었어?\n그 새끼가 뭐라고 했는지 모르겠는데\n이 새끼 저 새끼 하지 마 니가 뭔데?\n(강이나) 난 아무 상관없거든, 그 새끼 혼자 흥분해서 그런 거야, 똑바로 알고나 지랄해\n(정예은) 니가 먼저 꼬리쳤잖아 - 그 새끼가 그러디? 내가 먼저 꼬리쳤다고\nI'll call you back. Hey! -Why are you acting like this? -What?\nWhy have you been acting so weird? -What did I do?\nWhat did your boyfriend tell you?\nI don't know what that bastard said, but...\nStop calling him a bastard! How dare you! I have nothing to do with him.\nThat bastard just overreacted. Get the facts straight before bitching.\nYou flirted with him first. Did he tell you that I flirted with him first?","sourceUid":"merged-msb9duyg-44","sourceNo":268,"viRanges":[{"start":1720.77553,"end":1750.849051}],"koRanges":[{"start":1853.318999,"end":1883.56196}]},{"id":505,"readerNo":506,"displayNo":"N411","n":"N411","kind":"narration","type":"narration","vi":"Song Ji-won và Yoo Eun-jae bước ra khỏi phòng của họ.","ko":"송지원과 유은재가 각자의 방에서 나온다.","en":"Song Ji-won and Yoo Eun-jae come out of their respective rooms.","text":"Song Ji-won và Yoo Eun-jae bước ra khỏi phòng của họ.\n송지원과 유은재가 각자의 방에서 나온다.\nSong Ji-won and Yoo Eun-jae come out of their respective rooms.","sourceUid":"nar-msh1nvhq-0hqjm2","sourceNo":"N411","viRanges":[],"koRanges":[]},{"id":506,"readerNo":507,"displayNo":"N412","n":"N412","kind":"narration","type":"narration","vi"
