t":"Tuy nhiên, với thần kinh căng thẳng, họ ngồi chéo nhau và ăn.\n그러나 신경은 곤두세운 채 대각선으로 마주 앉아 밥을 먹는다.\nHowever, with their nerves tense, they sit diagonally across from each other and eat.","sourceUid":"nar-msh1qeuw-l1qqkk","sourceNo":"N424","viRanges":[],"koRanges":[]},{"id":524,"readerNo":525,"displayNo":"N425","n":"N425","kind":"narration","type":"narration","vi":"Jeong Ye-eun làm món hầm, món nêm và món ăn kèm;","ko":"정예은은 찌개와 무침과 반찬을,","en":"Jeong Ye-eun makes stews, seasoned dishes, and side dishes;","text":"Jeong Ye-eun làm món hầm, món nêm và món ăn kèm;\n정예은은 찌개와 무침과 반찬을,\nJeong Ye-eun makes stews, seasoned dishes, and side dishes;","sourceUid":"nar-msh1qfw3-l33x22","sourceNo":"N425","viRanges":[],"koRanges":[]},{"id":525,"readerNo":526,"displayNo":"N426","n":"N426","kind":"narration","type":"narration","vi":"Kang Ina ăn cà phê, bánh mì và salad.","ko":"강이나는 커피와 빵과 샐러드를 먹는다.","en":"Kang Ina eats coffee, bread, and salad.","text":"Kang Ina ăn cà phê, bánh mì và salad.\n강이나는 커피와 빵과 샐러드를 먹는다.\nKang Ina eats coffee, bread, and salad.","sourceUid":"nar-msh1qhcy-20xzid","sourceNo":"N426","viRanges":[],"koRanges":[]},{"id":526,"readerNo":527,"displayNo":"N427","n":"N427","kind":"narration","type":"narration","vi":"Cảm nhận được không khí cay đắng, Eunjae Yoo đến gần và mở tủ lạnh.","ko":"유은재가 살벌한 공기를 느끼며 쭈뼛쭈 뼛 다가와 냉장고를 연다.","en":"Feeling the bitter air, Eunjae Yoo approaches and opens the refrigerator.","text":"Cảm nhận được không khí cay đắng, Eunjae Yoo đến gần và mở tủ lạnh.\n유은재가 살벌한 공기를 느끼며 쭈뼛쭈 뼛 다가와 냉장고를 연다.\nFeeling the bitter air, Eunjae Yoo approaches and opens the refrigerator.","sourceUid":"nar-msh1qjri-a7av69","sourceNo":"N427","viRanges":[],"koRanges":[]},{"id":527,"readerNo":528,"displayNo":"N428","n":"N428","kind":"narration","type":"dialogue","vi":"Eunjae Yoo: (Tôi tự hỏi có phải vậy không)...","ko":"유은재: (그럴까 싶은데) ···.","en":"Eunjae Yoo: (I wonder if so)...","text":"Eunjae Yoo: (Tôi tự hỏi có phải vậy không)...\n유은재: (그럴까 싶은데) ···.\nEunjae Yoo: (I wonder if so)...","sourceUid":"nar-msh1qu35-jze0nz","sourceNo":"N428","viRanges":[],"koRanges":[]},{"id":528,"readerNo":529,"displayNo":101,"n":101,"kind":"sub","type":"merged","vi":"Xới cơm đi. Ăn cùng đi.--Vâng\nNuốt nổi cơm buổi sáng sao? Ăn bánh mì đi.","ko":"(정예은) 밥만 퍼서 앉어, 같이 먹자--네\n아침부터 밥이 넘어가냐 빵 먹어","en":"Just get yourself a bowl of rice. Let's eat together.--Okay.\nHow can you eat rice in the morning? Get some bread.","text":"Xới cơm đi. Ăn cùng đi.--Vâng\nNuốt nổi cơm buổi sáng sao? Ăn bánh mì đi.\n(정예은) 밥만 퍼서 앉어, 같이 먹자--네\n아침부터 밥이 넘어가냐 빵 먹어\nJust get yourself a bowl of rice. Let's eat together.--Okay.\nHow can you eat rice in the morning? Get some bread.","sourceUid":"merged-msbelkqd-51","sourceNo":284,"viRanges":[{"start":1811,"end":1825.663303}],"koRanges":[{"start":1948,"end":1957.814043}]},{"id":529,"readerNo":530,"displayNo":"N429","n":"N429","kind":"narration","type":"dialogue","vi":"Kang Ina: (Jeong Ye-eun tự nói chuyện với chính mình dù có nói hay không)","ko":"강이나: (정예은이 말하거나 말거나 혼잣말한다)","en":"Kang Ina: (Jeong Ye-eun talks to herself whether she speaks or not)","text":"Kang Ina: (Jeong Ye-eun tự nói chuyện với chính mình dù có nói hay không)\n강이나: (정예은이 말하거나 말거나 혼잣말한다)\nKang Ina: (Jeong Ye-eun talks to herself whether she speaks or not)","sourceUid":"nar-msh1r4yt-b9j7ep","sourceNo":"N429","viRanges":[],"koRanges":[]},{"id":530,"readerNo":531,"displayNo":"N430","n":"N430","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (nói to để không biết Kang E-na có nói hay không)","ko":"정예은: (강이나가 말하거나 말거나 지지 않기 위해 큰소리로)","en":"Jeong Ye-eun: (loudly so as not to lose whether Kang E-na speaks or not)","text":"Jeong Ye-eun: (nói to để không biết Kang E-na có nói hay không)\n정예은: (강이나가 말하거나 말거나 지지 않기 위해 큰소리로)\nJeong Ye-eun: (loudly so as not to lose whether Kang E-na speaks or not)","sourceUid":"nar-msh1rcwg-47qe9j","sourceNo":"N430","viRanges":[],"koRanges":[]},{"id":531,"readerNo":532,"displayNo":102,"n":102,"kind":"sub","type":"merged","vi":"[Đập thìa]\nBánh mì trắng có hại cho sức khỏe, lượng calo còn cao nữa.\nQuan tâm đến calo mà cân thì cứ tăng vù vù? [Thành tiếng]\nCái này không học cũng phải biết chứ?\nCũng đúng, suốt ngày chỉ biết đọc báo người nổi tiếng, rồi đi mua sắm mà.","ko":"[숟가락 '탁탁' 치면서]\n흰 빵이 몸에 얼마나 안 좋은데, 칼로리 폭탄에다가\n칼로리 계산만 하면 뭐해 살만 디룩디룩 찌는데. [큰 소리로]\n배운 게 없으니 아는 게 있어야지\n하긴 맨날 연예인 기사나 클릭하고, 쇼핑몰이나 들락날락","en":"[Tapping the spoon]\nWhite bread is really bad for you and it's a calorie bomb, too.\nWho cares about calories when you're always getting so fat? [Out loud]\nIt's because you're not educated, so you know nothing.\nYou read only entertainment news and you're always shopping.","text":"[Đập thìa]\nBánh mì trắng có hại cho sức khỏe, lượng calo còn cao nữa.\nQuan tâm đến calo mà cân thì cứ tăng vù vù? [Thành tiếng]\nCái này không học cũng phải biết chứ?\nCũng đúng, suốt ngày chỉ biết đọc báo người nổi tiếng, rồi đi mua sắm mà.\n[숟가락 '탁탁' 치면서]\n흰 빵이 몸에 얼마나 안 좋은데, 칼로리 폭탄에다가\n칼로리 계산만 하면 뭐해 살만 디룩디룩 찌는데. [큰 소리로]\n배운 게 없으니 아는 게 있어야지\n하긴 맨날 연예인 기사나 클릭하고, 쇼핑몰이나 들락날락\n[Tapping the spoon]\nWhite bread is really bad for you and it's a calorie bomb, too.\nWho cares about calories when you're always getting so fat? [Out loud]\nIt's because you're not educated, so you know nothing.\nYou read only entertainment news and you're always shopping.","sourceUid":"merged-msbeq7sj-52","sourceNo":288,"viRanges":[{"start":1825.663303,"end":1838.24676}],"koRanges":[{"start":1957.814043,"end":1970.517551}]},{"id":532,"readerNo":533,"displayNo":"N431","n":"N431","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (đột nhiên trở nên khó chịu với Yoo Eun-jae)","ko":"정예은: (갑자기 유은재에게 신경질 부린다)","en":"Jeong Ye-eun: (suddenly becomes irritated with Yoo Eun-jae)","text":"Jeong Ye-eun: (đột nhiên trở nên khó chịu với Yoo Eun-jae)\n정예은: (갑자기 유은재에게 신경질 부린다)\nJeong Ye-eun: (suddenly becomes irritated with Yoo Eun-jae)","sourceUid":"nar-msh1rpnw-1vk81f","sourceNo":"N431","viRanges":[],"koRanges":[]},{"id":533,"readerNo":534,"displayNo":"N432","n":"N432","kind":"narration","type":"dialogue","vi":"Eunjae Yoo: (Tại sao thử thách này lại xảy ra với tôi?)...","ko":"유은재: (어째서 나에게 이런 시련이) ···.","en":"Eunjae Yoo: (Why is this ordeal happening to me?)...","text":"Eunjae Yoo: (Tại sao thử thách này lại xảy ra với tôi?)...\n유은재: (어째서 나에게 이런 시련이) ···.\nEunjae Yoo: (Why is this ordeal happening to me?)...","sourceUid":"nar-msh1rv00-6frn3x","sourceNo":"N432","viRanges":[],"koRanges":[]},{"id":534,"readerNo":535,"displayNo":103,"n":103,"kind":"sub","type":"merged","vi":"Sống như thế là tốt sao?\nBéo rồi gầy rồi lại béo.\nỪ đấy, vẫn sống tốt. - Tôi đâu có nói chị!\nChị cũng thế!\nThế em ăn hay không đây? - Em ăn cái gì?","ko":"그렇게 살면 좋을까?\n쪘다-뺐다-쪘다-뺏다\n그래, 좋다!-너한테 물어본 거 아니거든!\n나 너한테 대답한 거 아니야\n그래서 먹을 거야, 말 거야?-너 뭐 먹을 거야?","en":"I wonder if that is a good life.\nYou and your yo-yo diets.\nI like how I live. -I wasn't talking to you!\nAnd neither was I.\nSo, are you going to eat, or not? -What are you going to eat?","text":"Sống như thế là tốt sao?\nBéo rồi gầy rồi lại béo.\nỪ đấy, vẫn sống tốt. - Tôi đâu có nói chị!\nChị cũng thế!\nThế em ăn hay không đây? - Em ăn cái gì?\n그렇게 살면 좋을까?\n쪘다-뺐다-쪘다-뺏다\n그래, 좋다!-너한테 물어본 거 아니거든!\n나 너한테 대답한 거 아니야\n그래서 먹을 거야, 말 거야?-너 뭐 먹을 거야?\nI wonder if that is a good life.\nYou and your yo-yo diets.\nI like how I live. -I wasn't talking to you!\nAnd neither was I.\nSo, are you going to eat, or not? -What are you going to eat?","sourceUid":"merged-msbevhp6-53","sourceNo":293,"viRanges":[{"start":1838.24676,"end":1850.105227}],"koRanges":[{"start":1970.517551,"end":1981.332453}]},{"id":535,"readerNo":536,"displayNo":"N433","n":"N433","kind":"narration","type":"narration","vi":"Lúc đó, Song Ji-won bước ra khỏi phòng, chuẩn bị ra ngoài.","ko":"그때, 송지원이 외출 준비를 하고 방에서 나온다.","en":"At that time, Song Ji-won comes out of the room, getting ready to go out.","text":"Lúc đó, Song Ji-won bước ra khỏi phòng, chuẩn bị ra ngoài.\n그때, 송지원이 외출 준비를 하고 방에서 나온다.\nAt that time, Song Ji-won comes out of the room, getting ready to go out.","sourceUid":"nar-msh1s0pn-04hsin","sourceNo":"N433","viRanges":[],"koRanges":[]},{"id":536,"readerNo":537,"displayNo":"N434","n":"N434","kind":"narration","type":"dialogue","vi":"Eunjae Yoo: (Giống như gặp được vị cứu tinh) Tiền bối! Bạn đang đi đâu?","ko":"유은재: (구원자를 만난 듯) 선배! 어디 가요?","en":"Eunjae Yoo: (As if meeting a savior) Senior! Where are you going?","text":"Eunjae Yoo: (Giống như gặp được vị cứu tinh) Tiền bối! Bạn đang đi đâu?\n유은재: (구원자를 만난 듯) 선배! 어디 가요?\nEunjae Yoo: (As if meeting a savior) Senior! Where are you going?","sourceUid":"nar-msh1s4je-rdaxb1","sourceNo":"N434","viRanges":[],"koRanges":[]},{"id":537,"readerNo":538,"displayNo":"N435","n":"N435","kind":"narration","type":"dialogue","vi":"Song Ji-won: (Nhìn từ Yoo Eun-jae đến Kang hoặc Jeong Ye-eun)","ko":"송지원: (유은재에게서 강이나 정예은에게로 시선 돌리며)","en":"Song Ji-won: (Looking from Yoo Eun-jae to Kang or Jeong Ye-eun)","text":"Song Ji-won: (Nhìn từ Yoo Eun-jae đến Kang hoặc Jeong Ye-eun)\n송지원: (유은재에게서 강이나 정예은에게로 시선 돌리며)\nSong Ji-won: (Looking from Yoo Eun-jae to Kang or Jeong Ye-eun)","sourceUid":"nar-msh1sluv-jjg03m","sourceNo":"N435","viRanges":[],"koRanges":[]},{"id":538,"readerNo":539,"displayNo":104,"n":104,"kind":"sub","type":"merged","vi":"[Tiếng bước chân]\nChị đi đâu vậy? - Phòng tắm hơi.\nCho em đi cùng với. Em cần kì ghét. Lâu rồi không kì cọ, trắng xóa người rồi.\nChờ em lát. Em quay lại ngay.\n[tiếng bước chân]","ko":"[발걸음 소리]\n선배! 어디 가요?-목욕탕\n같이 가요, 나 때 밀어야 돼 때를 안 밀어서 각질이 막 하얗게...\n잠깐 기다려요 금방 나올게요\n[쿵쿵 발소리]","en":"[Sound of footsteps]\n-Where are you going? -The public sauna.\nI'll come with you! I need to exfoliate. I haven't done it in a while.\nWait for me. I'll be right back.\n[Sound of pounding footsteps]","text":"[Tiếng bước chân]\nChị đi đâu vậy? - Phòng tắm hơi.\nCho em đi cùng với. Em cần kì ghét. Lâu rồi không kì cọ, trắng xóa người rồi.\nChờ em lát. Em quay lại ngay.\n[tiếng bước chân]\n[발걸음 소리]\n선배! 어디 가요?-목욕탕\n같이 가요, 나 때 밀어야 돼 때를 안 밀어서 각질이 막 하얗게...\n잠깐 기다려요 금방 나올게요\n[쿵쿵 발소리]\n[Sound of footsteps]\n-Where are you going? -The public sauna.\nI'll come with you! I need to exfoliate. I haven't done it in a while.\nWait for me. I'll be right back.\n[Sound of pounding footsteps]","sourceUid":"merged-msbex5oz-54","sourceNo":293,"viRanges":[{"start":1850.105227,"end":1860.522296}],"koRanges":[{"start":1981.103038,"end":1992.844582}]},{"id":539,"readerNo":540,"displayNo":105,"n":105,"kind":"sub","type":"merged","vi":"Sao hai người lại giận cá chém thớt thế?\nVậy mà còn cùng ăn sáng với nhau.\nSao chị Ye Eun lại yêu người như thế nhỉ?\nChị ấy xinh xắn, hay cười, lại còn rất dễ thương nữa.\nĐáng lẽ chị ấy nên gặp người tốt hơn.","ko":"[문 소리] 애를 아주 그냥... 눈칫밥을 멕이냐, 그렇게, 에휴...\n(송지원) 둘이 꼭 밥을 같이 먹어 [발소리]\n예은 선배는 그런 연애를 하나 몰라요\n얼굴 예쁘고, 잘 웃고, 애교 많고\n더 좋은 남자 만나면 좋을 텐데","en":"Why are you torturing her like this?\nI don't know why you are eating together.\nWhy does Ye-Eun have to date a guy like that?\nI mean, she's pretty, has a great smile, and is really cute.\nIt would be nice if she would date a better guy.","text":"Sao hai người lại giận cá chém thớt thế?\nVậy mà còn cùng ăn sáng với nhau.\nSao chị Ye Eun lại yêu người như thế nhỉ?\nChị ấy xinh xắn, hay cười, lại còn rất dễ thương nữa.\nĐáng lẽ chị ấy nên gặp người tốt hơn.\n[문 소리] 애를 아주 그냥... 눈칫밥을 멕이냐, 그렇게, 에휴...\n(송지원) 둘이 꼭 밥을 같이 먹어 [발소리]\n예은 선배는 그런 연애를 하나 몰라요\n얼굴 예쁘고, 잘 웃고, 애교 많고\n더 좋은 남자 만나면 좋을 텐데\nWhy are you torturing her like this?\nI don't know why you are eating together.\nWhy does Ye-Eun have to date a guy like that?\nI mean, she's pretty, has a great smile, and is really cute.\nIt would be nice if she would date a better guy.","sourceUid":"merged-msbf11tb-55","sourceNo":301,"viRanges":[{"start":1860.522296,"end":1886.403838}],"koRanges":[{"start":1992.844582,"end":2019.319288}]},{"id":540,"readerNo":541,"displayNo":"N436","n":"N436","kind":"narration","type":"narration","vi":". Đường (ngày)","ko":". 거리(낮)","en":". Street (day)","text":". Đường (ngày)\n. 거리(낮)\n ật tốt nếu gặp được một người đàn ông tốt hơn...","ko":"더 좋은 남자 만나면 좋을 텐데···.","en":"It would be nice to meet a better man...","text":"Sẽ thật tốt nếu gặp được một người đàn ông tốt hơn...\n더 좋은 남자 만나면 좋을 텐데···.\nIt would be nice to meet a better man...","sourceUid":"nar-msh1usdp-8079y9","sourceNo":"N441","viRanges":[],"koRanges":[]},{"id":546,"readerNo":547,"displayNo":106,"n":106,"kind":"sub","type":"merged","vi":"Em không biết chuyện của chị gái Ye Eun đúng không?\n- Chị ấy có chị ạ? - Ừ.\nNghe nói giờ đang du học Đức.\nLà thiên tài, từ bé đã không phải dạng vừa rồi.\nNghe bảo năm nay được bằng tiến sĩ thì là người trẻ tuổi nhất nước ta.","ko":"너 예은이 언니 얘기 모르지?\n예은 선배 언니 있어요? - 어\n어, 지금 독일에 유학 가 있는데\n엄청난 수재래 머리는 또 뭐, 장난 아니었대\n올해 박사 따면 우리나라 최연소라던데?","en":"You don't know the story about Ye-Eun's older sister, right?\n-She has an older sister? -Yeah.\nShe's studying abroad in Germany right now.\nApparently, she's like a super-genius since she was little.\nAnd she'll be getting her doctorate this year.","text":"Em không biết chuyện của chị gái Ye Eun đúng không?\n- Chị ấy có chị ạ? - Ừ.\nNghe nói giờ đang du học Đức.\nLà thiên tài, từ bé đã không phải dạng vừa rồi.\nNghe bảo năm nay được bằng tiến sĩ thì là người trẻ tuổi nhất nước ta.\n너 예은이 언니 얘기 모르지?\n예은 선배 언니 있어요? - 어\n어, 지금 독일에 유학 가 있는데\n엄청난 수재래 머리는 또 뭐, 장난 아니었대\n올해 박사 따면 우리나라 최연소라던데?\nYou don't know the story about Ye-Eun's older sister, right?\n-She has an older sister? -Yeah.\nShe's studying abroad in Germany right now.\nApparently, she's like a super-genius since she was little.\nAnd she'll be getting her doctorate this year.","sourceUid":"merged-msbf3v91-56","sourceNo":306,"viRanges":[{"start":1886.403838,"end":1902.57881}],"koRanges":[{"start":2019.319288,"end":2035.641027}]},{"id":547,"readerNo":548,"displayNo":107,"n":107,"kind":"sub","type":"merged","vi":"Chị ấy bao nhiêu tuổi? - Bằng tuổi với Ye Eun.\nHọ là chị em sinh đôi. - Thật ấy ạ?\nChị Ye Eun là sinh đôi. - Ừ.\nSinh đôi khác trứng, xinh đẹp và cao hơn Ye Eun nhiều.\nVừa xinh vừa học giỏi nữa.","ko":"몇 살인데요? - 예은이랑 동갑\n쌍둥이야 - 네? 진짜요?\n예은 선배 쌍둥이였어요? - 응\n이란성인데 얼굴도 그쪽이 훨씬 이쁘대, 키도 크고\n얼굴도 예뻐, 공부도 잘해","en":"-How old is she? -The same age as Ye-Eun.\nThey are twins. -Wait, really?\nYe-Eun has a twin? -Yeah.\nThey're fraternal twins, but she's a lot prettier and taller.\nShe's pretty and super smart.","text":"Chị ấy bao nhiêu tuổi? - Bằng tuổi với Ye Eun.\nHọ là chị em sinh đôi. - Thật ấy ạ?\nChị Ye Eun là sinh đôi. - Ừ.\nSinh đôi khác trứng, xinh đẹp và cao hơn Ye Eun nhiều.\nVừa xinh vừa học giỏi nữa.\n몇 살인데요? - 예은이랑 동갑\n쌍둥이야 - 네? 진짜요?\n예은 선배 쌍둥이였어요? - 응\n이란성인데 얼굴도 그쪽이 훨씬 이쁘대, 키도 크고\n얼굴도 예뻐, 공부도 잘해\n-How old is she? -The same age as Ye-Eun.\nThey are twins. -Wait, really?\nYe-Eun has a twin? -Yeah.\nThey're fraternal twins, but she's a lot prettier and taller.\nShe's pretty and super smart.","sourceUid":"merged-msbf652k-57","sourceNo":308,"viRanges":[{"start":1902.57881,"end":1918.116135}],"koRanges":[{"start":2035.641027,"end":2050.702109}]},{"id":548,"readerNo":549,"displayNo":108,"n":108,"kind":"sub","type":"merged","vi":"Có người chị như vậy, Ye Eun được chiều chuộng chắc?\nMọi quan tâm đều dành cho người chị rồi.\nYe Eun có chết cũng không thể vượt qua sự hoàn hảo ấy.\nTrong tình huống như thế thì lòng tự tôn cao sao được?","ko":"쌍둥이가 그래버리니까 어려서부터 좀 치였겠냐?\n모든 관심이 그쪽으로 쏠린 거지\n예은이가 죽을 둥 살 둥 해봐야 넘사벽인 거구\n뭐, 그런 상황에서 자존감이 싹트겠냐?","en":"Growing up as a twin, I am sure Ye-Eun felt left out.\nHer sister got all the attention.\nAnd it's not like she could ever surpass her sister in any way.\nIt's natural that she has low self-esteem.","text":"Có người chị như vậy, Ye Eun được chiều chuộng chắc?\nMọi quan tâm đều dành cho người chị rồi.\nYe Eun có chết cũng không thể vượt qua sự hoàn hảo ấy.\nTrong tình huống như thế thì lòng tự tôn cao sao được?\n쌍둥이가 그래버리니까 어려서부터 좀 치였겠냐?\n모든 관심이 그쪽으로 쏠린 거지\n예은이가 죽을 둥 살 둥 해봐야 넘사벽인 거구\n뭐, 그런 상황에서 자존감이 싹트겠냐?\nGrowing up as a twin, I am sure Ye-Eun felt left out.\nHer sister got all the attention.\nAnd it's not like she could ever surpass her sister in any way.\nIt's natural that she has low self-esteem.","sourceUid":"merged-msbf8108-58","sourceNo":312,"viRanges":[{"start":1918.116135,"end":1932.98513}],"koRanges":[{"start":2050.702109,"end":2064.937474}]},{"id":549,"readerNo":550,"displayNo":109,"n":109,"kind":"sub","type":"merged","vi":"Cũng đúng.\nNhững người không có lòng tự tôn khi yêu sai người sẽ thành như thế.\nEm cứ nghĩ chị ấy lớn lên trong gia đình hạnh phúc.\nThế mới nói đó.\nMà lạ nhé.\nChị ấy bảo chị ấy là con một mà nhỉ?","ko":"그렇죠\n자존감 없는 애들이 연애 잘못하면 그렇게 되는 거야\n(유은재) 어휴\n예은 선배는 되게 좋은 집에서 되게 행복하게 자란 줄 알았는데\n[가벼운 한숨소리] 그러니까 말이다\n어? 이상하다? [매미 소리]\n예은 선배 외동딸이랬는데?","en":"That's true.\nThis is what happens when people with no confidence date the wrong person.\nI thought Ye-Eun grew up in a nice house with a happy family.\nI thought so, too.\nThat's weird.\nYe-Eun said that she was an only child.","text":"Cũng đúng.\nNhững người không có lòng tự tôn khi yêu sai người sẽ thành như thế.\nEm cứ nghĩ chị ấy lớn lên trong gia đình hạnh phúc.\nThế mới nói đó.\nMà lạ nhé.\nChị ấy bảo chị ấy là con một mà nhỉ?\n그렇죠\n자존감 없는 애들이 연애 잘못하면 그렇게 되는 거야\n(유은재) 어휴\n예은 선배는 되게 좋은 집에서 되게 행복하게 자란 줄 알았는데\n[가벼운 한숨소리] 그러니까 말이다\n어? 이상하다? [매미 소리]\n예은 선배 외동딸이랬는데?\nThat's true.\nThis is what happens when people with no confidence date the wrong person.\nI thought Ye-Eun grew up in a nice house with a happy family.\nI thought so, too.\nThat's weird.\nYe-Eun said that she was an only child.","sourceUid":"merged-msbfag0l-61","sourceNo":321,"viRanges":[{"start":1932.98513,"end":1953.153981}],"koRanges":[{"start":2064.937474,"end":2086.064739}]},{"id":550,"readerNo":551,"displayNo":"N442","n":"N442","kind":"narration","type":"dialogue","vi":"Song Ji-won: (cười trong khi tự hỏi phải làm gì)...","ko":"송지원: (어쩔까 하다가 씨익 웃는다) ···.","en":"Song Ji-won: (laughs while wondering what to do)...","text":"Song Ji-won: (cười trong khi tự hỏi phải làm gì)...\n송지원: (어쩔까 하다가 씨익 웃는다) ···.\nSong Ji-won: (laughs while wondering what to do)...","sourceUid":"nar-msh1vl8o-kyvk2n","sourceNo":"N442","viRanges":[],"koRanges":[]},{"id":551,"readerNo":552,"displayNo":110,"n":110,"kind":"sub","type":"merged","vi":"Chị nói dối đấy hả?\nThật là. Sao chị lại nói dối chuyện đó?\nEm nghe chị kể xong thì nghĩ Ye Eun như thế cũng hiểu được, đúng không?\nÝ chị là,\ndù chuyện của chị không đúng, nhưng ai cũng có sự tình riêng cả.","ko":"뭐예요-거짓말한 거예요?\n아우 진짜 왜 그런 거짓말을 해요?\n너 방금 내 얘기 듣고 예은이가 그럴 만도 하다-싶었지?\n그러니까-내 말은\n내 얘기가 정답은 아니라도 사람마다-죄다 사정이란 게 있다는 거야","en":"Did you just lie to me?\nWhy would you lie to me about something like that?\nAfter hearing my story, you thought it would've been the case.\nSo my point is,\neven though my story wasn't true, everyone has their own reasons.","text":"Chị nói dối đấy hả?\nThật là. Sao chị lại nói dối chuyện đó?\nEm nghe chị kể xong thì nghĩ Ye Eun như thế cũng hiểu được, đúng không?\nÝ chị là,\ndù chuyện của chị không đúng, nhưng ai cũng có sự tình riêng cả.\n뭐예요-거짓말한 거예요?\n아우 진짜 왜 그런 거짓말을 해요?\n너 방금 내 얘기 듣고 예은이가 그럴 만도 하다-싶었지?\n그러니까-내 말은\n내 얘기가 정답은 아니라도 사람마다-죄다 사정이란 게 있다는 거야\nDid you just lie to me?\nWhy would you lie to me about something like that?\nAfter hearing my story, you thought it would've been the case.\nSo my point is,\neven though my story wasn't true, everyone has their own reasons.","sourceUid":"merged-msbfbjvq-62","sourceNo":323,"viRanges":[{"start":1953.153981,"end":1975.706682}],"koRanges":[{"start":2086.064739,"end":2108.175057}]},{"id":552,"readerNo":553,"displayNo":"N443","n":"N443","kind":"narration","type":"dialogue","vi":"Song Ji-won: (vẻ mặt nghiêm túc)","ko":"송지원: (진지한 얼굴로 쓰윽 보며)","en":"Song Ji-won: (looking wryly with a serious face)","text":"Song Ji-won: (vẻ mặt nghiêm túc)\n송지원: (진지한 얼굴로 쓰윽 보며)\nSong Ji-won: (looking wryly with a serious face)","sourceUid":"nar-msh1vtse-or9m26","sourceNo":"N443","viRanges":[],"koRanges":[]},{"id":553,"readerNo":554,"displayNo":111,"n":111,"kind":"sub","type":"merged","vi":"Trước khi biết sự tình ấy, ta không nên phán xét bất cứ thứ gì cả.\nKhông những Ye Eun mà cả chị Kang và chị Yoon nữa.\nNgay cả em cũng có những chuyện như thế mà.\nNgười đời không hiểu nổi, nhưng em vẫn không thể làm khác.","ko":"그 사정 알기 전까진 이렇다 저렇다 말하면 안 된다는 거구\n예은이뿐만 아니라 강 언니도 그렇구, 윤 선배도 그렇구\n너만 해도 그런 거 하나쯤은 있을 거 아니야\n남들은 도저히 이해 못 해도 너는 그렇게밖에 할 수 없었던 어떤 거","en":"You can't judge people until you know their reasons.\nIt's not just Ye-Eun, but also Kang and Yoon.\nI'm sure you have something like that about you, too.\nThere's something that no one can understand about you.","text":"Trước khi biết sự tình ấy, ta không nên phán xét bất cứ thứ gì cả.\nKhông những Ye Eun mà cả chị Kang và chị Yoon nữa.\nNgay cả em cũng có những chuyện như thế mà.\nNgười đời không hiểu nổi, nhưng em vẫn không thể làm khác.\n그 사정 알기 전까진 이렇다 저렇다 말하면 안 된다는 거구\n예은이뿐만 아니라 강 언니도 그렇구, 윤 선배도 그렇구\n너만 해도 그런 거 하나쯤은 있을 거 아니야\n남들은 도저히 이해 못 해도 너는 그렇게밖에 할 수 없었던 어떤 거\nYou can't judge people until you know their reasons.\nIt's not just Ye-Eun, but also Kang and Yoon.\nI'm sure you have something like that about you, too.\nThere's something that no one can understand about you.","sourceUid":"merged-msbfeljp-63","sourceNo":327,"viRanges":[{"start":1975.706682,"end":1992.517929}],"koRanges":[{"start":2108.175057,"end":2124.873121}]},{"id":554,"readerNo":555,"displayNo":112,"n":112,"kind":"sub","type":"merged","vi":"Nên là, không nên phán xét đúng sai một cách tùy tiện chuyện của người khác.\n[Âm nhạc êm dịu và nhẹ nhàng]\nSao vậy? Chị làm ra vẻ ta đây quá hả? Không ạ.\nChỉ là chị rất…\n- Rất gì? - Rất ngầu ấy ạ.\nKhác với thường ngày.","ko":"그러니까-남의 일에 대해선 함부로 이게 옳다-그르다-말...\n[잔잔하고 부드러운 음악]\n왜?-내가 너무 잘난 체했냐?-아뇨!\n그냥 되게, 선배가 되게...\n되게 뭐? - 멋있어서요\n평소와는 달리","en":"That's why you can't judge people willy-nilly...\n[Calm and soft music]\nWhat? Was I acting way too holier-than-thou? No.\nI just feel that you're really...\n-Really what? -You are cool.\nIt's unusual.","text":"Nên là, không nên phán xét đúng sai một cách tùy tiện chuyện của người khác.\n[Âm nhạc êm dịu và nhẹ nhàng]\nSao vậy? Chị làm ra vẻ ta đây quá hả? Không ạ.\nChỉ là chị rất…\n- Rất gì? - Rất ngầu ấy ạ.\nKhác với thường ngày.\n그러니까-남의 일에 대해선 함부로 이게 옳다-그르다-말...\n[잔잔하고 부드러운 음악]\n왜?-내가 너무 잘난 체했냐?-아뇨!\n그냥 되게, 선배가 되게...\n되게 뭐? - 멋있어서요\n평소와는 달리\nThat's why you can't judge people willy-nilly...\n[Calm and soft music]\nWhat? Was I acting way too holier-than-thou? No.\nI just feel that you're really...\n-Really what? -You are cool.\nIt's unusual.","sourceUid":"merged-msbfggry-64","sourceNo":336,"viRanges":[{"start":1992.517929,"end":2015.215435}],"koRanges":[{"start":2124.873121,"end":2148.537144}]},{"id":555,"readerNo":556,"displayNo":"N444","n":"N444","kind":"narration","type":"dialogue","vi":"Eunjae Yoo: (Dừng bước mà không nhận ra) ...","ko":"유은재: (자기도 모르게 걸음을 멈춘다) ···.","en":"Eunjae Yoo: (Stops walking without realizing it) ...","text":"Eunjae Yoo: (Dừng bước mà không nhận ra) ...\n유은재: (자기도 모르게 걸음을 멈춘다) ···.\nEunjae Yoo: (Stops walking without realizing it) ...","sourceUid":"nar-msh1wnla-k08gna","sourceNo":"N444","viRanges":[],"koRanges":[]},{"id":556,"readerNo":557,"displayNo":113,"n":113,"kind":"sub","type":"merged","vi":"Thế thường ngày chị thế nào?\nThường ngày hòa nhã, nhưng giờ lại rất hiểu biết hả?\nÝ em là vậy phải không? Đúng không nào?\nEm cảm động với cả sự hiểu biết của chị sao?\nĐúng rồi, đi kì cọ ghét thôi nào.","ko":"(송지원) [웃음 소리] 평소엔 내가 어땠는데?\n평소엔 우아했는데 지금은 지적이야?\n그 뜻이지? 그 뜻이야?\n내가 한 '지적'하지 니가 나의 지성에 감명을 받았구나\n아하, 그렇지, 때 밀러 가자","en":"What am I usually like, then?\nUsually, I am gracious, but I am intellectual right now?\nThat's what you meant, right? You totally respect me now.\nYou're totally in awe of my intellect, aren't you?\nAll right, let's get you exfoliated.","text":"Thế thường ngày chị thế nào?\nThường ngày hòa nhã, nhưng giờ lại rất hiểu biết hả?\nÝ em là vậy phải không? Đúng không nào?\nEm cảm động với cả sự hiểu biết của chị sao?\nĐúng rồi, đi kì cọ ghét thôi nào.\n(송지원) [웃음 소리] 평소엔 내가 어땠는데?\n평소엔 우아했는데 지금은 지적이야?\n그 뜻이지? 그 뜻이야?\n내가 한 '지적'하지 니가 나의 지성에 감명을 받았구나\n아하, 그렇지, 때 밀러 가자\nWhat am I usually like, then?\nUsually, I am gracious, but I am intellectual right now?\nThat's what you meant, right? You totally respect me now.\nYou're totally in awe of my intellect, aren't you?\nAll right, let's get you exfoliated.","sourceUid":"merged-msbfjtpq-65","sourceNo":338,"viRanges":[{"start":2015.215435,"end":2034.154211}],"koRanges":[{"start":2148.537144,"end":2169.124536}]},{"id":557,"readerNo":558,"displayNo":"N445","n":"N445","kind":"narration","type":"dialogue","vi":"Song Ji-won: (Tôi chớp mắt vì đó là một lời khen chân thành)...","ko":"송지원: (정색하는 칭찬이라니 눈만 끔뻑인다) ···.","en":"Song Ji-won: (I blink because it’s an honest compliment)...","text":"Song Ji-won: (Tôi chớp mắt vì đó là một lời khen chân thành)...\n송지원: (정색하는 칭찬이라니 눈만 끔뻑인다) ···.\nSong Ji-won: (I blink because it’s an honest compliment)...","sourceUid":"nar-msh1xbaj-iszl2l","sourceNo":"N445","viRanges":[],"koRanges":[]},{"id":558,"readerNo":559,"displayNo":"N446","n":"N446","kind":"narration","type":"dialogue","vi":"Eunjae Yoo: (Tôi cảm thấy xấu hổ sau khi nói điều này) Không như mọi khi...","ko":"유은재: (말해놓고 나니 무안하다) 평소와는 달리···.","en":"Eunjae Yoo: (I feel embarrassed after saying this) Unlike usual...","text":"Eunjae Yoo: (Tôi cảm thấy xấu hổ sau khi nói điều này) Không như mọi khi...\n유은재: (말해놓고 나니 무안하다) 평소와는 달리···.\nEunjae Yoo: (I feel embarrassed after saying this) Unlike usual...","sourceUid":"nar-msh1xh6q-m8ev3b","sourceNo":"N446","viRanges":[],"koRanges":[]},{"id":559,"readerNo":560,"displayNo":114,"n":114,"kind":"sub","type":"ko","vi":"[Kết thúc bản nhạc êm dịu và nhẹ nhàng]","ko":"[잔잔하고 부드러운 음악 끝]","en":"[Calm and soft music ends]","text":"[Kết thúc bản nhạc êm dịu và nhẹ nhàng]\n[잔잔하고 부드러운 음악 끝]\n[Calm and soft music ends]","sourceUid":"ko-ms9zfai4-1088","sourceNo":461,"viRanges":[],"koRanges":[]},{"id":560,"readerNo":561,"displayNo":115,"n":115,"kind":"sub","type":"merged","vi":"THI VIẾT","ko":"","en":"WRITTEN EXAM","text":"THI VIẾT\nWRITTEN EXAM","sourceUid":"merged-msbfltk6-66","sourceNo":339,"viRanges":[],"koRanges":[]},{"id":561,"readerNo":562,"displayNo":"N447","n":"N447","kind":"narration","type":"narration","vi":". Trung tâm khảo thí (ban ngày)","ko":". 시험장(낮)","en":". Examination center (daytime)","text":". Trung tâm khảo thí (ban ngày)\n. 시험장(낮)\n. Examination center (daytime)","sourceUid":"nar-msh1xtwa-3epdmp","sourceNo":"N447","viRanges":[],"koRanges":[]},{"id":562,"readerNo":563,"displayNo":"N448","n":"N448","kind":"narration","type":"narration","vi":"Jinmyeong Yoon, đeo thẻ dự thi, đang làm bài kiểm tra đầu vào.","ko":"수험표를 단 윤진명이 입사 시험을 보고 있다.","en":"Jinmyeong Yoon, wearing an admission ticket, is taking the entrance exam.","text":"Jinmyeong Yoon, đeo thẻ dự thi, đang làm bài kiểm tra đầu vào.\n수험표를 단 윤진명이 입사 시험을 보고 있다.\nJinmyeong Yoon, wearing an admission ticket, is taking the entrance exam.","sourceUid":"nar-msh26mfg-sctxot","sourceNo":"N448","viRanges":[],"koRanges":[]},{"id":563,"readerNo":564,"displayNo":"N449","n":"N449","kind":"narration","type":"narration","vi":". Trước phòng thi (ban ngày)","ko":". 시험장 앞(낮)","en":". In front of the exam center (daytime)","text":". Trước phòng thi (ban ngày)\n. 시험장 앞(낮)\n. In front of the exam center (daytime)","sourceUid":"nar-msh26ndd-2wyqay","sourceNo":"N449","viRanges":[],"koRanges":[]},{"id":564,"readerNo":565,"displayNo":"N450","n":"N450","kind":"narration","type":"narration","vi":"Yoon Jin-myeong xuất hiện. Cởi vé vào cửa, gấp gọn gàng rồi cho vào túi xách.","ko":"윤진명이 나온다. 수험표를 떼서 곱게 접어 가방에 넣는다.","en":"Yoon Jin-myeong appears. Take off the admission ticket, fold it neatly, and put it in your bag.","text":"Yoon Jin-myeong xuất hiện. Cởi vé vào cửa, gấp gọn gàng rồi cho vào túi xách.\n윤진명이 나온다. 수험표를 떼서 곱게 접어 가방에 넣는다.\nYoon Jin-myeong appears. Take off the admission ticket, fold it neatly, and put it in your bag.","sourceUid":"nar-msh26p3g-vcing6","sourceNo":"N450","viRanges":[],"koRanges":[]},{"id":565,"readerNo":566,"displayNo":"N451","n":"N451","kind":"narration","type":"narration","vi":"(160) (Nhìn lên tòa nhà) Này.","ko":"(160) (건물을 올려다보며) 이야.","en":"(160) (Looking up at the building) Hey.","text":"(160) (Nhìn lên tòa nhà) Này.\n(160) (건물을 올려다보며) 이야.\n(160) (Looking up at the building) Hey.","sourceUid":"nar-msh26qap-tg718y","sourceNo":"N451","viRanges":[],"koRanges":[]},{"id":566,"readerNo":567,"displayNo":116,"n":116,"kind":"sub","type":"merged","vi":"[Tiếng lật giấy]\nChà, những nơi thế này lương tầm bao nhiêu nhỉ?\nChắc phải tầm ba đến bốn triệu won?\nNhiều như thế cơ ạ?\nCứ cho là ba triệu đi.\nVậy thì chỉ cần làm ba tháng là được rồi.\nNày, tiền lương để trả hết nợ thì nó ăn gì mà sống?","ko":"[종이 뒤집는 소리]\n(사채업 직원) 이야, 이런 덴 월급이 얼만가?\n(사채업 사장) 한 3, 4백은 되지, 아마?\n(사채업 직원) 진, 진짜요? 그렇게 많아요?\n자, 한 달에 3백이라 치고\n아이, 그럼 세 달 반만 일하면 되네\n야, 이 새끼야, 월급 받아서 다 빚 갚으면 쟤 뭐 먹고 사냐?","en":"[Sound of paper flipping]\nWow, how much does a company like this pay?\nMaybe three to four million won per month?\nDo they really pay people that much?\nLet's say three million per month.\nThen, she only needs to work three months.\nHey, how would she get by if she used her entire paycheck to pay us back?","text":"[Tiếng lật giấy]\nChà, những nơi thế này lương tầm bao nhiêu nhỉ?\nChắc phải tầm ba đến bốn triệu won?\nNhiều như thế cơ ạ?\nCứ cho là ba triệu đi.\nVậy thì chỉ cần làm ba tháng là được rồi.\nNày, tiền lương để trả hết nợ thì nó ăn gì mà sống?\n[종이 뒤집는 소리]\n(사채업 직원) 이야, 이런 덴 월급이 얼만가?\n(사채업 사장) 한 3, 4백은 되지, 아마?\n(사채업 직원) 진, 진짜요? 그렇게 많아요?\n자, 한 달에 3백이라 치고\n아이, 그럼 세 달 반만 일하면 되네\n야, 이 새끼야, 월급 받아서 다 빚 갚으면 쟤 뭐 먹고 사냐?\n[Sound of paper flipping]\nWow, how much does a company like this pay?\nMaybe three to four million won per month?\nDo they really pay people that much?\nLet's say three million per month.\nThen, she only needs to work three months.\nHey, how would she get by if she used her entire paycheck to pay us back?","sourceUid":"merged-msbfmmgy-67","sourceNo":345,"viRanges":[{"start":2055,"end":2072.839326}],"koRanges":[{"start":2187,"end":2201.677482}]},{"id":567,"readerNo":568,"displayNo":117,"n":117,"kind":"sub","type":"merged","vi":"Mày không có lòng thương người gì cả. Phải cho sinh hoạt phí chứ.\nCứ coi sinh hoạt phí là một triệu.\nVậy mỗi tháng hai triệu, thì sáu tháng là trả được cả lãi rồi.\nĐúng chuẩn rồi!\nCô chỉ cần ký như thế là đẹp cả đôi đường mà.","ko":"아이, 애 새끼가 인간미가 없어 생활비는 빼줘야 될 거 아니야?\n자 그러면, 생활비를 백이라 치고\n한 달에 2백씩 다섯 달 이자까지 여섯 달\n야, 그럼 딱 인데\n그렇게 해주겠다고 사인만 하면 우리 서로 행복한 건데, 어?","en":"You have no humanity. We need to account for her living expenses.\nLet's say the living expenses are one million per month.\nYou can pay us two million per month, about six months including interest.\nThat'd be perfect!\nIf you agree to this, all of us will be happy.","text":"Mày không có lòng thương người gì cả. Phải cho sinh hoạt phí chứ.\nCứ coi sinh hoạt phí là một triệu.\nVậy mỗi tháng hai triệu, thì sáu tháng là trả được cả lãi rồi.\nĐúng chuẩn rồi!\nCô chỉ cần ký như thế là đẹp cả đôi đường mà.\n아이, 애 새끼가 인간미가 없어 생활비는 빼줘야 될 거 아니야?\n자 그러면, 생활비를 백이라 치고\n한 달에 2백씩 다섯 달 이자까지 여섯 달\n야, 그럼 딱 인데\n그렇게 해주겠다고 사인만 하면 우리 서로 행복한 건데, 어?\nYou have no humanity. We need to account for her living expenses.\nLet's say the living expenses are one million per month.\nYou can pay us two million per month, about six months including interest.\nThat'd be perfect!\nIf you agree to this, all of us will be happy.","sourceUid":"merged-msbuqz8t-1","sourceNo":350,"viRanges":[{"start":2072.839326,"end":2084.771971}],"koRanges":[{"start":2201.677482,"end":2216.453273}]},{"id":568,"readerNo":569,"displayNo":118,"n":118,"kind":"sub","type":"merged","vi":"Này, nhỏ sinh viên!\nCô thật sự không sao dù mẹ có thành thế nào à?\nMẹ thì nói không có cách nào trả được.\nĐứa con gái thì từ chối không trả.\nNếu thế thì bọn tôi thật sự phải ra tay rồi.\nVậy cũng không sao chứ?","ko":"어이, 학생!\n진짜 괜찮겠어? 엄마 어떻게 돼도?\n아무리 둘러봐도 돈 받을 길은 없고\n하나밖에 없는 딸년이 못 갚겠다고 하고\n그럼 진짜 우리식으로 해야 되는데\n그래도 괜찮겠어?","en":"Hey, you!\nYou don't care what happens to your mom?\nThere's no way your mom can pay back\nand her only daughter refuses to help her.\nWe'll really have to do things our way then.\nAre you okay with that?","text":"Này, nhỏ sinh viên!\nCô thật sự không sao dù mẹ có thành thế nào à?\nMẹ thì nói không có cách nào trả được.\nĐứa con gái thì từ chối không trả.\nNếu thế thì bọn tôi thật sự phải ra tay rồi.\nVậy cũng không sao chứ?\n어이, 학생!\n진짜 괜찮겠어? 엄마 어떻게 돼도?\n아무리 둘러봐도 돈 받을 길은 없고\n하나밖에 없는 딸년이 못 갚겠다고 하고\n그럼 진짜 우리식으로 해야 되는데\n그래도 괜찮겠어?\nHey, you!\nYou don't care what happens to your mom?\nThere's no way your mom can pay back\nand her only daughter refuses to help her.\nWe'll really have to do things our way then.\nAre you okay with that?","sourceUid":"merged-msbut46z-2","sourceNo":356,"viRanges":[{"start":2084.771971,"end":2110.043989}],"koRanges":[{"start":2216.453273,"end":2242.384178}]},{"id":569,"readerNo":570,"displayNo":119,"n":119,"kind":"sub","type":"ko","vi":"[Âm nhạc lo lắng bắt đầu]","ko":"[불안한 분위기의 음악 시작]","en":"[Anxious music begins]","text":"[Âm nhạc lo lắng bắt đầu]\n[불안한 분위기의 음악 시작]\n[Anxious music begins]","sourceUid":"ko-ms9zfai4-1101","sourceNo":474,"viRanges":[],"koRanges":[]},{"id":570,"readerNo":571,"displayNo":"N452","n":"N452","kind":"narration","type":"narration","vi":". Trước quán cà phê (ban ngày)","ko":". 커피숍 앞(낮)","en":". In front of the coffee shop (daytime)","text":". Trước quán cà phê (ban ngày)\n. 커피숍 앞(낮)\n. In front of the coffee shop (daytime)","sourceUid":"nar-msh2el2z-n9twst","sourceNo":"N452","viRanges":[],"koRanges":[]},{"id":571,"readerNo":572,"displayNo":"N453","n":"N453","kind":"narration","type":"narration","vi":"Bên ngoài cửa sổ kính, Jinmyeong Yoon ký một văn bản.","ko":"유리창 너머, 윤진명이 서류에 사인을 한다.","en":"Beyond the glass window, Jinmyeong Yoon signs a document.","text":"Bên ngoài cửa sổ kính, Jinmyeong Yoon ký một văn bản.\n유리창 너머, 윤진명이 서류에 사인을 한다.\nBeyond the glass window, Jinmyeong Yoon signs a document. 진명이 고개를 꾸벅하고 안으로 들어간다.","en":"Jinmyeong Yoon nods his head and goes inside.","text":"Jinmyeong Yoon gật đầu và đi vào trong.\n윤진명이 고개를 꾸벅하고 안으로 들어간다.\nJinmyeong Yoon nods his head and goes inside.","sourceUid":"nar-msh2fi3m-hz404s","sourceNo":"N463","viRanges":[],"koRanges":[]},{"id":582,"readerNo":583,"displayNo":"N464","n":"N464","kind":"narration","type":"narration","vi":"Jinmyeong Yoon đã không nghe lời khuyên của Jaewan Park.","ko":"윤진명은 박재완의 충고를 듣지 않았다.","en":"Jinmyeong Yoon did not listen to Jaewan Park’s advice.","text":"Jinmyeong Yoon đã không nghe lời khuyên của Jaewan Park.\n윤진명은 박재완의 충고를 듣지 않았다.\nJinmyeong Yoon did not listen to Jaewan Park’s advice.","sourceUid":"nar-msh2fjiv-o8yjuv","sourceNo":"N464","viRanges":[],"koRanges":[]},{"id":583,"readerNo":584,"displayNo":"N465","n":"N465","kind":"narration","type":"narration","vi":". Nhà hàng (bữa tối)","ko":". 레스토랑(저녁)","en":". Restaurant (dinner)","text":". Nhà hàng (bữa tối)\n. 레스토랑(저녁)\n. Restaurant (dinner)","sourceUid":"nar-msh2fkn8-62a3bp","sourceNo":"N465","viRanges":[],"koRanges":[]},{"id":584,"readerNo":585,"displayNo":120,"n":120,"kind":"sub","type":"merged","vi":"(Chủ doanh nghiệp cho vay tư nhân)\nCô chỉ cần ký vào đây là được. Đây nữa.\nEm nghỉ đi. Nghỉ việc ở nhà hàng đi.\nChỉ là việc làm thêm thôi. Có nhiều công việc như thế mà.\nTôi không thể nghỉ được.\nĐối với tôi, nơi này chính là đường giới hạn.\nTận cùng mặt đất.","ko":"(사채업 사장) 다-읽었으면 여기다-사인\n(사채업 사장) 하나 더\n(박재완) 그만둬요 레스토랑 그만둬요\n어차피 알바고, 거기 아니어도 그 정도 일자리는 많잖아요\n그만둘 수 없어요\n나한테 여기는 한계선 같은 거예요\n땅끝 같은 거","en":"(Private loan business owner)\nIf you're done reading it, sign here. Here, too.\nJust quit. Stop working at the restaurant.\nIt's just a part-time job anyway, there's plenty of other jobs.\nI can't quit. To me, this place is like a test. A kind of trial run.","text":"(Chủ doanh nghiệp cho vay tư nhân)\nCô chỉ cần ký vào đây là được. Đây nữa.\nEm nghỉ đi. Nghỉ việc ở nhà hàng đi.\nChỉ là việc làm thêm thôi. Có nhiều công việc như thế mà.\nTôi không thể nghỉ được.\nĐối với tôi, nơi này chính là đường giới hạn.\nTận cùng mặt đất.\n(사채업 사장) 다-읽었으면 여기다-사인\n(사채업 사장) 하나 더\n(박재완) 그만둬요 레스토랑 그만둬요\n어차피 알바고, 거기 아니어도 그 정도 일자리는 많잖아요\n그만둘 수 없어요\n나한테 여기는 한계선 같은 거예요\n땅끝 같은 거\n(Private loan business owner)\nIf you're done reading it, sign here. Here, too.\nJust quit. Stop working at the restaurant.\nIt's just a part-time job anyway, there's plenty of other jobs.\nI can't quit. To me, this place is like a test. A kind of trial run.","sourceUid":"merged-msbuvg1l-3","sourceNo":363,"viRanges":[{"start":2110.043989,"end":2177.950474}],"koRanges":[{"start":2242.384178,"end":2304.094172}]},{"id":585,"readerNo":586,"displayNo":121,"n":121,"kind":"sub","type":"ko","vi":"[Âm thanh của ve sầu]","ko":"[매미 소리]","en":"[Sound of cicadas]","text":"[Âm thanh của ve sầu]\n[매미 소리]\n[Sound of cicadas]","sourceUid":"ko-ms9zfai4-1108","sourceNo":481,"viRanges":[],"koRanges":[]},{"id":586,"readerNo":587,"displayNo":"N466","n":"N466","kind":"narration","type":"narration","vi":"Park Jae-wan, người đang đi vào bằng cửa sau, nhìn lên.","ko":"뒷문을 열고 들어오던 박재완이 시선을 든다.","en":"Park Jae-wan, who was coming in through the back door, looks up.","text":"Park Jae-wan, người đang đi vào bằng cửa sau, nhìn lên.\n뒷문을 열고 들어오던 박재완이 시선을 든다.\nPark Jae-wan, who was coming in through the back door, looks up.","sourceUid":"nar-msh2fqdv-tq1u1a","sourceNo":"N466","viRanges":[],"koRanges":[]},{"id":587,"readerNo":588,"displayNo":"N467","n":"N467","kind":"narration","type":"narration","vi":"Jinmyeong Yoon, đã thay quần áo đi làm, đang đứng.","ko":"작업복으로 갈아입은 윤진명이 서 있다.","en":"Jinmyeong Yoon, changed into work clothes, is standing.","text":"Jinmyeong Yoon, đã thay quần áo đi làm, đang đứng.\n작업복으로 갈아입은 윤진명이 서 있다.\nJinmyeong Yoon, changed into work clothes, is standing.","sourceUid":"nar-msh2frgn-lgl4b7","sourceNo":"N467","viRanges":[],"koRanges":[]},{"id":588,"readerNo":589,"displayNo":"N468","n":"N468","kind":"narration","type":"narration","vi":"Tôi đoán họ đang đợi Park Jae-wan.","ko":"박재완을 기다리고 있었나 보다.","en":"I guess they were waiting for Park Jae-wan.","text":"Tôi đoán họ đang đợi Park Jae-wan.\n박재완을 기다리고 있었나 보다.\nI guess they were waiting for Park Jae-wan.","sourceUid":"nar-msh2fslz-fyosu3","sourceNo":"N468","viRanges":[],"koRanges":[]},{"id":589,"readerNo":590,"displayNo":"N469","n":"N469","kind":"narration","type":"dialogue","vi":"Jinmyeong Yoon: Tôi không thể bỏ cuộc.","ko":"윤진명: 그만둘 수 없어요.","en":"Jinmyeong Yoon: I can’t quit.","text":"Jinmyeong Yoon: Tôi không thể bỏ cuộc.\n윤진명: 그만둘 수 없어요.\nJinmyeong Yoon: I can’t quit.","sourceUid":"nar-msh2fuiz-dmls35","sourceNo":"N469","viRanges":[],"koRanges":[]},{"id":590,"readerNo":591,"displayNo":122,"n":122,"kind":"sub","type":"merged","vi":"Nếu tôi không thể chịu đựng ở đây, tôi sẽ không thể chịu đựng ở nơi khác.\nNếu có thể chịu đựng ở đây, ở đâu tôi cũng có thể chịu được.\nTôi đã quyết tâm như thế. Vì vậy… tôi sẽ không nghỉ đâu.\nEm sẽ chịu đựng sao?\nĐối với em, cuộc sống này…\nlà như thế sao? Là sự chịu đựng?\nVâng. Vậy thì tùy ý em.","ko":"여기서 못 버티면 난 아무데서도 못 버텨요\n여기서 버티면 어디서든 버텨낼 수 있어요\n(윤진명) 나 혼자 그렇게 결심했어요\n그러니까 난 그만두지 않을 거예요\n(박재완) 버티는 겁니까?\n진명 씨한테 산다는 거\n그런 겁니까? 버티는 거? 네\n맘대로 해요","en":"If I can't survive here, then I won't be able to last anywhere else.\nIf I can survive here then I can do anything.\nI've decided to do that. That's why...I will not quit.\nSo you'll just endure?\nFor you, life is just... a series of obstacles to endure?\nYes. Do whatever you want, then.","text":"Nếu tôi không thể chịu đựng ở đây, tôi sẽ không thể chịu đựng ở nơi khác.\nNếu có thể chịu đựng ở đây, ở đâu tôi cũng có thể chịu được.\nTôi đã quyết tâm như thế. Vì vậy… tôi sẽ không nghỉ đâu.\nEm sẽ chịu đựng sao?\nĐối với em, cuộc sống này…\nlà như thế sao? Là sự chịu đựng?\nVâng. Vậy thì tùy ý em.\n여기서 못 버티면 난 아무데서도 못 버텨요\n여기서 버티면 어디서든 버텨낼 수 있어요\n(윤진명) 나 혼자 그렇게 결심했어요\n그러니까 난 그만두지 않을 거예요\n(박재완) 버티는 겁니까?\n진명 씨한테 산다는 거\n그런 겁니까? 버티는 거? 네\n맘대로 해요\nIf I can't survive here, then I won't be able to last anywhere else.\nIf I can survive here then I can do anything.\nI've decided to do that. That's why...I will not quit.\nSo you'll just endure?\nFor you, life is just... a series of obstacles to endure?\nYes. Do whatever you want, then.","sourceUid":"merged-msbuz95j-4","sourceNo":373,"viRanges":[{"start":2177.950474,"end":2222.635665}],"koRanges":[{"start":2304.094172,"end":2354.925941}]},{"id":591,"readerNo":592,"displayNo":"N471","n":"N471","kind":"narration","type":"narration","vi":". Sảnh nhà hàng (bữa tối)","ko":". 레스토랑 홀(저녁)","en":". Restaurant Hall (dinner)","text":". Sảnh nhà hàng (bữa tối)\n. 레스토랑 홀(저녁)\n. Restaurant Hall (dinner)","sourceUid":"nar-msh2gapp-2xmby9","sourceNo":"N471","viRanges":[],"koRanges":[]},{"id":592,"readerNo":593,"displayNo":"N472","n":"N472","kind":"narration","type":"narration","vi":"Jinmyeong Yoon bước vào.","ko":"윤진명이 들어온다.","en":"Jinmyeong Yoon enters.","text":"Jinmyeong Yoon bước vào.\n윤진명이 들어온다.\nJinmyeong Yoon enters.","sourceUid":"nar-msh2gcli-xbk0th","sourceNo":"N472","viRanges":[],"koRanges":[]},{"id":593,"readerNo":594,"displayNo":"N473","n":"N473","kind":"narration","type":"narration","vi":"Tâm trạng của nhân viên trở nên nặng nề sau khi nhìn thấy Yoon Jin-myeong.","ko":"윤진명을 본 직원들 분위기가 무거워진다.","en":"The employees' mood becomes heavy after seeing Yoon Jin-myeong.","text":"Tâm trạng của nhân viên trở nên nặng nề sau khi nhìn thấy Yoon Jin-myeong.\n윤진명을 본 직원들 분위기가 무거워진다.\nThe employees' mood becomes heavy after seeing Yoon Jin-myeong.","sourceUid":"nar-msh2gf90-opw64d","sourceNo":"N473","viRanges":[],"koRanges":[]},{"id":594,"readerNo":595,"displayNo":"N473","n":"N473","kind":"narration","type":"narration","vi":"Đó là một khuôn mặt nói lên rằng, 'Cô ấy đã trở lại lần nữa.'","ko":"‘쟤 또 왔어’ 하는 얼굴이다.","en":"It’s a face that says, ‘She’s back again.’","text":"Đó là một khuôn mặt nói lên rằng, 'Cô ấy đã trở lại lần nữa.'\n‘쟤 또 왔어’ 하는 얼굴이다.\nIt’s a face that says, ‘She’s back again.’","sourceUid":"nar-msh2sr7w-w7hpns","s 주 등이다.\nGo Doo-young puts down the convenience store bag. Instant rice, cup ramen, beer, etc.","sourceUid":"nar-msh2u9by-bej016","sourceNo":"N488","viRanges":[],"koRanges":[]},{"id":614,"readerNo":615,"displayNo":"N489","n":"N489","kind":"narration","type":"narration","vi":"Jeong Ye-eun đứng lặng lẽ như thể đây là lần đầu tiên cô về nhà.","ko":"정예은은 처음 온 집처럼 우두커니 서 있다.","en":"Jeong Ye-eun is standing quietly as if it was her first time coming home.","text":"Jeong Ye-eun đứng lặng lẽ như thể đây là lần đầu tiên cô về nhà.\n정예은은 처음 온 집처럼 우두커니 서 있다.\nJeong Ye-eun is standing quietly as if it was her first time coming home.","sourceUid":"nar-msh2ud88-5e04bw","sourceNo":"N489","viRanges":[],"koRanges":[]},{"id":615,"readerNo":616,"displayNo":127,"n":127,"kind":"sub","type":"merged","vi":"Em uống bia không? Em làm tóc hả? Không.\nTrông em có vẻ lạ đấy. Trông có vẻ quyến rũ hơn.\nHay vì lâu ngày không gặp nên mới vậy?\n- Dừng lại đi. - Thôi nào. - Dừng lại đi! Em không muốn. - Chết tiệt! Em làm cái quái gì vậy? Đúng thật là.","ko":"어, 맥주 마실래?\n[맥주캔 따는 소리] 아흐 [맥주 마시는 소리]\n머리 했어? 아니\n뭔가 좀 바뀐 거 같은데\n좀 섹시해진 거 같기도 하고\n쓰, 오랜만에 봐서 그런가?\n하지 마 - 아이, 왜?\n하지 마! 하기 싫어 - 아이\n아이 씨, 뭐하는 거야! 아이 진짜, 씨","en":"Want some beer? Did you get your hair done? No.\nI feel like something has changed about you. You look sexier.\nMaybe because it's been so long since I've seen you?\n-Stop it. -Come on, why not?\n-Stop it! I don't want it. Damn it! What the hell are you doing?\nJesus.","text":"Em uống bia không? Em làm tóc hả? Không.\nTrông em có vẻ lạ đấy. Trông có vẻ quyến rũ hơn.\nHay vì lâu ngày không gặp nên mới vậy?\n- Dừng lại đi. - Thôi nào. - Dừng lại đi! Em không muốn. - Chết tiệt! Em làm cái quái gì vậy? Đúng thật là.\n어, 맥주 마실래?\n[맥주캔 따는 소리] 아흐 [맥주 마시는 소리]\n머리 했어? 아니\n뭔가 좀 바뀐 거 같은데\n좀 섹시해진 거 같기도 하고\n쓰, 오랜만에 봐서 그런가?\n하지 마 - 아이, 왜?\n하지 마! 하기 싫어 - 아이\n아이 씨, 뭐하는 거야! 아이 진짜, 씨\nWant some beer? Did you get your hair done? No.\nI feel like something has changed about you. You look sexier.\nMaybe because it's been so long since I've seen you?\n-Stop it. -Come on, why not?\n-Stop it! I don't want it. Damn it! What the hell are you doing?\nJesus.","sourceUid":"merged-mscsrvy2-4","sourceNo":394,"viRanges":[{"start":2310.611321,"end":2355.130478}],"koRanges":[{"start":2449.26027,"end":2488.664062}]},{"id":616,"readerNo":617,"displayNo":128,"n":128,"kind":"sub","type":"ko","vi":"[Có thể đặt âm thanh của bia]","ko":"[맥주캔 세워 놓는 소리]","en":"[Sound of beer can being set]","text":"[Có thể đặt âm thanh của bia]\n[맥주캔 세워 놓는 소리]\n[Sound of beer can being set]","sourceUid":"ko-ms9zfai4-1151","sourceNo":524,"viRanges":[],"koRanges":[]},{"id":617,"readerNo":618,"displayNo":"N490","n":"N490","kind":"narration","type":"narration","vi":"Có lẽ là do đã lâu rồi tôi mới gặp lại bạn. (cố hôn)","ko":"오랜만에 봐서 그런가. (입을 맞추려 한다)","en":"Maybe it's because it's been a while since I last saw you. (trying to kiss)","text":"Có lẽ là do đã lâu rồi tôi mới gặp lại bạn. (cố hôn)\n오랜만에 봐서 그런가. (입을 맞추려 한다)\nMaybe it's because it's been a while since I last saw you. (trying to kiss)","sourceUid":"nar-msh2vwpg-ohkpoj","sourceNo":"N490","viRanges":[],"koRanges":[]},{"id":618,"readerNo":619,"displayNo":"N491","n":"N491","kind":"narration","type":"dialogue","vi":"Go Doo-young: (Hôn cổ cô ấy và di chuyển xuống ngực cô ấy) ...","ko":"고두영: (목에 입을 맞추며 가슴 쪽으로 내려간다) ···.","en":"Go Doo-young: (Kisses her neck and moves down to her chest) ...","text":"Go Doo-young: (Hôn cổ cô ấy và di chuyển xuống ngực cô ấy) ...\n고두영: (목에 입을 맞추며 가슴 쪽으로 내려간다) ···.\nGo Doo-young: (Kisses her neck and moves down to her chest) ...","sourceUid":"nar-msh2w4e5-95v8f9","sourceNo":"N491","viRanges":[],"koRanges":[]},{"id":619,"readerNo":620,"displayNo":"N492","n":"N492","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Lặng lẽ) Đừng làm thế!","ko":"정예은: (조용히) 하지 마!","en":"Jeong Ye-eun: (Quietly) Don’t do it!","text":"Jeong Ye-eun: (Lặng lẽ) Đừng làm thế!\n정예은: (조용히) 하지 마!\nJeong Ye-eun: (Quietly) Don’t do it!","sourceUid":"nar- n sắc mặt em bao giờ à? - Gì cơ?\nEm đi đây.\nNày!\nChết tiệt.","ko":"너 요새 왜 그래?\n할 말 있으면 해! 괜히 사람 눈치 보게 하지 말구\n눈치?\n내 눈치를 보기는 했어? 뭐?\n나 갈게\n[환 나서] 야!\n[도어락 소리]\n아이, 씨","en":"What's with you lately?\nIf you have something to say, just say it. Don't make me walk on eggshells.\n-Have you ever cared about how I feel? -What?\nI'm leaving.\nHey!\nDamn it.","text":"Dạo gần đây em sao vậy?\nCó gì thì nói đại đi. Đừng bắt người ta nhìn sắc mặt em như thế.\n- Anh có nhìn sắc mặt em bao giờ à? - Gì cơ?\nEm đi đây.\nNày!\nChết tiệt.\n너 요새 왜 그래?\n할 말 있으면 해! 괜히 사람 눈치 보게 하지 말구\n눈치?\n내 눈치를 보기는 했어? 뭐?\n나 갈게\n[환 나서] 야!\n[도어락 소리]\n아이, 씨\nWhat's with you lately?\nIf you have something to say, just say it. Don't make me walk on eggshells.\n-Have you ever cared about how I feel? -What?\nI'm leaving.\nHey!\nDamn it.","sourceUid":"merged-mscttrh9-5","sourceNo":392,"viRanges":[{"start":2355.130478,"end":2387.785525}],"koRanges":[{"start":2488.664062,"end":2520.463942}]},{"id":625,"readerNo":626,"displayNo":"N497","n":"N497","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Nhìn Go Doo-young. Những lời chia tay dâng lên trong cổ họng tôi, nhưng tôi không thể nói ra được.)","ko":"정예은: (고두영을 본다. 헤어지자는 말이 목구멍까지 치솟는데 차마 그 말이 나오질 않는다) ···","en":"Jeong Ye-eun: (Looking at Go Doo-young. The words of breaking up rise up in my throat, but I can’t bring myself to say them.)","text":"Jeong Ye-eun: (Nhìn Go Doo-young. Những lời chia tay dâng lên trong cổ họng tôi, nhưng tôi không thể nói ra được.)\n정예은: (고두영을 본다. 헤어지자는 말이 목구멍까지 치솟는데 차마 그 말이 나오질 않는다) ···\nJeong Ye-eun: (Looking at Go Doo-young. The words of breaking up rise up in my throat, but I can’t bring myself to say them.)","sourceUid":"nar-msh2wrfs-itgzf0","sourceNo":"N497","viRanges":[],"koRanges":[]},{"id":626,"readerNo":627,"displayNo":"N498","n":"N498","kind":"narration","type":"dialogue","vi":"Tôi sẽ đi. Go Doo-young: Này!!","ko":"나 갈게. 고두영: 야!!","en":"I'm going. Go Doo-young: Hey!!","text":"Tôi sẽ đi. Go Doo-young: Này!!\n나 갈게. 고두영: trang điểm.\n한유경, 송경아가 화장을 고친다.\nHan Yu-kyung and Song Kyung-ah fix their makeup.","sourceUid":"nar-msh3w8y2-cry5jt","sourceNo":"N507","viRanges":[],"koRanges":[]},{"id":637,"readerNo":638,"displayNo":"N508","n":"N508","kind":"narration","type":"dialogue","vi":"Han Yu-kyung: Ye-eun, có chuyện gì đó xảy ra với bạn trai của em phải không?","ko":"한유경: 예은이 남친이랑 뭔 일 있는 거 맞지?","en":"Han Yu-kyung: Ye-eun, there’s something going on with your boyfriend, right?","text":"Han Yu-kyung: Ye-eun, có chuyện gì đó xảy ra với bạn trai của em phải không?\n한유경: 예은이 남친이랑 뭔 일 있는 거 맞지?\nHan Yu-kyung: Ye-eun, there’s something going on with your boyfriend, right?","sourceUid":"nar-msh3wc0l-5a3549","sourceNo":"N508","viRanges":[],"koRanges":[]},{"id":638,"readerNo":639,"displayNo":"N509","n":"N509","kind":"narration","type":"dialogue","vi":"Song Kyung-ah: Tôi hy vọng chúng ta có thể nhân cơ hội này để chia tay.","ko":"송경아: 제발 이 기회에 헤어졌으면 좋겠다.","en":"Song Kyung-ah: I hope we can take this opportunity to break up.","text":"Song Kyung-ah: Tôi hy vọng chúng ta có thể nhân cơ hội này để chia tay.\n송경아: 제발 이 기회에 헤어졌으면 좋겠다.\nSong Kyung-ah: I hope we can take this opportunity to break up.","sourceUid":"nar-msh3weg5-rgsyq3","sourceNo":"N509","viRanges":[],"koRanges":[]},{"id":639,"readerNo":640,"displayNo":131,"n":131,"kind":"sub","type":"merged","vi":"Ye Eun! Đừng uống nữa.\nThôi. - Đừng uống nữa.\nCậu trả hết không? - Đi đâu vậy?\nYe Eun à!\nUống vừa phải thôi!\nCậu ấy điên rồi.\nCậu đi đâu?\n- Này! Ye Eun! - Cậu đi đâu vậy? Jung Ye Eun!","ko":"(정예은 친구) 예은아, 그만 마시자\n(정예은 친구) 아휴, 그만 좀 마셔!\n(정예은 친구) 너가 돈 다 낼 거야? 야, 어디가!\n(정예은 친구) 예은아! - 하하하\n[짜증 내며] 어휴, 적당히 마셔\n(정예은 친구) 미쳤나 봐, 진짜\n어디가?\n야, 예은아 야, 어디가?","en":"Ye-Eun! Stop drinking.\nNo. -Stop it.\nAre you going to pay for all this? -Where are you going?\nYe-Eun!\nCome on, pace yourself!\nYou'll get sick.\nWhere are you going?\nHey! Ye-Eun! -Where are you going?","text":"Ye Eun! Đừng uống nữa.\nThôi. - Đừng uống nữa.\nCậu trả hết không? - Đi đâu vậy?\nYe Eun à!\nUống vừa phải thôi!\nCậu ấy điên rồi.\nCậu đi đâu?\n- Này! Ye Eun! - Cậu đi đâu vậy? Jung Ye Eun!\n(정예은 친구) 예은아, 그만 마시자\n(정예은 친구) 아휴, 그만 좀 마셔!\n(정예은 친구) 너가 돈 다 낼 거야? 야, 어디가!\n(정예은 친구) 예은아! - 하하하\n[짜증 내며] 어휴, 적당히 마셔\n(정예은 친구) 미쳤나 봐, 진짜\n어디가?\n야, 예은아 야, 어디가?\nYe-Eun! Stop drinking.\nNo. -Stop it.\nAre you going to pay for all this? -Where are you going?\nYe-Eun!\nCome on, pace yourself!\nYou'll get sick.\nWhere are you going?\nHey! Ye-Eun! -Where are you going?","sourceUid":"merged-mscu5p5z-7","sourceNo":408,"viRanges":[{"start":2387.785525,"end":2439.090258}],"koRanges":[{"start":2520.463942,"end":2560.942128}]},{"id":640,"readerNo":641,"displayNo":132,"n":132,"kind":"sub","type":"merged","vi":"[Tiếng mở nắp chai bia]\n[Nhạc nhảy lớn với nhịp điệu mạnh mẽ bắt đầu]","ko":"[병맥주 뚜껑 따는 소리]\n[강한 비트의 시끄러운 댄스음악 시작]","en":"[Sound of opening bottle beer cap]\n[Loud dance music with strong beat begins]","text":"[Tiếng mở nắp chai bia]\n[Nhạc nhảy lớn với nhịp điệu mạnh mẽ bắt đầu]\n[병맥주 뚜껑 따는 소리]\n[강한 비트의 시끄러운 댄스음악 시작]\n[Sound of opening bottle beer cap]\n[Loud dance music with strong beat begins]","sourceUid":"merged-mscu8ziy-8","sourceNo":543,"viRanges":[],"koRanges":[]},{"id":641,"readerNo":642,"displayNo":133,"n":133,"kind":"sub","type":"merged","vi":"Chắc là Ye Eun có chuyện gì đó với bạn trai rồi.\nMong là lần này cậu ấy chia tay.\nTớ cá 50.000 won là cậu ấy không thể.\nThằng đó có đòi chia tay thì cá là cậu ấy cũng níu kéo lại.\nNhưng mà sao lại vậy nhỉ? Thật sự!","ko":"(한유경) 예은이 남친이랑 뭔 일 있는 거 맞지?\n어흐, 제발 이 기회에 헤어졌으면 좋겠다\n어휴, 못 헤어진다에 5만원 건다\n그 놈이 먼저 헤어지자고 해도 달라붙을걸\n걔는 왜 그런다니, 진짜?","en":"Ye-Eun and her boyfriend aren't doing well, right?\nI hope she breaks up with him this time.\nI'll bet you 50,000 won that she won't be able to.\nI bet she'll cling onto him even if he asks her to break up with him.\nWhy is she like that? Seriously!","text":"Chắc là Ye Eun có chuyện gì đó với bạn trai rồi.\nMong là lần này cậu ấy chia tay.\nTớ cá 50.000 won là cậu ấy không thể.\nThằng đó có đòi chia tay thì cá là cậu ấy cũng níu kéo lại.\nNhưng mà sao lại vậy nhỉ? Thật sự!\n(한유경) 예은이 남친이랑 뭔 일 있는 거 맞지?\n어흐, 제발 이 기회에 헤어졌으면 좋겠다\n어휴, 못 헤어진다에 5만원 건다\n그 놈이 먼저 헤어지자고 해도 달라붙을걸\n걔는 왜 그런다니, 진짜?\nYe-Eun and her boyfriend aren't doing well, right?\nI hope she breaks up with him this time.\nI'll bet you 50,000 won that she won't be able to.\nI bet she'll cling onto him even if he asks her to break up with him.\nWhy is she like that? Seriously!","sourceUid":"merged-mscu9q3l-9","sourceNo":410,"viRanges":[{"start":2439.090258,"end":2457.230862}],"koRanges":[{"start":2560.942128,"end":2587.732151}]},{"id":642,"readerNo":643,"displayNo":"N510","n":"N510","kind":"narration","type":"narration","vi":". Câu lạc bộ (đêm)","ko":". 클럽(밤)","en":". Club (night)","text":". Câu lạc bộ (đêm)\n. 클럽(밤)\n. Club (night)","sourceUid":"nar-msh3ws8b-taad23","sourceNo":"N510","viRanges":[],"koRanges":[]},{"id":643,"readerNo":644,"displayNo":"N511","n":"N511","kind":"narration","type":"narration","vi":"Han Yu-kyung và Song Kyung-ah bước ra khỏi phòng tắm.","ko":"화장실에서 나오는 한유경과 송경아.","en":"Han Yu-kyung and Song Kyung-ah come out of the bathroom.","text":"Han Yu-kyung và Song Kyung-ah bước ra khỏi phòng tắm.\n화장실에서 나오는 한유경과 송경아.\nHan Yu-kyung and Song Kyung-ah come out of the bathroom.","sourceUid":"nar-msh3wt7i-k94ay9","sourceNo":"N511","viRanges":[],"koRanges":[]},{"id":644,"readerNo":645,"displayNo":"N512","n":"N512","kind":"narration","type":"narration","vi":"Không có Jeong Ye-eun ở bàn.","ko":"테이블에 정예은이 없다.","en":"There is no Jeong Ye-eun at the table.","text":"Không có Jeong Ye-eun ở bàn.\n테이블에 정예은이 없다.\nThere is no Jeong Ye-eun at the table.","sourceUid":"nar-msh3wuwj-oahlz8","sourceNo":"N512","viRanges":[],"koRanges":[]},{"id":645,"readerNo":646,"displayNo":"N513","n":"N513","kind":"narration","type":"narration","vi":"Song Kyung-ah bịt một bên tai và gọi điện thoại.","ko":"송경아가 한쪽 귀를 막고 전화를 건다.","en":"Song Kyung-ah covers one ear and makes a phone call.","text":"Song Kyung-ah bịt một bên tai và gọi điện thoại.\n송경아가 한쪽 귀를 막고 전화를 건다.\nSong Kyung-ah covers one ear and makes a phone call.","sourceUid":"nar-msh3wvz2-hj8gc8","sourceNo":"N513","viRanges":[],"koRanges":[]},{"id":646,"readerNo":647,"displayNo":"N514","n":"N514","kind":"narration","type":"narration","vi":"Tín hiệu không được nhận cho đến khi đạt hết tiềm năng.","ko":"신호가 다 가도록 받지 않는다.","en":"The signal is not received until it reaches its full potential.","text":"Tín hiệu không được nhận cho đến khi đạt hết tiềm năng.\n신호가 다 가도록 받지 않는다.\nThe signal is not received until it reaches its full potential.","sourceUid":"nar-msh3wya4-mot1w8","sourceNo":"N514","viRanges":[],"koRanges":[]},{"id":647,"readerNo":648,"displayNo":"N515","n":"N515","kind":"narration","type":"dialogue","vi":"Song Kyung-ah: (cúp máy) Tôi không trả lời.","ko":"송경아: (전화 끊으며) 안 받어.","en":"Song Kyung-ah: (hanging up the phone) I’m not answering.","text":"Song Kyung-ah: (cúp máy) Tôi không trả lời.\n송경아: (전화 끊으며) 안 받어.\nSong Kyung-ah: (hanging up the phone) I’m not answering.","sourceUid":"nar-msh3x50f-l21gha","sourceNo":"N515","viRanges":[],"koRanges":[]},{"id":648,"readerNo":649,"displayNo":"N516","n":"N516","kind":"narration","type":"dialogue","vi":"Han Yu-kyung: À. Tôi bực mình, tôi chắc chắn nó đã đến tay bạn trai tôi.","ko":"한유경: 아. 짜증, 분명 남친한테 갔어.","en":"Han Yu-kyung: Ah. I'm annoyed, I'm sure it went to my boyfriend.","text":"Han Yu-kyung: À. Tôi bực mình, tôi chắc chắn nó đã đến tay bạn trai tôi.\n한유경: 아. 짜증, 분명 남친한테 갔어.\nHan Yu-kyung: Ah. I'm annoyed, I'm sure it went to my boyfriend.","sourceUid":"nar-msh3x68z-jlq2se","sourceNo":"N516","viRanges":[],"koRanges":[]},{"id":649,"readerNo":650,"displayNo":"N517","n":"N517","kind":"narration","type":"narration","vi":"Đây là lý do tại sao bạn mất bạn bè khi đang trong một mối quan hệ.","ko":"이러니 연애를 하면 친구가 없어지지.","en":"This is why you lose friends when you're in a relationship.","text":"Đây là lý do tại sao bạn mất bạn bè khi đang trong một mối quan hệ.\n이러니 연애를 하면 친구가 없어지지.\nThis is why you lose friends when you're in a relationship.","sourceUid":"nar-msh3x88t-aj30sr","sourceNo":"N517","viRanges":[],"koRanges":[]},{"id":650,"readerNo":651,"displayNo":"N518","n":"N518","kind":"narration","type":"narration","vi":"(Đột nhiên) Bạn thậm chí còn chưa trả tiền phải không?","ko":"(문득) 계산도 안 하고 갔지?","en":"(Suddenly) You didn’t even pay, right?","text":"(Đột nhiên) Bạn thậm chí còn chưa trả tiền phải không?\n(문득) 계산도 안 하고 갔지?\n(Suddenly) You didn’t even pay, right?","sourceUid":"nar-msh3xc0e-b135tg","sourceNo":"N518","viRanges":[],"koRanges":[]},{"id":651,"readerNo":652,"displayNo":"N519","n":"N519","kind":"narration","type":"narration","vi":". Hành lang câu lạc bộ (đêm)","ko":". 클럽 복도(밤)","en":". Club hallway (night)","text":". Hành lang câu lạc bộ (đêm)\n. 클럽 복도(밤)\n. Club hallway (night)","sourceUid":"nar-msh3xcu2-n029bo","sourceNo":"N519","viRanges":[],"koRanges":[]},{"id":652,"readerNo":653,"displayNo":"N520","n":"N520","kind":"narration","type":"narration","vi":"Jeong Ye-eun, người say rượu, được dẫn dắt bởi một người đàn ông.","ko":"술에 취한 정예은이 남자 손에 이끌려 간다.","en":"Jeong Ye-eun, who is drunk, is led by a man.","text":"Jeong Ye-eun, người say rượu, được dẫn dắt bởi một người đàn ông.\n술에 취한 정예은이 남자 손에 이끌려 간다.\nJeong Ye-eun, who is drunk, is led by a man.","sourceUid":"nar-msh3xdqe-lk57r5","sourceNo":"N520","viRanges":[],"koRanges":[]},{"id":653,"readerNo":654,"displayNo":"N521","n":"N521","kind":"narration","type":"narration","vi":"Giống như khi say rượu bạn cười một cách vô nghĩa.","ko":"술 취하면 그렇듯 무의미하게 웃는다.","en":"Like when you're drunk, you laugh meaninglessly.","text":"Giống như khi say rượu bạn cười một cách vô nghĩa.\n술 취하면 그렇듯 무의미하게 웃는다.\nLike when you're drunk, you laugh meaninglessly.","sourceUid":"nar-msh3xf7d-ms3yl9","sourceNo":"N521","viRanges":[],"koRanges":[]},{"id":654,"readerNo":655,"displayNo":"N522","n":"N522","kind":"narration","type":"narration","vi":"Người đàn ông đi ngang qua họ và nhìn lại Jeong Ye-eun là Seo Dong-ju.","ko":"그들과 스쳐가며 정예은을 돌아보는 남자는 서동주다.","en":"The man who passes by them and looks back at Jeong Ye-eun is Seo Dong-ju.","text":"Người đàn ông đi ngang qua họ và nhìn lại Jeong Ye-eun là Seo Dong-ju.\n그들과 스쳐가며 정예은을 돌아보는 남자는 서동주다.\nThe man who passes by them and looks back at Jeong Ye-eun is Seo Dong-ju.","sourceUid":"nar-msh3xgu4-6zzitq","sourceNo":"N522","viRanges":[],"koRanges":[]},{"id":655,"readerNo":656,"displayNo":"N523","n":"N523","kind":"narration","type":"dialogue","vi":"Chủ tịch câu lạc bộ: (Bật ngón tay để thu hút sự chú ý) Bạn đang làm gì vậy?","ko":"클럽 사장: (손가락을 튕기며 주의를 끈다) 뭐 해?","en":"Club President: (Snaps fingers to get attention) What are you doing?","text":"Chủ tịch câu lạc bộ: (Bật ngón tay để thu hút sự chú ý) Bạn đang làm gì vậy?\n클럽 사장: (손가락을 튕기며 주의를 끈다) 뭐 해?\nClub President: (Snaps fingers to get attention) What are you doing?","sourceUid":"nar-msh3xltx-z1lv2y","sourceNo":"N523","viRanges":[],"koRanges":[]},{"id":656,"readerNo":657,"displayNo":134,"n":134,"kind":"sub","type":"ko","vi":"[Tiếng bước chân đi lên cầu thang]","ko":"[계단 오르는 발소리]","en":"[Sound of footsteps going up the stairs]","text":"[Tiếng bước chân đi lên cầu thang]\n[계단 오르는 발소리]\n[Sound of footsteps going up the stairs]","sourceUid":"ko-ms9zfai4-1176","sourceNo":549,"viRanges":[],"koRanges":[]},{"id":657,"readerNo":658,"displayNo":135,"n":135,"kind":"sub","type":"merged","vi":"- Làm gì vậy? - Nghe nói hắn bị bắt rồi mà?\nÀ, không đủ chứng cứ.\nDONG JOO\nAlô?\nỪ, bạn cùng nhà? Ai cơ?\nNgười mà suýt bị xe tông ở trước nhà cậu ấy!\nỪ. Người vừa gầy vừa xinh ấy.\nYe Eun thì sao?","ko":"뭐 해?-아니 쟤, 구속됐다고 들었는데?\n아, 증거 불충분\n여보세요.\n어, 룸메? 룸메 누구?\n그때 왜 니네 집 앞에서 차에 치일 뻔한 애 있잖아\n어, 마르고 이쁜 애\n예은이가 왜?","en":"-What are you doing? -I heard he was arrested.\nThey didn't have enough evidence.\nDong-Joo\nDONG JOO\nHello.\nYeah. My roommate? Which one?\nThe one that almost got hit by a car in front of your house!\nYeah. Skinny and pretty one.\nWhat about Ye-Eun?","text":"- Làm gì vậy? - Nghe nói hắn bị bắt rồi mà?\nÀ, không đủ chứng cứ.\nDONG JOO\nAlô?\nỪ, bạn cùng nhà? Ai cơ?\nNgười mà suýt bị xe tông ở trước nhà cậu ấy!\nỪ. Người vừa gầy vừa xinh ấy.\nYe Eun thì sao?\n뭐 해?-아니 쟤, 구속됐다고 들었는데?\n아, 증거 불충분\n여보세요.\n어, 룸메? 룸메 누구?\n그때 왜 니네 집 앞에서 차에 치일 뻔한 애 있잖아\n어, 마르고 이쁜 애\n예은이가 왜?\n-What are you doing? -I heard he was arrested.\nThey didn't have enough evidence.\nDong-Joo\nDONG JOO\nHello.\nYeah. My roommate? Which one?\nThe one that almost got hit by a car in front of your house!\nYeah. Skinny and pretty one.\nWhat about Ye-Eun?","sourceUid":"merged-mscuccag-12","sourceNo":421,"viRanges":[{"start":2474.883833,"end":2512.723651}],"koRanges":[{"start":2607.850255,"end":2639.768985}]},{"id":658,"readerNo":659,"displayNo":"N524","n":"N524","kind":"narration","type":"dialogue","vi":"Seo Dong-ju: (tiếp theo)...","ko":"서동주: (따라 들어간다) ···.","en":"Seo Dong-ju: (follows in)...","text":"Seo Dong-ju: (tiếp theo)...\n서동주: (따라 들어간다) ···.\nSeo Dong-ju: (follows in)...","sourceUid":"nar-msh3y29i-3tsd51","sourceNo":"N524","viRanges":[],"koRanges":[]},{"id":659,"readerNo":660,"displayNo":"N525","n":"N525","kind":"narration","type":"narration","vi":". Phòng khách (đêm)","ko":". 거실(밤)","en":". Living room (night)","text":". Phòng khách (đêm)\n. 거실(밤)\n. Living room (night)","sourceUid":"nar-msh3y39l-2hsv6i","sourceNo":"N525","viRanges":[],"koRanges":[]},{"id":660,"readerNo":661,"displayNo":"N526","n":"N526","kind":"narration","type":"narration","vi":"Kang Ina bước ra khỏi phòng tắm.","ko":"강이나가 화장실에서 나온다.","en":"Kang Ina comes out of the bathroom.","text":"Kang Ina bước ra khỏi phòng tắm.\n강이나가 화장실에서 나온다.\nKang Ina comes out of the bathroom.","sourceUid":"nar-msh3y5hi-ow4oy4","sourceNo":"N526","viRanges":[],"koRanges":[]},{"id":661,"readerNo":662,"displayNo":"N527","n":"N527","kind":"narration","type":"narration","vi":"đang lau chân thì điện thoại reo lên. Đó là Seo Dong Ju.","ko":"발의 물기를 닦는데, 핸드폰이 울린다. 서동주다.","en":"drying the feet, the cell phone rang. It's Seo D ờ lấy khăn giấy ra và chạm vào má bạn.","ko":"휴지를 떼어내는 척 뺨을 만진다.","en":"Pretend to remove a tissue and touch your cheek.","text":"Giả vờ lấy khăn giấy ra và chạm vào má bạn.\n휴지를 떼어내는 척 뺨을 만진다.\nPretend to remove a tissue and touch your cheek.","sourceUid":"nar-msh4eobz-4jcd97","sourceNo":"N542","viRanges":[],"koRanges":[]},{"id":680,"readerNo":681,"displayNo":"N543","n":"N543","kind":"narration","type":"narration","vi":"Jeong Ye-eun nhìn người đàn ông với ánh mắt không hề khiêu khích hay bác bỏ.","ko":"정예은은 도발도 아니고 거부도 아닌 시선으로 남자를 물끄러미 바라본다.","en":"Jeong Ye-eun looks at the man with a gaze that is neither provocation nor rejection.","text":"Jeong Ye-eun nhìn người đàn ông với ánh mắt không hề khiêu khích hay bác bỏ.\n정예은은 도발도 아니고 거부도 아닌 시선으로 남자를 물끄러미 바라본다.\nJeong Ye-eun looks at the man with a gaze that is neither provocation nor rejection.","sourceUid":"nar-msh4epu4-zku6r3","sourceNo":"N543","viRanges":[],"koRanges":[]},{"id":681,"readerNo":682,"displayNo":"N544","n":"N544","kind":"narration","type":"dialogue","vi":"Người đàn ông: (đứng dậy và đưa tay ra)","ko":"남자: (일어서서 손을 내민다)","en":"Man: (stands up and holds out his hand)","text":"Người đàn ông: (đứng dậy và đưa tay ra)\n남자: (일어서서 손을 내민다)\nMan: (stands up and holds out his hand)","sourceUid":"nar-msh4ff36-d4wylz","sourceNo":"N544","viRanges":[],"koRanges":[]},{"id":682,"readerNo":683,"displayNo":"N545","n":"N545","kind":"narration","type":"narration","vi":"Jeong Ye-eun nhìn vào bàn tay của người đàn ông.","ko":"정예은이 남자의 손을 바라본다.","en":"Jeong Ye-eun looks at the man’s hand.","text":"Jeong Ye-eun nhìn vào bàn tay của người đàn ông.\n정예은이 남자의 손을 바라본다.\nJeong Ye-eun looks at the man’s hand.","sourceUid":"nar-msh4fget-vb4cwn","sourceNo":"N545","viRanges":[],"koRanges":[]},{"id":683,"readerNo":684,"displayNo":"N546","n":"N546","kind":"narration","type":"narration","vi":"Khoảnh khắc cô cố nắm lấy bàn tay đó, một bàn tay khác đã giật lấy Jeong Ye-eun.","ko":"그 손을 잡으려는 순간, 다른 손이 정예은을 채간다.","en":"The moment she tries to grab that hand, another hand snatches Jeong Ye-eun away.","text":"Khoảnh khắc cô cố nắm lấy bàn tay đó, một bàn tay khác đã giật lấy Jeong Ye-eun.\n그 손을 잡으려는 순간, 다른 손이 정예은을 채간다.\nThe moment she tries to grab that hand, another hand snatches Jeong Ye-eun away.","sourceUid":"nar-msh4fi2u-b03gob","sourceNo":"N546","viRanges":[],"koRanges":[]},{"id":684,"readerNo":685,"displayNo":"N547","n":"N547","kind":"narration","type":"narration","vi":"Đó là Kang Ina. Mọi người trong phòng nhìn Kang Ina, người đột nhiên xuất hiện.","ko":"강이나다. 룸 안의 사람들이 갑자기 등장한 강이나를 바라본다.","en":"It's Ms.Kang. People in the room look at Kang Ina, who suddenly appears.","text":"Đó là Kang Ina. Mọi người trong phòng nhìn Kang Ina, người đột nhiên xuất hiện.\n강이나다. 룸 안의 사람들이 갑자기 등장한 강이나를 바라본다.\nIt's Ms.Kang. People in the room look at Kang Ina, who suddenly appears.","sourceUid":"nar-msh4gdx2-9bjq2z","sourceNo":"N547","viRanges":[],"koRanges":[]},{"id":685,"readerNo":686,"displayNo":139,"n":139,"kind":"sub","type":"merged","vi":"Ra ngoài không?\nXin lỗi mọi người vì đã làm phiền. Xin thất lễ một chút.\nĐứng dậy. Đi về nhà.\nKhông thích. Chị là cái thá gì?\nBiết rồi. Về nhà đã tính sau.\nEm không đi! Về để làm gì cơ chứ?\nTôi sẽ vừa chơi vừa uống ở đây.","ko":"나갈래?-흐흐-(강이나) 미안합니다-다들 즐거우신데 죄송합니다\n잠시 실례하겠습니다 [퍽]\n[조용히] 일어나!-집에 가-[화내면서] 아, 싫어!-니가 뭔데?\n알았으니까-집에 가서 얘기해-집에 안 가 가서 뭐할 거야?\n나 여기서 놀 거야 술 마실 거야","en":"Want to get out of here?\nI'm sorry. Sorry to bother you. Excuse me for a second.\nCome on. Let's go home.\nNo, I don't want to! Who do you think you are?\nI get it, so let's talk about it at home.\nI'm not going home! What would I even do there?\nI am going to drink and enjoy myself here.","text":"Ra ngoài không?\nXin lỗi mọi người vì đã làm phiền. Xin thất lễ một chút.\nĐứng dậy. Đi về nhà.\nKhông thích. Chị là cái thá gì?\nBiết rồi. Về nhà đã tính sau.\nEm không đi! Về để làm gì cơ chứ?\nTôi sẽ vừa chơi vừa uống ở đây.\n나갈래?-흐흐-(강이나) 미안합니다-다들 즐거우신데 죄송합니다\n잠시 실례하겠습니다 [퍽]\n[조용히] 일어나!-집에 가-[화내면서] 아, 싫어!-니가 뭔데?\n알았으니까-집에 가서 얘기해-집에 안 가 가서 뭐할 거야?\n나 여기서 놀 거야 술 마실 거야\nWant to get out of here?\nI'm sorry. Sorry to bother you. Excuse me for a second.\nCome on. Let's go home.\nNo, I don't want to! Who do you think you are?\nI get it, so let's talk about it at home.\nI'm not going home! What would I even do there?\nI am going to drink and enjoy myself here.","sourceUid":"merged-mscuhi28-15","sourceNo":431,"viRanges":[{"start":2546.884467,"end":2570.166735}],"koRanges":[{"start":2686.395816,"end":2702.836534}]},{"id":686,"readerNo":687,"displayNo":"N548","n":"N548","kind":"narration","type":"narration","vi":"Khi Kang Ina chỉ tay, những người đàn ông nao núng.","ko":"강이나가 손가락으로 가리키면 남자들 움찔한다.","en":"When Kang Ina points with her finger, the men flinch.","text":"Khi Kang Ina chỉ tay, những người đàn ông nao núng.\n강이나가 손가락으로 가리키면 남자들 움찔한다.\nWhen Kang Ina points with her finger, the men flinch.","sourceUid":"nar-msh4gwwu-mmbh94","sourceNo":"N548","viRanges":[],"koRanges":[]},{"id":687,"readerNo":688,"displayNo":140,"n":140,"kind":"sub","type":"merged","vi":"Em nghĩ rượu ở đây miễn phí à?\nBọn nó điên hay sao mà đãi em uống?\nTôi biết. Biết chứ.\nBiết rõ chứ.\nCô ấy biết kìa. Cô có muốn nhập cuộc không?\nVậy thì thôi.","ko":"야 임마, 이게 공짜 술인 줄 알아? 얘네들이 미쳤다고 술 사주는 줄 알아?\n알아! 안다고\n나도 안다고\n안다는데 같이 놀래?\n안다면야 뭐","en":"Do you think this is free booze?\nWhy do you think they buy you free drinks?\nI know. I know.\nI'm well aware.\nShe knows it well. Do you want to join us, too?\nWhatever, then.","text":"Em nghĩ rượu ở đây miễn phí à?\nBọn nó điên hay sao mà đãi em uống?\nTôi biết. Biết chứ.\nBiết rõ chứ.\nCô ấy biết kìa. Cô có muốn nhập cuộc không?\nVậy thì thôi.\n야 임마, 이게 공짜 술인 줄 알아? 얘네들이 미쳤다고 술 사주는 줄 알아?\n알아! 안다고\n나도 안다고\n안다는데 같이 놀래?\n안다면야 뭐\nDo you think this is free booze?\nWhy do you think they buy you free drinks?\nI know. I know.\nI'm well aware.\nShe knows it well. Do you want to join us, too?\nWhatever, then.","sourceUid":"merged-msculgxc-16","sourceNo":434,"viRanges":[{"st nows what she's doing.\nLet's go. It's a place where people who know each other play together. Get out.\n-Who the hell do you think you are? -Me? I'm her lover.\n-Get out. -Stop it.\nLet go of me! Let go! Let go! It hurts.\nHey, you did that on purpose, didn't you?","text":"- Cậu cứ thế mà đi à? - Nó bảo không đi còn gì, kệ nó đi.\nĐi thôi. Nơi mà chỉ những người sành sỏi mới biết. Đi ra.\n- Cô là cái thá gì vậy? - Tôi? Người yêu nó.\n- Đi ra. - Dừng lại đi.\nBỏ tôi ra! Bỏ ra! Bỏ ra đi! Đau quá.\nNày, em cố tình làm vậy chứ gì?\n(서동주) 그냥 가?-안대잖아, 괜히 택시비만 날리고\n가자, 아는 사람들끼리 아는 얘기하러\n[거친 발소리] (정예은) 아야!\n나와!-(정예은) [비명]\n(남자) 뭐야? 뭔데 이래?-나? 얘 애인이다\n(정예은) [비명]\n[거리 소음] (정예은) 야, 놔, 엄마\n(정예은) 놔, 놔, 놔, 놔 아, 야, 아파, 놔, 아흐\n- (정예은) 우웩-(강이나) 아아!\n(강이나) 야! 너 일부러 그랬지?\n-You're just going to leave? -She says she knows what she's doing.\nLet's go. It's a place where people who know each other play together. Get out.\n-Who the hell do you think you are? -Me? I'm her lover.\n-Get out. -Stop it.\nLet go of me! Let go! Let go! It hurts.\nHey, you did that on purpose, didn't you?","sourceUid":"merged-mscuoew1-18","sourceNo":443,"viRanges":[{"start":2597.727887,"end":2657.159379}],"koRanges":[{"start":2730.804985,"end":2790.072153}]},{"id":701,"readerNo":702,"displayNo":"N560","n":"N560","kind":"narration","type":"narration","vi":"Cánh cửa bật mở.","ko":"문이 벌컥 열린다.","en":"The door bursts open.","text":"Cánh cửa bật mở.\n문이 벌컥 열린다.\nThe door bursts open.","sourceUid":"nar-msh4vnhl-03cmrl","sourceNo":"N560","viRanges":[],"koRanges":[]},{"id":702,"readerNo":703,"displayNo":"N561","n":"N561","kind":"narration","type":"narration","vi":"Kang Ina bước vào và nắm tóc Jeong Ye-eun.","ko":"강이나가 들어오더니 다짜고짜 정예은 머리끄 덩이를 잡는다.","en":"Kang Ina comes in and grabs Jeong Ye-eun by the hair.","text":"Kang Ina bước vào và nắm tóc Jeong Ye-eun.\n강이나가 들어오더니 다짜고짜 정예은 머리끄 덩이를 잡는다.\nKang Ina comes in and grabs Jeong Ye-eun by the hair.","sourceUid":"nar-msh4vons-8vxd7w","sourceNo":"N561","viRanges":[],"koRanges":[] ":"내 몸 안의 염도가 두 배가 되는 한이 있더라도 다 먹을 거야, 내가\n됐어요!-먹는다니까\n안 먹어도 돼요, 줘요!-먹는다니까, 진짜\n(윤종열) 줘 봐, 먹을게\n(김한소영) [날카롭게] 선배!\n당장 그 손 놔요!\n지금 뭐 하는 짓이에요?-뭐가?\n선배 지금 하는 거 성희롱이거든요","en":"I'm going to eat all of this, even if the sodium level doubles in my body.\nNo! Give it! -I will eat it.\nI'm eating it! -Give it back!\nI will eat it. -Stop. You!\nLet go of her hand, right now!\nWhat are you doing right now? -What?\nThat's sexual harassment!","text":"Dù chỉ số muối trong người tăng gấp đôi, anh cũng sẽ ăn.\nThôi! - Anh bảo anh ăn mà!\nAnh sẽ ăn mà! - Đưa em!\nAnh sẽ ăn. - Đừng. Tiền bối!\nBỏ ngay cái tay ra!\n- Anh đang làm gì đấy? - Gì cơ?\nĐiều anh đang làm chính là quấy rối tình dục đấy!\n내 몸 안의 염도가 두 배가 되는 한이 있더라도 다 먹을 거야, 내가\n됐어요!-먹는다니까\n안 먹어도 돼요, 줘요!-먹는다니까, 진짜\n(윤종열) 줘 봐, 먹을게\n(김한소영) [날카롭게] 선배!\n당장 그 손 놔요!\n지금 뭐 하는 짓이에요?-뭐가?\n선배 지금 하는 거 성희롱이거든요\nI'm going to eat all of this, even if the sodium level doubles in my body.\nNo! Give it! -I will eat it.\nI'm eating it! -Give it back!\nI will eat it. -Stop. You!\nLet go of her hand, right now!\nWhat are you doing right now? -What?\nThat's sexual harassment!","sourceUid":"merged-mscylzev-31","sourceNo":494,"viRanges":[{"start":2862.656224,"end":2884.125793}],"koRanges":[{"start":2995.129021,"end":3016.468159}]},{"id":721,"readerNo":722,"displayNo":153,"n":153,"kind":"sub","type":"merged","vi":"Ai cũng trêu ghẹo!\nEm cũng vậy!\nKhông thích thì phải nói ngay chứ!\nVì những đứa mập mờ như em mà quấy rối tình dục mới không hết đấy.\nNày, quấy rối tình dục gì cơ chứ?\n- Bọn tôi là… - Xin lỗi.","ko":"(김한소영) 아무한테나 그냥 집적집적\n너도 똑바로 해\n싫으면 싫다고 말해\n(김한소영) 너처럼 어정쩡하게 구는 애 때문에 성희롱이 끊이지 않는 거야\n야, 성희롱은 무슨\n우리가...미안","en":"Being all touchy-feel with just anyone!\nAnd you, too! Behave yourself.\nIf you don't like it, speak up and say so!\nSexual harassment is still an issue because of girls like you.\nHey, what do you mean by \"sexual harassment\"?\n-We are-- -Sorry.","text":"Ai cũng trêu ghẹo!\nEm cũng vậy!\nKhông thích thì phải nói ngay chứ!\nVì những đứa mập mờ như em mà quấy rối tình dục mới không hết đấy.\nNày, quấy rối tình dục gì cơ chứ?\n- Bọn tôi là… - Xin lỗi.\n(김한소영) 아무한테나 그냥 집적집적\n너도 똑바로 해\n싫으면 싫다고 말해\n(김한소영) 너처럼 어정쩡하게 구는 애 때문에 성희롱이 끊이지 않는 거야\n야, 성희롱은 무슨\n우리가...미안\nBeing all touchy-feel with just anyone!\nAnd you, too! Behave yourself.\nIf you don't like it, speak up and say so!\nSexual harassment is still an issue because of girls like you.\nHey, what do you mean by \"sexual harassment\"?\n-We are-- -Sorry.","sourceUid":"merged-mscyqqcb-33","sourceNo":502,"viRanges":[{"start":2884.125793,"end":2899.234222}],"koRanges":[{"start":3016.468159,"end":3032.265749}]},{"id":722,"readerNo":723,"displayNo":154,"n":154,"kind":"sub","type":"ko","vi":"[tiếng bước chân] [tiếng thở dài]","ko":"[발걸음 소리] [한숨소리]","en":"[sound of footsteps] [sound of sighing]","text":"[tiếng bước chân] [tiếng thở dài]\n[발걸음 소리] [한숨소리]\n[sound of footsteps] [sound of sighing]","sourceUid":"ko-ms9zfai5-1289","sourceNo":662,"viRanges":[],"koRanges":[]},{"id":723,"readerNo":724,"displayNo":155,"n":155,"kind":"sub","type":"merged","vi":"Xin lỗi?\nXin lỗi? Em nói xin lỗi cơ à.\nEm xin lỗi cái gì?\nViệc không gạt tay anh?\nHay vì em không tức giận khi anh \"quấy rối tình dục\"?\nSao em không thể nói?\nRằng \"Anh ấy là người đàn ông của tôi\"? - Em xin lỗi.","ko":"미안?\n아흐, 미안, 미안하단 말이지\n뭐가 미안한데?\n(윤종열) 내 손을 뿌리치지 않은 거?\n(윤종열) 아니, 뭐 성희롱이라고 분연히 떨치고 일어나지 않은 거?\n왜 말을 못해?\n내가 니 남자다\n이 남자가 내 남자다!-(유은재) 미안해요","en":"Sorry?\nSorry? You are sorry.\nWhat are you sorry about?\nThe fact that you didn't push my hand away?\nOr the fact that you weren't angry about being \"sexually harassed\"?\nWhy can't you speak up?\nWhy couldn't you say, \"He's my man\"? -I'm sorry.","text":"Xin lỗi?\nXin lỗi? Em nói xin lỗi cơ à.\nEm xin lỗi cái gì?\nViệc không gạt tay anh?\nHay vì em không tức giận khi anh \"quấy rối tình dục\"?\nSao em không thể nói?\nRằng \"Anh ấy là người đàn ông của tôi\"? - Em xin lỗi.\n미안?\n아흐, 미안, 미안하단 말이지\n뭐가 미안한데?\n(윤종열) 내 손을 뿌리치지 않은 거?\n(윤종열) 아니, 뭐 성희롱이라고 분연히 떨치고 일어나지 않은 거?\n왜 말을 못해?\n내가 니 남자다\n이 남자가 내 남자다!-(유은재) 미안해요\nSorry?\nSorry? You are sorry.\nWhat are you sorry about?\nThe fact that you didn't push my hand away?\nOr the fact that you weren't angry about being \"sexually harassed\"?\nWhy can't you speak up?\nWhy couldn't you say, \"He's my man\"? -I'm sorry.","sourceUid":"merged-mscyslx1-34","sourceNo":507,"viRanges":[{"start":2899.234222,"end":2933.913224}],"koRanges":[{"start":3032.265749,"end":3067.005704}]},{"id":724,"readerNo":725,"displayNo":"N570","n":"N570","kind":"narration","type":"narration","vi":". Bến xe buýt (ban ngày)","ko":". 버스 정거장(낮)","en":". Bus stop (daytime)","text":". Bến xe buýt (ban ngày)\n. 버스 정거장(낮)\n. Bus stop (daytime)","sourceUid":"nar-msh55m83-5vkabh","sourceNo":"N570","viRanges":[],"koRanges":[]},{"id":725,"readerNo":726,"displayNo":"N571","n":"N571","kind":"narration","type":"narration","vi":"Yoon Jong-yeol nhìn Yoo Eun-jae với ánh mắt giống như trong cảnh trước.","ko":"앞 신과 똑같은 눈빛으로 윤종열이 유은재를 쳐다본다.","en":"Yoon Jong-yeol looks at Yoo Eun-jae with the same eyes as in the previous scene.","text":"Yoon Jong-yeol nhìn Yoo Eun-jae với ánh mắt giống như trong cảnh trước.\n앞 신과 똑같은 눈빛으로 윤종열이 유은재를 쳐다본다.\nYoon Jong-yeol looks at Yoo Eun-jae with the same eyes as in the previous scene.","sourceUid":"nar-msh55njk-h7ten1","sourceNo":"N571","viRanges":[],"koRanges":[]},{"id":726,"readerNo":727,"displayNo":"N572","n":"N572","kind":"narration","type":"narration","vi":"Eunjae Yoo đứng cúi đầu.","ko":"유은재는 고개를 푹 숙인 채 서 있다.","en":"Eunjae Yoo stands with his head bowed.","text":"Eunjae Yoo đứng cúi đầu.\n유은재는 고개를 푹 숙인 채 서 있다.\nEunjae Yoo stands with his head bowed.","sourceUid":"nar-msh55pfj-4bfvi6","sourceNo":"N572","viRanges":[],"koRanges":[]},{"id":727,"readerNo":728,"displayNo":"N573","n":"N573","kind":"narration","type":"dialogue","vi":"Jong-yeol Yoon: (Càng nghĩ về điều đó, nó càng trở nên vô lý) Xin lỗi?","ko":"윤종열: (생각할수록 어이없다) 미안?","en":"Jong-yeol Yoon: (The more he thinks ":"sub","type":"merged","vi":"Em xấu hổ vì anh? - Không phải vậy.\n- Không phải. - Vậy thì sao?\nChuyện này…\nVì em vẫn chưa dám tin là thật.\nViệc anh thích em như lời nói dối vậy.","ko":"너 혹시 내가 창피하냐?-아뇨\n그건 아닌데...그런데?\n(유은재) [한숨소리]\n그게요\n아직 실감이 안 나요\n선배가 나를 좋아하는 게 거짓말 같고","en":"-Are you ashamed of me? -No! That's not it.\n-That's not it. -Then, why?\nWell...\nIt still hasn't hit me yet.\nThe fact that you like me feels like a lie...","text":"Em xấu hổ vì anh? - Không phải vậy.\n- Không phải. - Vậy thì sao?\nChuyện này…\nVì em vẫn chưa dám tin là thật.\nViệc anh thích em như lời nói dối vậy.\n너 혹시 내가 창피하냐?-아뇨\n그건 아닌데...그런데?\n(유은재) [한숨소리]\n그게요\n아직 실감이 안 나요\n선배가 나를 좋아하는 게 거짓말 같고\n-Are you ashamed of me? -No! That's not it.\n-That's not it. -Then, why?\nWell...\nIt still hasn't hit me yet.\nThe fact that you like me feels like a lie...","sourceUid":"merged-mscywrat-36","sourceNo":520,"viRanges":[{"start":2956.603466,"end":2975.100895}],"koRanges":[{"start":3089.796089,"end":3107.27491}]},{"id":731,"readerNo":732,"displayNo":158,"n":158,"kind":"sub","type":"merged","vi":"[Âm nhạc nhẹ nhàng và ngọt ngào]\nViệc có người thích cũng giống như một giấc mơ.\nEm cũng muốn khoe với người khác, nhưng lại nghĩ thế là không được.\nVì cũng là lần đầu tiên em thích một người nên…\nEm vừa sợ vừa bất an.\nEm không biết phải làm sao nữa.\nEm làm anh bức bối lắm nhỉ?","ko":"[부드럽고 달콤한 음악]\n누가 나를 좋아한다는 게 꿈 같기도 하고\n(유은재) 누구한테나 다 자랑하고 싶다가도 또 그건 안 될 것 같고\n누굴 이렇게 좋아하는 게 처음이라서\n(유은재) 좋기도 하고 불안하기도 하고\n아휴, 어떻게 해야 될지 모르겠어요\n나 되게 답답하죠?","en":"[Soft and sweet music]\nAnd the fact that someone likes me makes me feel like I'm dreaming.\nI want to show you off, but I feel like I shouldn't.\nAnd it's the first time I've ever liked someone like this, so...\nit makes me happy but it also scares me.\nI don't know what I should do.\nI'm quite a frustrating person.","text":"[Âm nhạc nhẹ nhàng và ngọt ngào]\nViệc có người thích cũng giống như một giấc mơ.\nEm cũng muốn khoe với người khác, nhưng lại nghĩ t à phê. Anh ấy chỉ ngước mắt lên và nhìn Jeong Ye-eun) ...","ko":"고두영: (마침 커피를 마시는 중이다. 눈만 들어 정예은을 본다) ···.","en":"Go Doo-young: (Right now he's drinking coffee. He just raises his eyes and looks at Jeong Ye-eun) ...","text":"Go Doo-young: (Lúc này anh ấy đang uống cà phê. Anh ấy chỉ ngước mắt lên và nhìn Jeong Ye-eun) ...\n고두영: (마침 커피를 마시는 중이다. 눈만 들어 정예은을 본다) ···.\nGo Doo-young: (Right now he's drinking coffee. He just raises his eyes and looks at Jeong Ye-eun) ...","sourceUid":"nar-msh5d1y7-iaccby","sourceNo":"N606","viRanges":[],"koRanges":[]},{"id":771,"readerNo":772,"displayNo":166,"n":166,"kind":"sub","type":"merged","vi":"[Như chưa có chuyện gì xảy ra]\nAnh lại muộn rồi. Vì em gọi đột xuất đấy thôi.\nSao? Em có gì muốn nói? Nói đi.\nUống cà phê trước đã.\nDạo này em khiến anh không ưng lắm nhé.\nCho tôi một americano đá. - Vâng. Anh à. Sao? Mình chia tay đi.\n[Âm nhạc cô đơn bắt đầu]\nEm đùa à? - Không. Cảm ơn anh thời gian qua. Tạm biệt.","ko":"[아무렇지 않은 듯]\n오늘도 늦었네\n갑자기 연락하니까 그러지\n왜? 할 얘기 뭔데? (고두영) 해! 커피 마시고\n아, 너 요새 마음에 안 들어\n(고두영) 저, 아이스 아메리카노 - (종업원) 네\n오빠! 왜? 우리 헤어져. 우리 헤어지자\n[쓸쓸한 분위기의 음악 시작]\n장난하냐? - 아니\n오빠, 그동안 고마웠어. 안녕","en":"[As if nothing had happened]\nYou are late again.\nIt's because you called me out suddenly.\nWhat? What do you need to talk about?\nGo ahead.\nLet me drink my coffee first.\nYou've really been getting on my nerves lately.\nCan I get an iced Americano, please? -Yes, sir. Honey. Sao? What? Let's break up.\n[Lonely music starts]-Is this a joke? -No. Thanks for everything. Goodbye.","text":"[Như chưa có chuyện gì xảy ra]\nAnh lại muộn rồi. Vì em gọi đột xuất đấy thôi.\nSao? Em có gì muốn nói? Nói đi.\nUống cà phê trước đã.\nDạo này em khiến anh không ưng lắm nhé.\nCho tôi một americano đá. - Vâng. Anh à. Sao? Mình chia tay đi.\n[Âm nhạc cô đơn bắt đầu]\nEm đùa à? - Không. Cảm ơn anh thời gian qua. Tạm biệt.\n[아무렇지 않은 듯]\n오늘도 늦었네\n갑자기 연락하니까 그러지\n왜? 할 얘기 뭔데? (고두영) 해! 커피 마시고\n아, 너 요새 마음에 안 들어\n(고두영) 저, 아이스 아메리카노 - (종업원) 네\n오빠! 왜? 우리 헤어져.
